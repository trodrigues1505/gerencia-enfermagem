  if(!h1||!h2) return "";
  try {

function useToast(){
  const [ts,setTs]=useState([]);
  const push=useCallback((msg,type="ok")=>{
    const id=Date.now();
    setTs(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),4000);
  },[]);
  return {ts,push};
}

// Navegacao por teclado entre celulas
function navigateCell(currentTd, direction){
  const td=currentTd.closest("td");
  if(!td)return;
  const tr=td.closest("tr");
  const tbody=tr.closest("tbody");
  const tds=[...tr.querySelectorAll("td")];
  const colIdx=tds.indexOf(td);
  const rows=[...tbody.querySelectorAll("tr")];
  const rowIdx=rows.indexOf(tr);
  let targetTd=null;
  if(direction==="right"){targetTd=tds[colIdx+1];}
  else if(direction==="left"){targetTd=tds[colIdx-1];}
  else if(direction==="down"){const nr=rows[rowIdx+1];if(nr){const ntds=[...nr.querySelectorAll("td")];targetTd=ntds[colIdx];}}
  else if(direction==="up"){const nr=rows[rowIdx-1];if(nr){const ntds=[...nr.querySelectorAll("td")];targetTd=ntds[colIdx];}}
  if(targetTd){
    // fecha a celula atual e abre a proxima
    const clickable=targetTd.querySelector("[data-nav]")||targetTd.querySelector("div[title='Clique para editar']");
    if(clickable)clickable.click();
    targetTd.scrollIntoView({block:"nearest",inline:"nearest"});
  }
}

// Célula editável — texto quebra na célula
function Cell({rowId,field,value,tipo,optsKey,onSave}){
  const [ed,setEd]=useState(false);
  const [val,setVal]=useState(value||"");
  const [free,setFree]=useState(false);
  const ref=useRef();
  const wrapRef=useRef();
  const OPTS_MAP={S_OPTS,G_OPTS,ST_OPTS,P_OPTS,A_OPTS};
  const opts=optsKey?OPTS_MAP[optsKey]:null;
  useEffect(()=>{setVal(value||"");},[value]);
  useEffect(()=>{if(ed&&ref.current)ref.current.focus();},[ed]);
  function commit(){setEd(false);setFree(false);if(val!==(value||""))onSave(rowId,field,val);}
  function handleKeyNav(e){
    const el=wrapRef.current;
    if(e.key==="Tab"){e.preventDefault();commit();navigateCell(el,e.shiftKey?"left":"right");}
    else if(e.key==="ArrowDown"&&!e.shiftKey){e.preventDefault();commit();navigateCell(el,"down");}
    else if(e.key==="ArrowUp"&&!e.shiftKey){e.preventDefault();commit();navigateCell(el,"up");}
    else if(e.key==="ArrowRight"&&e.ctrlKey){e.preventDefault();commit();navigateCell(el,"right");}
    else if(e.key==="ArrowLeft"&&e.ctrlKey){e.preventDefault();commit();navigateCell(el,"left");}
  }
  // Readonly (calculado)
  if(tipo==="ro") return(
    <div style={{padding:"2px 6px",fontSize:10,color:value?"#7C3AED":"#CBD5E1",fontWeight:value?700:400,whiteSpace:"nowrap"}}>{value||"—"}</div>
  );
  if(!ed) return(
    <div ref={wrapRef} data-nav="1" style={{padding:"2px 6px",minHeight:24,display:"flex",alignItems:"center",cursor:"pointer",fontSize:11,
      wordBreak:"break-word",whiteSpace:"normal",lineHeight:1.3,color:val?"#374151":"#CBD5E1",fontStyle:val?"normal":"italic"}}
      onClick={()=>setEd(true)} title="Clique para editar">
      {val||"—"}
    </div>
  );
  if(opts && !free) return(
    <div ref={wrapRef}>
    <select ref={ref} style={{width:"100%",height:"100%",minHeight:24,padding:"2px 4px",border:"none",
      borderLeft:"2px solid #3B82F6",background:"#EFF6FF",fontSize:10,color:"#0F172A",outline:"none",appearance:"none",cursor:"pointer"}}
      value={val} onChange={e=>{if(e.target.value==="__free__"){setFree(true);setVal("");}else setVal(e.target.value);}}
      onBlur={commit}
      onKeyDown={e=>{
        if(e.key==="Escape"){setEd(false);setVal(value||"");return;}
        if(e.key==="Enter"){commit();return;}
        handleKeyNav(e);
      }}>
      <option value="">—</option>
      {opts.map(o=>{
        const g=field==="gravidade"?gravInfo(o):null;
        return <option key={o} value={o}>{g?g.label:o}</option>;
      })}
      <option value="__free__">✏️ Digitar…</option>
    </select>
    </div>
  );
  return(
    <div ref={wrapRef}>
    <input ref={free?ref:null} style={{width:"100%",minHeight:24,padding:"2px 6px",border:"none",
      borderLeft:"2px solid #3B82F6",background:"#EFF6FF",fontSize:11,color:"#0F172A",outline:"none"}}
      type={tipo==="sel"?"text":tipo||"text"} value={val}
      placeholder={free?"Digite o valor...":""}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>{
        if(e.key==="Enter"){commit();return;}
        if(e.key==="Escape"){setEd(false);setVal(value||"");setFree(false);return;}
        handleKeyNav(e);
      }}/>
    </div>
  );
}

// Modal importar do kanban — qualquer card, de qualquer coluna
function KanbanImportModal({onClose,onImport}){
  const [cols,setCols]=useState([]);
  const [cards,setCards]=useState([]);
  const [load,setLoad]=useState(true);
  const [sel,setSel]=useState(new Set());
  const [filterCol,setFilterCol]=useState("all");
  const [q,setQ]=useState("");
  useEffect(()=>{
    Promise.all([
      dbGet("columns?select=*&order=col_order.asc").catch(()=>[]),
      dbGet("cards?select=*&order=created_at.asc").catch(()=>[]),
    ]).then(([c,cd])=>{
      setCols(Array.isArray(c)?c:[]);
      setCards(Array.isArray(cd)?cd:[]);
    }).finally(()=>setLoad(false));
  },[]);
  const colLabel=useMemo(()=>{
    const m={};
    cols.forEach(c=>{m[c.id]=c.label||c.id;});
    return m;
  },[cols]);
  const filtered=useMemo(()=>{
    let list=cards;
    if(filterCol!=="all") list=list.filter(c=>c.col_id===filterCol);
    if(q.trim()){
      const t=q.trim().toLowerCase();
      list=list.filter(c=>[c.nome,c.setor,c.hosp,c.ficha_cross].some(v=>(v||"").toLowerCase().includes(t)));
    }
    return list;
  },[cards,filterCol,q]);
  const allSel=filtered.length>0&&filtered.every(c=>sel.has(c.id));
  function toggleAll(){
    setSel(s=>{
      const n=new Set(s);
      if(allSel) filtered.forEach(c=>n.delete(c.id));
      else filtered.forEach(c=>n.add(c.id));
      return n;
    });
  }
  function toggle(id){setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});}
  return(
    <div className="mbk">
      <div className="mdl" style={{maxWidth:560}}>
        <div className="mhd">
          <div><h2>📋 Importar do Kanban</h2><p>Selecione qualquer card do quadro, de qualquer coluna</p></div>
          <button className="btn btn-g btn-sm" onClick={onClose}><Ico n="x" s={12}/></button>
        </div>
        <div className="mbd">
          <div style={{marginBottom:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select className="fsel" value={filterCol} onChange={e=>setFilterCol(e.target.value)}>
              <option value="all">Todas as colunas</option>
              {cols.map(c=><option key={c.id} value={c.id}>{c.label||c.id}</option>)}
            </select>
            <div className="sw">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input className="si" style={{width:160}} placeholder="Buscar paciente..." value={q} onChange={e=>setQ(e.target.value)}/>
            </div>
            {filtered.length>0&&
              <button className="btn btn-g btn-sm" onClick={toggleAll}>{allSel?"☐ Desmarcar todos":"☑ Selecionar todos"} ({filtered.length})</button>
            }
            <span style={{fontSize:11,color:"#64748B"}}>{sel.size} selecionado{sel.size!==1?"s":""}</span>
          </div>
          {load&&<div className="empty"><Ico n="pulse" s={24}/><p>Carregando…</p></div>}
          {!load&&filtered.length===0&&<div className="empty"><p>Nenhum card encontrado.</p></div>}
          {filtered.map(c=>{
            const s=sel.has(c.id);
            const gi=gravInfo(c.grav||"urgencia");
            return(
              <div key={c.id} className={`ccard ${s?"sel":""}`} onClick={()=>toggle(c.id)}>
                <div className="cchk">{s&&<Ico n="check" s={10}/>}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:12,color:"#0F172A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}{c.idade?` — ${c.idade}`:""}</div>
                  <div style={{fontSize:10,color:"#64748B",marginTop:1}}>{[c.setor,c.rec,c.hosp].filter(Boolean).join(" · ")||"—"}</div>
                  {c.hd&&<div style={{fontSize:10,color:"#94A3B8"}}>HD: {c.hd}</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3,flexShrink:0}}>
                  <span style={{padding:"1px 6px",borderRadius:99,fontSize:9,fontWeight:700,background:gi.bg,color:gi.fc,border:`1px solid ${gi.bd}`,whiteSpace:"nowrap"}}>{gi.label}</span>
                  <span style={{fontSize:9,color:"#94A3B8",fontWeight:600,whiteSpace:"nowrap"}}>{colLabel[c.col_id]||c.col_id||"—"}</span>
                </div>
              </div>
            );
          })}
        </div>
        <div className="mft">
          <button className="btn btn-g" onClick={onClose}>Cancelar</button>
          <button className="btn btn-p" disabled={sel.size===0} onClick={()=>{onImport(cards.filter(c=>sel.has(c.id)));onClose();}}>
            Importar {sel.size>0?`${sel.size} card${sel.size>1?"s":""}`:""}</button>
        </div>
      </div>
    </div>
  );
}

// Normaliza texto p/ comparar cabeçalhos (sem acento, minúsculo, sem espaço extra)
function normHdr(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
}

// Mapa reverso label -> chave interna de gravidade (para aceitar valores exportados/copiados do Excel,
// que mostram o rótulo "MENOR GRAVIDADE" em vez da chave "menor_gravidade")
const GRAV_LABEL_TO_KEY=(()=>{
  const m={};
  Object.entries(GRAV_MAP).forEach(([k,v])=>{ m[normHdr(v.label)]=k; m[normHdr(k)]=k; });
  return m;
})();
// Mapa final: qualquer representação -> valor aceito pelo banco (VERMELHO/AMARELO/VERDE/CINZA)
const GRAV_TO_DB={
  emergencia:"VERMELHO",urgencia:"AMARELO",menor_gravidade:"VERDE",agendamento:"CINZA",
  VERMELHO:"VERMELHO",AMARELO:"AMARELO",VERDE:"VERDE",CINZA:"CINZA",
};
function normalizeGravValue(v){
  if(!v)return null;
  // 1) tenta label em portugues (ex: "EMERGENCIA" -> "emergencia")
  const intermediate=GRAV_LABEL_TO_KEY[normHdr(v)];
  const key=intermediate||v;
  // 2) converte para o valor aceito pelo banco
  const dbVal=GRAV_TO_DB[key]||GRAV_TO_DB[normHdr(key)];
  return dbVal||null;
}

// Converte data em varios formatos (DD/MM/YYYY, DD/MM/YY, YYYY-MM-DD) para ISO YYYY-MM-DD
// Retorna null se o valor nao for reconhecivel como data valida
function normalizeDateValue(v){
  if(!v)return null;
  v=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v; // ja e ISO
  const br=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(br){
    let [,d,m,y]=br;
    if(y.length===2)y="20"+y;
    return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  return null; // nao reconhecido (ex: "N/A", texto livre) -> null para nao quebrar o banco
}

// Normaliza horario: aceita HH:MM ou HH:MM:SS, retorna HH:MM ou null
function normalizeTimeValue(v){
  if(!v)return null;
  v=String(v).trim();
  // HH:MM:SS -> HH:MM
  const full=v.match(/^(\d{1,2}):(\d{2}):\d{2}$/);
  if(full)return `${full[1].padStart(2,"0")}:${full[2]}`;
  // HH:MM
  if(/^\d{1,2}:\d{2}$/.test(v))return v;
  return null; // nao e horario valido
}

// Normaliza tipo_ambulancia para os valores aceitos pelo banco
function normalizeAmbValue(v){
  if(!v)return null;
  // remove acentos e compara
  const u=String(v).trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(u==="BASICA"||u==="BASICO")return "B\u00c1SICA";
  if(u==="AVANCADA"||u==="AVANCADO")return "AVAN\u00c7ADA";
  if(u==="UTI")return "UTI";
  // ja veio com acento certo
  const orig=String(v).trim().toUpperCase();
  if(orig==="B\u00c1SICA")return "B\u00c1SICA";
  if(orig==="AVAN\u00c7ADA")return "AVAN\u00c7ADA";
  return null;
}

const DATE_FIELDS=new Set(COLS.filter(([,,,,tipo])=>tipo==="date").map(([f])=>f));
const TIME_FIELDS=new Set(COLS.filter(([,,,,tipo])=>tipo==="time").map(([f])=>f));
function normalizeRowValues(row){
  const out={...row};
  if(out.gravidade!==undefined)out.gravidade=normalizeGravValue(out.gravidade);
  if(out.tipo_ambulancia!==undefined)out.tipo_ambulancia=normalizeAmbValue(out.tipo_ambulancia);
  Object.keys(out).forEach(f=>{
    if(DATE_FIELDS.has(f))out[f]=normalizeDateValue(out[f]);
    if(TIME_FIELDS.has(f))out[f]=normalizeTimeValue(out[f]);
  });
  // remove campos null/undefined para nao mandar strings vazias ao banco
  Object.keys(out).forEach(f=>{ if(out[f]===null||out[f]==="")delete out[f]; });
  return out;
}

// Modal: colar dados copiados do Excel (TSV) e importar como novos registros
function PasteModal({onClose,onImport}){
  const [txt,setTxt]=useState("");
  const [busy,setBusy]=useState(false);
  const HDR_MAP=useMemo(()=>{
    const m={};
    COLS.forEach(([f,planilha,xls])=>{ m[normHdr(planilha)]=f; m[normHdr(xls)]=f; });
    return m;
  },[]);
  function parse(){
    const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="");
    if(lines.length===0)return [];
    const firstCells=lines[0].split("\t").map(normHdr);
    const matched=firstCells.filter(c=>HDR_MAP[c]).length;
    const hasHeader = matched>=Math.max(2,Math.floor(firstCells.length*0.4));
    let fieldOrder;
    let dataLines;
    if(hasHeader){
      fieldOrder=firstCells.map(c=>HDR_MAP[c]||null);
      dataLines=lines.slice(1);
    }else{
      // sem cabeçalho reconhecível: assume a mesma ordem das colunas da planilha
      fieldOrder=COLS.map(([f])=>f);
      dataLines=lines;
    }
    return dataLines.map(line=>{
      const cells=line.split("\t");
      const row={};
      fieldOrder.forEach((f,i)=>{ if(f && cells[i]!==undefined && cells[i]!=="") row[f]=cells[i].trim(); });
      return normalizeRowValues(row);
    }).filter(r=>Object.keys(r).length>0);
  }
  async function doImport(){
    const rows=parse();
    if(rows.length===0){alert("Nada reconhecível para importar. Cole os dados copiados do Excel (incluindo a linha de cabeçalho, se possível).");return;}
    setBusy(true);
    await onImport(rows);
    setBusy(false);
  }
  const preview=txt.trim()?parse():[];
  return(
    <div className="mbk">
      <div className="mdl" style={{maxWidth:640}}>
        <div className="mhd">
          <div><h2>Colar da planilha (Excel)</h2><p>Copie as células no Excel e cole aqui</p></div>
          <button className="btn btn-g btn-sm" onClick={onClose}><Ico n="x" s={13}/></button>
        </div>
        <div className="mbd">
          <div className="fsc">
            <textarea rows={10} value={txt} onChange={e=>setTxt(e.target.value)}
              placeholder="Cole aqui (Ctrl+V) as linhas copiadas do Excel. Se a primeira linha for o cabeçalho das colunas, ele será reconhecido automaticamente."
              style={{width:"100%",padding:"8px 10px",border:"1px solid #E2E8F0",borderRadius:7,fontSize:12,fontFamily:"monospace",resize:"vertical",outline:"none"}}/>
          </div>
          {txt.trim()&&<div style={{fontSize:11,color:"#64748B"}}>{preview.length} linha{preview.length!==1?"s":""} reconhecida{preview.length!==1?"s":""} para importar.</div>}
        </div>
        <div className="mft">
          <button className="btn btn-g" onClick={onClose}>Cancelar</button>
          <button className="btn btn-p" disabled={busy||!txt.trim()} onClick={doImport}>{busy?"Importando…":`Importar ${preview.length||""}`}</button>
        </div>
      </div>
    </div>
  );
}

// Hook resize de colunas — usa mousedown no header
function useColResize(initW){
  const [ws,setWs]=useState(initW);
  const drag=useRef(null);
  function startDrag(idx,e){
    e.preventDefault();
    e.stopPropagation();
    const sx=e.clientX, sw=ws[idx];
    drag.current={idx,sx,sw};
    function mv(e){
      if(!drag.current)return;
      const {idx,sx,sw}=drag.current;
      const nw=Math.max(40,sw+(e.clientX-sx));
      setWs(w=>{const n=[...w];n[idx]=nw;return n;});
    }
    function up(){drag.current=null;window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);}
    window.addEventListener("mousemove",mv);
    window.addEventListener("mouseup",up);
  }
  return {ws,startDrag};
}

    <div className={cls} ref={ref}>
      <button className="btn spb-main" onClick={onMain}>
        {icon&&<Ico n={icon} s={13}/>}{label}
      </button>
      <button ref={arrRef} className="btn spb-arr" onClick={()=>setOpen(o=>!o)} title="Mais opções">
        <ChevronDown/>
      </button>
      <div className="spb-drop" style={open?{top:pos.top,right:pos.right}:{}}>
        {items.map((it,i)=>
          it==="---"
            ?<div key={i} className="spb-sep"/>
            :<button key={i} className="spb-item" onClick={()=>{it.action();setOpen(false);}}>
                <Ico n={it.icon||"download"} s={13}/>{it.label}
              </button>
        )}
      </div>
    </div>
  );
}

function App(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [modal,setModal]=useState(null);
  const [showKanbanImport,setShowKanbanImport]=useState(false);
  const jsonFileRef=useRef(null);
  const [search,setSearch]=useState("");
  const [fG,setFG]=useState("");
  const [fS,setFS]=useState("");
  const [fM,setFM]=useState("");
  const [sc,setSc]=useState("created_at");
  const [sd,setSd]=useState("desc");
  const {ts,push}=useToast();

  // Colunas arrastáveis: +1 para #, +1 para ações
  const {ws,startDrag}=useColResize([32,...COLS.map(([,,,,,,,w])=>w||100),36]);

  const load=useCallback(async()=>{
    setLoading(true);
    try{const d=await dbGet("remocoes?select=*&order=created_at.desc");setRows(Array.isArray(d)?d:[]);}
    catch(e){push("Erro: "+e.message,"err");}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[]);

  const handleSave=async(form)=>{
    setSaving(true);
    try{
      let p={...form};
      if(p.hora_solic_ambulancia&&p.horario_saida_ambulancia&&!p.tempo_espera)
        p.tempo_espera=calcTempo(p.hora_solic_ambulancia,p.horario_saida_ambulancia);
      if(p.horario_saida_ambulancia&&p.horario_retorno&&!p.duracao_remocao)
        p.duracao_remocao=calcTempo(p.horario_saida_ambulancia,p.horario_retorno);
      // normaliza gravidade e tipo_ambulancia para os valores aceitos pelo banco
      if(p.gravidade!==undefined&&p.gravidade!==null&&p.gravidade!=="")
        p.gravidade=normalizeGravValue(p.gravidade)||null;
      if(p.tipo_ambulancia!==undefined&&p.tipo_ambulancia!==null&&p.tipo_ambulancia!=="")
        p.tipo_ambulancia=normalizeAmbValue(p.tipo_ambulancia)||null;
      Object.keys(p).forEach(k=>{if(p[k]==="")p[k]=null;});
      if(form.id){await api({action:"update",id:form.id,...p});push("Atualizado");}
      else{await api({action:"create",...p});push("Criado!");}
      setModal(null);await load();
    }catch(e){push(e.message||"Erro","err");}
    finally{setSaving(false);}
  };

  const handleCell=async(rowId,field,value)=>{
    try{
      const u={action:"update",id:rowId,[field]:value||null};
      const row=rows.find(r=>r.id===rowId);
      if(row){
        const hs=field==="hora_solic_ambulancia"?value:row.hora_solic_ambulancia;
        const hsa=field==="horario_saida_ambulancia"?value:row.horario_saida_ambulancia;
        const hr=field==="horario_retorno"?value:row.horario_retorno;
        const te=calcTempo(hs,hsa);
        const dur=calcTempo(hsa,hr);
        if(te)u.tempo_espera=te;
        if(dur)u.duracao_remocao=dur;
      }
      await api(u);
      setRows(r=>r.map(x=>x.id===rowId?{...x,[field]:value,...(u.tempo_espera?{tempo_espera:u.tempo_espera}:{}),...(u.duracao_remocao?{duracao_remocao:u.duracao_remocao}:{})}:x));
    }catch(e){push(e.message,"err");}
  };

  const handleDelete=async(id)=>{
    if(!id){push("Este registro não tem ID válido — recarregue a página e tente novamente.","err");return;}
    if(!confirm("Excluir este registro permanentemente?"))return;
    try{
      await api({action:"delete",id});
      push("Excluído");
      setRows(r=>r.filter(x=>x.id!==id));
    }catch(e){
      push("Erro ao excluir: "+(e.message||"desconhecido")+" — recarregando a lista.","err");
      await load();
    }
  };

  const handleDeleteAll=async()=>{
    if(rows.length===0)return;
    const conf=prompt(`Isso vai excluir TODOS os ${rows.length} registros da planilha, permanentemente. Digite EXCLUIR para confirmar:`);
    if(conf!=="EXCLUIR")return;
    setSaving(true);
    let ok=0,fail=0;
    for(const r of rows){
      try{await api({action:"delete",id:r.id});ok++;}
      catch{fail++;}
    }
    setSaving(false);
    push(`${ok} registro${ok!==1?"s":""} excluído${ok!==1?"s":""}${fail>0?` (${fail} falharam)`:""}`,fail>0?"err":"ok");
    await load();
  };

  const [showPaste,setShowPaste]=useState(false);
  const [activeRow,setActiveRow]=useState(null);

  // O Kanban usa gravidades extras (andamento_cor, finalizado_cor) que não existem
  // no enum de gravidade da planilha de remoções — isso causava erro 500 ao importar
  // pela importação do Kanban. Mapeamos para o valor equivalente mais próximo aceito pela planilha.
  // O banco aceita APENAS: VERMELHO, AMARELO, VERDE, CINZA.
  // O kanban usa chaves minúsculas e extras — tudo mapeado aqui.
  const KANBAN_TO_DB_GRAV={
    emergencia:"VERMELHO",urgencia:"AMARELO",menor_gravidade:"VERDE",
    agendamento:"CINZA",andamento_cor:"AMARELO",finalizado_cor:"CINZA",retorno:"CINZA",
    VERMELHO:"VERMELHO",AMARELO:"AMARELO",VERDE:"VERDE",CINZA:"CINZA",
  };
  function normalizeKanbanGrav(v){
    if(!v)return "AMARELO";
    return KANBAN_TO_DB_GRAV[v]||"AMARELO";
  }

  const handleImport=async(cards)=>{
    let ok=0;
    const fails=[];
    for(const c of cards){
      try{
        const hoje=new Date().toISOString().split("T")[0];
        const agora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        await api({action:"create",nome_paciente:c.nome||"",setor:c.setor||"",especialidade:c.rec||"",diagnostico:c.hd||"",instituicao_destino:c.hosp||c.unidade_receptora||"",tipo_ambulancia:AM[c.amb]||"",gravidade:normalizeKanbanGrav(c.grav),data_solicitacao:hoje,horario_solicitacao:c.hora_adm||agora,ficha_cross:c.ficha_cross||"",medico:c.medico_solic||"",horario_saida_ambulancia:c.saida||"",horario_retorno:c.retorno||"",data_resposta_cross:c.data_resolucao||"",horario_resposta_cross:c.hora_resolucao||"",status:"PACIENTE AGUARDANDO AMBULÂNCIA"});
        ok++;
      }catch(e){fails.push({nome:c.nome||"(sem nome)",erro:e.message||"erro desconhecido"});}
    }
    const total=ok+fails.length;
    push(`${ok}/${total} importado${ok!==1?"s":""}`,fails.length>0?"err":"ok");
    setImportErrors({tipo:"Kanban",ok,total,itens:fails});
    await load();
  };

  const FIELDS=COLS.map(([f])=>f);
  const handleImportJSON=async(file)=>{
    if(!file)return;
    try{
      const text=await file.text();
      const json=JSON.parse(text);
      let items=[];
      if(Array.isArray(json))items=json;
      else if(Array.isArray(json.remocoes))items=json.remocoes;
      else{push("JSON inválido: nenhum dado de remoção encontrado no arquivo.","err");return;}
      if(items.length===0){push("Nenhum registro encontrado no arquivo.","err");return;}
      let ok=0;
      const fails=[];
      for(const item of items){
        try{
          const p={};
          FIELDS.forEach(f=>{if(item[f]!==undefined&&item[f]!==null&&item[f]!=="")p[f]=item[f];});
          if(Object.keys(p).length===0)continue;
          await api({action:"create",...normalizeRowValues(p)});
          ok++;
        }catch(e){fails.push({nome:item.nome_paciente||"(sem nome)",erro:e.message||"erro desconhecido"});}
      }
      const total=ok+fails.length;
      push(`${ok}/${total} importado${ok!==1?"s":""} do JSON`,fails.length>0?"err":"ok");
      setImportErrors({tipo:"Importar JSON",ok,total,itens:fails});
      await load();
    }catch(e){push("Erro ao ler arquivo JSON: "+e.message,"err");}
  };

  const [importErrors,setImportErrors]=useState(null); // {tipo, ok, total, itens:[{nome,erro}]}
  const [exportResult,setExportResult]=useState(null); // {tipo, total, filename}
  const [showDuplicates,setShowDuplicates]=useState(false);

  const handleImportPaste=async(pastedRows)=>{
    let ok=0;
    const fails=[];
    for(const p of pastedRows){
      try{await api({action:"create",...p});ok++;}
      catch(e){fails.push({nome:p.nome_paciente||"(sem nome)",erro:e.message||"erro desconhecido"});}
    }
    const total=ok+fails.length;
    push(`${ok}/${total} importado${ok!==1?"s":""} da planilha`,fails.length>0?"err":"ok");
    setImportErrors({tipo:"Colar do Excel",ok,total,itens:fails});
    setShowPaste(false);
    await load();
  };

  const [blankRowId,setBlankRowId]=useState(null);
  const handleAddBlank=async()=>{
    try{
      await api({action:"create"});
      const latest=await dbGet("remocoes?select=id&order=created_at.desc&limit=1");
      const newId=Array.isArray(latest)&&latest[0]?latest[0].id:null;
      push("Linha em branco criada — cole os dados copiados do Excel nela.");
      setBlankRowId(newId);
      await load();
    }catch(e){push("Erro ao criar linha: "+(e.message||"desconhecido"),"err");}
  };
  const handlePasteIntoRow=async(rowId)=>{
    try{
      const text=await navigator.clipboard.readText();
      if(!text||!text.trim()){push("Área de transferência vazia. Copie a linha no Excel primeiro (Ctrl+C).","err");return;}
      const cells=text.replace(/\r/g,"").split("\n")[0].split("\t");
      const fieldOrder=COLS.map(([f])=>f);
      const p={};
      fieldOrder.forEach((f,i)=>{ if(cells[i]!==undefined && cells[i]!=="") p[f]=cells[i].trim(); });
      const norm=normalizeRowValues(p);
      if(Object.keys(norm).length===0){push("Nada reconhecível na área de transferência.","err");return;}
      await api({action:"update",id:rowId,...norm});
      push("Linha preenchida a partir da área de transferência.");
      setBlankRowId(null);
      await load();
    }catch(e){
      push("Não foi possível ler a área de transferência automaticamente. Use o botão «Colar do Excel» no lugar.","err");
    }
  };

  function toggleSort(col){if(sc===col)setSd(d=>d==="asc"?"desc":"asc");else{setSc(col);setSd("asc");}}

  const filtered=useMemo(()=>{
    let d=rows;
    if(search){const s=search.toLowerCase();d=d.filter(r=>(r.nome_paciente||"").toLowerCase().includes(s)||(r.ficha_cross||"").toLowerCase().includes(s)||(r.diagnostico||"").toLowerCase().includes(s)||(r.instituicao_destino||"").toLowerCase().includes(s));}
    if(fG)d=d.filter(r=>r.gravidade===fG);
    if(fS)d=d.filter(r=>(r.status||"").includes(fS));
    if(fM)d=d.filter(r=>(r.data_solicitacao||"").startsWith(fM));
    return [...d].sort((a,b)=>{
      const av=(a[sc]||"").toString().toLowerCase();
      const bv=(b[sc]||"").toString().toLowerCase();
      return sd==="asc"?av.localeCompare(bv,"pt"):bv.localeCompare(av,"pt");
    });
  },[rows,search,fG,fS,fM,sc,sd]);

  const stats=useMemo(()=>{
    const total=filtered.length;
    const conc=filtered.filter(r=>["FICHA FINALIZADA","FICHA FINALIZADA VIA CROSS","FICHA FINALIZADA PELA CROSS","REMOÇÃO CONCLUÍDA","CONCLUIDO"].includes(r.status)).length;
    const nao=filtered.filter(r=>(r.status||"").includes("NÃO REALIZADA")).length;
    const verm=filtered.filter(r=>r.gravidade==="emergencia"||r.gravidade==="VERMELHO").length;
    const tempos=filtered.filter(r=>r.tempo_espera).map(r=>{const[h,m]=r.tempo_espera.split(":").map(Number);return h*60+m;}).filter(n=>!isNaN(n));
    const med=tempos.length?Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length):0;
    const medStr=tempos.length?`${String(Math.floor(med/60)).padStart(2,"0")}:${String(med%60).padStart(2,"0")}`:"—";
    return {total,conc,nao,verm,medStr,ct:tempos.length};
  },[filtered]);

  function exportXLS(){
    if(!window.XLSX){push("XLSX não carregado","err");return;}
    try{
      const safe=v=>{
        if(v===null||v===undefined)return "";
        if(typeof v==="object")return String(v);
        return v;
      };
      const hdr=["#",...COLS.map(([,pl])=>String(pl||""))];
      const snapshot=[...filtered]; // captura o array neste momento
      const data=snapshot.map((r,i)=>[i+1,...COLS.map(([f])=>{
        const v=safe(r[f]);
        if(f==="data_solicitacao"&&v){try{return new Date(v+"T12:00:00").toLocaleDateString("pt-BR");}catch{return String(v);}}
        if(f==="gravidade"&&v)return String(gravInfo(v).label||v);
        return String(v);
      })]);
      const xlsSheet=window.XLSX.utils.aoa_to_sheet([hdr,...data]);
      const cw={data_solicitacao:12,horario_solicitacao:8,ficha_cross:18,nome_paciente:26,setor:18,procedimento:14,especialidade:18,diagnostico:24,status:28,gravidade:14,data_resposta_cross:12,horario_resposta_cross:8,instituicao_destino:20,tipo_ambulancia:12,data_saida_ambulancia:12,hora_solic_ambulancia:10,horario_saida_ambulancia:10,tempo_espera:10,observacao:28,enfermeiro:16,tecnico_auxiliar:16,medico:16,horario_retorno:10,duracao_remocao:12};
      xlsSheet["!cols"]=[{wch:4},...COLS.map(([f])=>({wch:cw[f]||14}))];
      const wb=window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb,"Remoções",xlsSheet);
      const fname=`remocoes_${new Date().toISOString().slice(0,10)}.xlsx`;
      window.XLSX.writeFile(wb,fname);
      setExportResult({tipo:"Excel",total:data.length,filename:fname});
    }catch(e){push("Erro ao exportar Excel: "+e.message,"err");}
  }

  function exportJSON(){
    try{
      const data=filtered.map(r=>{
        const o={};
        COLS.forEach(([f])=>{o[f]=r[f]||"";});
        return o;
      });
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download=`remocoes_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setExportResult({tipo:"JSON",total:data.length,filename:`remocoes_${new Date().toISOString().slice(0,10)}.json`});
    }catch(e){push("Erro ao exportar JSON: "+e.message,"err");}
  }

  return(
    <div className="app">
      <div className="topbar">
        <div className="ti">
          <div className="tb">
            <div className="tico"><span>+</span></div>
            <div><div className="tn">Gerência de Enfermagem</div><div className="ts">Controle de Remoções</div></div>
          </div>
          <a href="." style={{padding:"5px 10px",border:"1px solid #334155",borderRadius:6,background:"none",color:"#94A3B8",fontSize:11,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5}}>← Kanban</a>
        </div>
      </div>

      <div className="toolbar">
        <div className="tbi">
          <div className="sw"><Ico n="search" s={13}/><input className="si" placeholder="Buscar nome, ficha…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <select className="fsel" value={fG} onChange={e=>setFG(e.target.value)}>
            <option value="">Gravidade</option>
            {G_OPTS.map(o=><option key={o} value={o}>{gravInfo(o).label}</option>)}
          </select>
          <select className="fsel" value={fS} onChange={e=>setFS(e.target.value)}>
            <option value="">Status</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="NÃO REALIZADA">Não realizada</option>
            <option value="REMOÇÃO">Em remoção</option>
            <option value="AGUARDANDO">Aguardando</option>
            <option value="ENCERRADA">Encerrada</option>
          </select>
          <input type="month" className="fsel" value={fM} onChange={e=>setFM(e.target.value)} style={{width:"auto"}}/>
          {(search||fG||fS||fM)&&<button className="btn btn-g btn-sm" onClick={()=>{setSearch("");setFG("");setFS("");setFM("");}}>✕</button>}
          <div style={{marginLeft:"auto",display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
            <input type="file" accept=".json,application/json" ref={jsonFileRef} style={{display:"none"}}
              onChange={e=>{const f=e.target.files[0];e.target.value="";handleImportJSON(f);}}/>

            <SplitButton
              label="Exportar"
              icon="download"
              variant="green"
              onMain={exportXLS}
              items={[
                {label:"Excel (.xlsx)",    icon:"excel",    action:exportXLS},
                {label:"JSON (.json)",     icon:"download", action:exportJSON},
              ]}
            />
            <SplitButton
              label="Importar"
              icon="import"
              variant="blue"
              onMain={()=>setShowKanbanImport(true)}
              items={[
                {label:"Do Kanban",        icon:"import",   action:()=>setShowKanbanImport(true)},
                {label:"Colar do Excel",   icon:"excel",    action:()=>setShowPaste(true)},
                {label:"Arquivo JSON",     icon:"download", action:()=>jsonFileRef.current&&jsonFileRef.current.click()},
              ]}
            />
            <button className="btn btn-p" onClick={()=>setModal({})}><Ico n="plus"/> Novo</button>
            <button className="btn btn-g" onClick={()=>setShowDuplicates(true)} title="Verificar registros com nomes repetidos">🔍 Duplicatas</button>
            <button className="btn btn-g" style={{color:"#DC2626",borderColor:"#FCA5A5"}} disabled={rows.length===0} onClick={handleDeleteAll}><Ico n="trash" s={13}/> Excluir todos</button>
          </div>
        </div>
      </div>

      <div className="stats">
        <div className="chip"><span className="cl">Total</span><span className="cv">{stats.total}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#16A34A"}}/><span className="cl">Concluídas</span><span className="cv" style={{color:"#16A34A"}}>{stats.conc}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Não realizadas</span><span className="cv" style={{color:"#EF4444"}}>{stats.nao}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Emergências</span><span className="cv" style={{color:"#EF4444"}}>{stats.verm}</span></div>
        <div className="csep"/>
        <div className="chip"><span className="cl">⏱ Média espera</span><span className="cv" style={{color:"#7C3AED"}}>{stats.medStr}</span><span className="cl" style={{marginLeft:4}}>({stats.ct} reg.)</span></div>
      </div>

      <div className="tw">
        {loading?(<div className="empty" style={{marginTop:60}}><Ico n="pulse" s={24}/><p>Carregando…</p></div>)
        :filtered.length===0?(<div className="empty" style={{marginTop:60}}><p>{rows.length===0?"Nenhum registro. Clique em «Novo» para começar.":"Nenhum resultado."}</p></div>)
        :(
          <table className="rt">
            <colgroup>
              <col style={{width:ws[0]}}/>
              {COLS.map(([f],i)=><col key={f} style={{width:ws[i+1]}}/>)}
              <col style={{width:ws[ws.length-1]}}/>
            </colgroup>
            <thead><tr>
              <th className="stk stk-last" style={{textAlign:"center",cursor:"default",borderRight:"2px solid #475569",left:0,minWidth:ws[0],maxWidth:ws[0]}}>#</th>
              {COLS.map(([f,planilha,xls,kanban,,,tip],i)=>{
                // colunas 0-3 (data, hora, ficha, nome) são fixas
                const stkIdx=[0,1,2,3];
                const isStk=stkIdx.includes(i);
                const isLast=i===3;
                const leftOff=isStk?ws.slice(0,i+1).reduce((a,v)=>a+v,0):undefined;
                return(
                <th key={f} style={{position:"relative",cursor:"pointer",overflow:"hidden",...(isStk?{left:leftOff}:{})}}
                  className={`th-wrap${sc===f?" sorted":""}${isStk?" stk":""}${isLast?" stk-last":""}`}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:2,paddingRight:10,userSelect:"none"}}
                    onClick={()=>toggleSort(f)}>
                    <span style={{fontSize:9,lineHeight:1.25,whiteSpace:"normal",wordBreak:"break-word",flexGrow:1}}>{xls}</span>
                    <span className={`sarr${sc===f?" on":""}`} style={{flexShrink:0,marginTop:1}}>{sc===f?(sd==="asc"?"▲":"▼"):"⇅"}</span>
                  </div>
                  {/* Handle resize — área de 8px na borda direita */}
                  <div
                    style={{position:"absolute",right:0,top:0,width:8,height:"100%",cursor:"col-resize",zIndex:20,background:"transparent"}}
                    onMouseDown={e=>{e.stopPropagation();startDrag(i+1,e);}}
                    title="Arrastar para redimensionar"
                  />
                  <div className="tipbox">
                    <strong>Planilha:</strong> {planilha}<br/>
                    <strong>Kanban:</strong> {kanban||"—"}<br/>
                    {tip}
                  </div>
                </th>
              );})}
              <th style={{cursor:"default",borderLeft:"1px solid #334155"}}></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>{
                const gi=gravInfo(r.gravidade||"");
                const isBlank=r.id===blankRowId;
                const isActive=activeRow===r.id;
                // offsets das colunas fixas: #=0, data=ws[0], hora=ws[0]+ws[1], ficha=ws[0]+ws[1]+ws[2], nome=ws[0]+ws[1]+ws[2]+ws[3]
                const L0=0, L1=ws[0], L2=ws[0]+ws[1], L3=ws[0]+ws[1]+ws[2], L4=ws[0]+ws[1]+ws[2]+ws[3];
                return(
                  <tr key={r.id}
                    className={isActive?"row-active":""}
                    style={isBlank?{background:"#FEFCE8",outline:"2px solid #FDE047",outlineOffset:"-2px"}:undefined}
                    onClick={()=>setActiveRow(r.id)}>
                    <td className="stk stk-last" style={{left:L0,textAlign:"center",color:"#94A3B8",fontSize:10,fontWeight:700,borderRight:"2px solid #E2E8F0",padding:"0 4px"}}>
                      {isBlank
                        ?<button className="btn btn-blue btn-sm" title="Colar linha copiada do Excel aqui" onClick={e=>{e.stopPropagation();handlePasteIntoRow(r.id);}} style={{padding:"2px 6px"}}><Ico n="excel" s={11}/></button>
                        :i+1}
                    </td>
                    <td className="stk" style={{left:L1}}><div style={{padding:"2px 6px",fontSize:10,whiteSpace:"nowrap"}}>{fmtD(r.data_solicitacao)||"—"}</div></td>
                    <td className="stk" style={{left:L2}}><Cell rowId={r.id} field="horario_solicitacao" value={r.horario_solicitacao} tipo="time" onSave={handleCell}/></td>
                    <td className="stk" style={{left:L3}}><Cell rowId={r.id} field="ficha_cross" value={r.ficha_cross} onSave={handleCell}/></td>
                    <td className="stk stk-last" style={{left:L4}}><Cell rowId={r.id} field="nome_paciente" value={r.nome_paciente} onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="setor" value={r.setor} tipo="sel" optsKey="ST_OPTS" onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="procedimento" value={r.procedimento} tipo="sel" optsKey="P_OPTS" onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="especialidade" value={r.especialidade} onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="diagnostico" value={r.diagnostico} onSave={handleCell}/></td>
                    <td>
                      {r.status
                        ?<div style={{padding:"2px 6px"}}><span className={`sb ${S_CLS[r.status]||"se"}`} title={r.status} style={{cursor:"pointer"}} onClick={()=>handleCell(r.id,"status","")}>{r.status}</span></div>
                        :<Cell rowId={r.id} field="status" value={r.status} tipo="sel" optsKey="S_OPTS" onSave={handleCell}/>
                      }
                    </td>
                    <td>
                      {r.gravidade
                        ?<div style={{padding:"2px 6px",cursor:"pointer"}} onClick={()=>handleCell(r.id,"gravidade","")}>
                            <span style={{display:"inline-block",padding:"1px 7px",borderRadius:99,fontSize:9,fontWeight:700,background:gi.bg,color:gi.fc,border:`1px solid ${gi.bd}`,whiteSpace:"nowrap"}}>{gi.label}</span>
                          </div>
                        :<Cell rowId={r.id} field="gravidade" value={r.gravidade} tipo="sel" optsKey="G_OPTS" onSave={handleCell}/>
                      }
                    </td>
                    <td><Cell rowId={r.id} field="data_resposta_cross" value={r.data_resposta_cross} tipo="date" onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="horario_resposta_cross" value={r.horario_resposta_cross} tipo="time" onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="instituicao_destino" value={r.instituicao_destino} onSave={handleCell}/></td>
                    <td>
                      {r.tipo_ambulancia
                        ?<div style={{padding:"2px 6px",cursor:"pointer"}} onClick={()=>handleCell(r.id,"tipo_ambulancia","")}>
                            <span className={`ab ${r.tipo_ambulancia==="AVANÇADA"?"aba":"abb"}`}>{r.tipo_ambulancia}</span>
                          </div>
                        :<Cell rowId={r.id} field="tipo_ambulancia" value={r.tipo_ambulancia} tipo="sel" optsKey="A_OPTS" onSave={handleCell}/>
                      }
                    </td>
                    <td><Cell rowId={r.id} field="data_saida_ambulancia" value={r.data_saida_ambulancia} tipo="date" onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="hora_solic_ambulancia" value={r.hora_solic_ambulancia} tipo="time" onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="horario_saida_ambulancia" value={r.horario_saida_ambulancia} tipo="time" onSave={handleCell}/></td>
                    <td><div style={{padding:"2px 6px",fontSize:10,color:r.tempo_espera?"#7C3AED":"#CBD5E1",fontWeight:r.tempo_espera?700:400,whiteSpace:"nowrap"}}>{r.tempo_espera||calcTempo(r.hora_solic_ambulancia,r.horario_saida_ambulancia)||"—"}</div></td>
                    <td><Cell rowId={r.id} field="observacao" value={r.observacao} onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="enfermeiro" value={r.enfermeiro} onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="tecnico_auxiliar" value={r.tecnico_auxiliar} onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="medico" value={r.medico} onSave={handleCell}/></td>
                    <td><Cell rowId={r.id} field="horario_retorno" value={r.horario_retorno} tipo="time" onSave={handleCell}/></td>
                    <td><div style={{padding:"2px 6px",fontSize:10,color:r.duracao_remocao?"#0369A1":"#CBD5E1",fontWeight:r.duracao_remocao?700:400,whiteSpace:"nowrap"}}>{r.duracao_remocao||calcTempo(r.horario_saida_ambulancia,r.horario_retorno)||"—"}</div></td>
                    <td style={{textAlign:"center"}}><BoolCell rowId={r.id} field="finalizado" value={r.finalizado} onSave={handleCell}/></td>
                    <td style={{textAlign:"center"}}><BoolCell rowId={r.id} field="permaneceu" value={r.permaneceu} onSave={handleCell}/></td>
                    <td style={{textAlign:"center"}}>
                      <button className="delbtn" title="Excluir" onClick={()=>handleDelete(r.id)}><Ico n="trash" s={11}/></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {showKanbanImport&&<KanbanImportModal onClose={()=>setShowKanbanImport(false)} onImport={handleImport}/>}
      {showPaste&&<PasteModal onClose={()=>setShowPaste(false)} onImport={handleImportPaste}/>}
      {importErrors&&<ImportResultModal data={importErrors} onClose={()=>setImportErrors(null)}/>}
      {exportResult&&<ExportResultModal data={exportResult} onClose={()=>setExportResult(null)}/>}
      {showDuplicates&&<DuplicatesModal rows={rows} onClose={()=>setShowDuplicates(false)} onDelete={async(id)=>{await handleDelete(id);}}/>}
      {modal!==null&&<FormModal row={modal} onClose={()=>setModal(null)} onSave={handleSave} saving={saving}/>}
      <div className="tst">
        {ts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==="ok"?"✓":"✕"}</span><span>{t.msg}</span></div>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
