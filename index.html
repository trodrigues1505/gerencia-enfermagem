/* ─── buildText (regras 41-65) — emojis compatíveis WhatsApp ─── */
function buildText(cards, cols, settings) {
  const SEP = "--------------------";
  const appLink = settings?.app_url ? "\n\n" + SEP + "\nAcesse o sistema:\n" + settings.app_url : "";
  const lines = ["*GERENCIA DE ENFERMAGEM*", "Data: *" + todayStr() + " as " + nowStr() + "*", SEP];
  const COL_LABEL = {
    pendente: "PENDENTE DE ACEITE",
    aceite: "ACEITE CONFIRMADO",
    psiquiatria: "PSIQUIATRIA",
    andamento: "REMOCAO EM ANDAMENTO",
    finalizado: "FINALIZADAS"
  };
  cols.forEach(col => {
    const cc = cards.filter(c => c.col_id === col.id);
    if (!cc.length) return;
    const colLabel = COL_LABEL[col.id] || col.label.toUpperCase();
    lines.push("");
    lines.push("*" + colLabel + "*");
    lines.push(cc.length + " paciente" + (cc.length !== 1 ? "s" : ""));
    lines.push(SEP);
    cc.forEach(c => {
      lines.push("");
      if (c.pr) lines.push(PR_EMOJI[c.pr] + " *PRIORIDADE " + String(c.pr).padStart(2, "0") + "*");
      const catL = {
        pediatria: "[Ped]",
        psiquiatria: "[Psi]"
      };
      const catT = c.categoria && c.categoria !== "normal" ? catL[c.categoria] : c.is_rn ? "[RN]" : "";
      lines.push(`[PAC]${catT ? " " + catT : ""} *${c.nome}*${c.idade ? ` - ${c.idade}` : ""}`);
      if (c.setor) lines.push("Local: " + c.setor);
      const ambTxt = c.amb ? c.amb.includes("Av") ? "Amb. Avancada" : "Amb. Basica" : "";
      if (c.rec && c.hosp) {
        lines.push("Enc: " + c.rec + " -> " + c.hosp);
        if (ambTxt) lines.push(ambTxt);
      } else if (c.rec) {
        lines.push("Rec: " + c.rec + (ambTxt ? " | " + ambTxt : ""));
      } else if (ambTxt) {
        lines.push(ambTxt);
      }
      if (c.cross_info) lines.push("Cross: " + c.cross_info);
      if (c.receptor) lines.push("Receptor: " + c.receptor + (c.data_aceite ? " | " + c.data_aceite : "") + (c.hora_aceite ? " as " + c.hora_aceite : ""));
      if (c.status) lines.push(STATUS_EMOJI[c.status] + " *" + c.status + "*");
    });
    lines.push("");
  });
  lines.push(SEP);
  lines.push("*RESUMO*");
  lines.push("Total: *" + cards.length + " pacientes*");
  cols.forEach(col => {
    const n = cards.filter(c => c.col_id === col.id).length;
    if (n > 0) lines.push((COL_LABEL[col.id] || col.label) + ": " + n);
  });
  lines.push(appLink);
  return lines.join("\n");
}

      realtimeChannel = sb.channel("publications-changes").on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "publications"
      }, payload => {
        const p = payload.new;
        if (!p || p.id === lastPubId) return;
        lastPubId = p.id;
        // Ignora snapshots automáticos — só publicações manuais da Fabiana atualizam viewers
        const isAutoSnap = (p.label || "").includes("automático");
        if (isAutoSnap) return;

        event: "INSERT",
        schema: "public",
        table: "users"
      }, payload => {
        const u = payload.new;
        if (isAdmin && u?.status === "pendente") showT(`📋 Novo cadastro pendente: ${u.nome}`);
      }).subscribe();
    }).catch(() => {
      // fallback: polling se realtime falhar
      const ivPub = setInterval(async () => {
        try {
          // Busca última publicação MANUAL (não automática)
          const allPubs = await sbGet("publications", "order=created_at.desc&limit=10");
          const pub = allPubs.find(p => !(p.label || "").includes("automático"));
          if (!pub) return;
          if (pub.id === lastPubId) return;
          lastPubId = pub.id;
          const snap = pub.snapshot || {};
          setPubCards(snap.cards || []);
          setPubCols(snap.cols || []);
          setLastPub(new Date(pub.created_at).toLocaleString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",

        knownComIds.current.add(c.id);

            ...prev

        });

  /* ── Drag ── */
  function handleDragStart(e, cardId) {
    dragId.current = cardId;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(cardId));
    requestAnimationFrame(() => {
      if (e.currentTarget) e.currentTarget.style.opacity = ".35";
    });
  }
  function handleDragEnd(e) {
    dragId.current = null;
    if (e.currentTarget) e.currentTarget.style.opacity = "1";
    document.querySelectorAll("[data-dropzone]").forEach(z => {
      z.style.borderColor = "#E2E8F0";
      z.style.boxShadow = "none";
    });
    dragOverCol.current = null;
  }
  function handleDrop(e, colId) {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain") || dragId.current;
    if (!id) return;
    handleMoveAttempt(id, colId);
  }
  function handleDragOver(e, colId) {
    e.preventDefault();
    if (dragOverCol.current === colId) return;
    if (dragOverCol.current) {
      const p = document.querySelector(`[data-dropzone="${dragOverCol.current}"]`);
      if (p) {
        p.style.borderColor = "#E2E8F0";
        p.style.boxShadow = "none";
      }
    }
    dragOverCol.current = colId;
    const el = document.querySelector(`[data-dropzone="${colId}"]`);
    if (el) {
      el.style.borderColor = "#3B82F6";
      el.style.boxShadow = "0 0 0 3px rgba(59,130,246,.15)";
    }
  }
  function handleDragLeave(e, colId) {
    if (e.currentTarget.contains(e.relatedTarget)) return;
    const el = document.querySelector(`[data-dropzone="${colId}"]`);
    if (el) {
      el.style.borderColor = "#E2E8F0";
      el.style.boxShadow = "none";
    }
    if (dragOverCol.current === colId) dragOverCol.current = null;
  }

  async function generatePDF(mode) {
    // mode: 'text' = PDF formatado com texto | 'visual' = PDF com imagem do kanban
    showT("Gerando PDF...");
    try {
      // Carrega jsPDF dinamicamente
      if (!window.jspdf) {
        await new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      const {
        jsPDF
      } = window.jspdf;
      const colsData = isAdmin ? cols : pubCols || cols;
      const cardsData = isAdmin ? cards : pubCards || [];
      const dateStr = new Date().toLocaleDateString("pt-BR");
      const timeStr = new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      });
      if (mode === "text") {
        const doc = new jsPDF({
          unit: "mm",
          format: "a4"
        });
        const PW = 190; // largura útil
        let y = 15;
        const LHEIGHT = 5;
        function addLine(text, opts = {}) {
          const {
            size = 10,
            bold = false,
            color = [0, 0, 0],
            indent = 0
          } = opts;
          doc.setFontSize(size);
          doc.setFont("helvetica", bold ? "bold" : "normal");
          doc.setTextColor(...color);
          const lines = doc.splitTextToSize(text, PW - indent);
          lines.forEach(l => {
            if (y > 275) {
              doc.addPage();
              y = 15;
            }
            doc.text(l, 10 + indent, y);
            y += LHEIGHT + (size > 10 ? 1 : 0);
          });
        }
        function sep(color = [200, 200, 200]) {
          if (y > 275) {
            doc.addPage();
            y = 15;
          }
          doc.setDrawColor(...color);
          doc.line(10, y, 200, y);
          y += 3;
        }
        const COL_COLORS = {
          pendente: [245, 158, 11],
          aceite: [59, 130, 246],
          psiquiatria: [139, 92, 246],
          andamento: [239, 68, 68],
          finalizado: [107, 114, 128]
        };
        const GRAV_COLORS = {
          emergencia: [239, 68, 68],
          urgencia: [234, 179, 8],
          andamento_cor: [245, 158, 11],
          menor_gravidade: [34, 197, 94],
          finalizado_cor: [168, 85, 247],
          retorno: [236, 72, 153],
          agendamento: [148, 163, 184]
        };

        // Cabeçalho
        addLine("GERENCIA DE ENFERMAGEM", {
          size: 16,
          bold: true,
          color: [15, 23, 42]
        });
        addLine("Data: " + dateStr + "  Hora: " + timeStr, {
          size: 9,
          color: [100, 116, 139]
        });
        y += 3;
        sep([59, 130, 246]);
        y += 2;
        colsData.forEach(col => {
          const cc = cardsData.filter(c => c.col_id === col.id);
          if (!cc.length) return;
          const colColor = COL_COLORS[col.id] || [100, 116, 139];

          // Cabeçalho da coluna
          y += 3;
          doc.setFillColor(...colColor);
          doc.roundedRect(10, y - 4, PW, 8, 2, 2, "F");
          doc.setFontSize(10);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(255, 255, 255);
          doc.text(col.label.toUpperCase() + "  (" + cc.length + " paciente" + (cc.length !== 1 ? "s" : "") + ")", 14, y + 1);
          y += 8;
          cc.forEach((c, idx) => {
            if (y > 268) {
              doc.addPage();
              y = 15;
            }
            const gravColor = GRAV_COLORS[c.grav] || [234, 179, 8];

            // Linha colorida lateral
            doc.setFillColor(...gravColor);
            const cardStartY = y;
            doc.rect(10, cardStartY, 2, 1, "F"); // será atualizado depois

            // Número e nome
            const prTxt = c.pr ? "[P" + c.pr + "] " : "";
            const rnTxt = c.is_rn ? "[RN] " : "";
            addLine(prTxt + rnTxt + c.nome, {
              size: 10,
              bold: true,
              indent: 4
            });
            if (c.idade || c.adm) {
              addLine((c.idade || "") + (c.idade && c.adm ? " | " : "") + (c.adm ? "Adm: " + c.adm : ""), {
                size: 8,
                color: [100, 116, 139],
                indent: 4
              });
            }
            if (c.hd) addLine("HD: " + c.hd, {
              size: 9,
              indent: 4
            });
            if (c.setor) addLine("Local: " + c.setor, {
              size: 8,
              color: [71, 85, 105],
              indent: 4
