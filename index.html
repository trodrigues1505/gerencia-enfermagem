<script>
(function () {
  // ==========================================================================
  // ATUALIZAÇÃO — REGRA ÚNICA
  // version.json é a ÚNICA fonte de verdade. Bump nele a cada deploy.
  // Qualquer mudança (index.html, sw.js, canon.js, manifest) é anunciada pelo
  // mesmo toast e aplicada pelo mesmo botão. F5 nunca é necessário.
  // ==========================================================================
  var APP_VERSION = '2026.10.02-21';   // deve ser IGUAL ao "version" do version.json

  var pill  = document.getElementById('ge-version');
  var label = document.getElementById('ge-version-label');
  var toast = document.getElementById('ge-update');
  var novaVersao = null;
  var aplicando = false;
  // Lembra, só nesta aba, qual versão o usuário acabou de aplicar. Evita o aviso voltar em loop.
  function lerSS(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function gravarSS(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }

  label.textContent = 'v' + APP_VERSION;
  pill.dataset.state = 'idle';

  function anunciar(v) {
    if (aplicando) return;
    novaVersao = v || null;
    pill.dataset.state = 'stale';
    label.textContent = 'v' + APP_VERSION + ' · atualização';
    toast.classList.add('show');
    toast.setAttribute('aria-hidden', 'false');
  }

  // Aplica TUDO de uma vez: ativa o SW em espera, limpa caches e recarrega.
  // Não importa se mudou o index, o sw ou um asset — o caminho é um só.
  async function aplicar() {
    aplicando = true;
    try {
      if ('serviceWorker' in navigator) {
        var reg = await navigator.serviceWorker.getRegistration();
        if (reg && reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          await new Promise(function (res) {
            var t = setTimeout(res, 1500);
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              clearTimeout(t); res();
            }, { once: true });
          });
        }
      }
      if ('caches' in window) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
    } catch (e) { console.error('[update]', e); }
    gravarSS('ge_versao_aplicada', novaVersao || '');
    gravarSS('ge_aplicado_em', String(Date.now()));
    location.replace(location.pathname + '?v=' + Date.now());
  }

  document.getElementById('ge-update-now').addEventListener('click', function () {
    this.textContent = 'Atualizando';
    this.disabled = true;
    aplicar();
  });
  document.getElementById('ge-update-later').addEventListener('click', function () {
    toast.classList.remove('show');
    toast.setAttribute('aria-hidden', 'true');
  });

  // Consulta a versão publicada. no-store: nunca pode vir do cache.
  async function checar(porClique) {
    if (aplicando) return;
    if (porClique && pill.dataset.state !== 'stale') pill.dataset.state = 'checking';
    var servidor = null;
    try {
      var r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { var j = await r.json(); servidor = j && j.version; }
    } catch (e) {}

    // Em paralelo, deixa o navegador reavaliar o sw.js (cobre o caso de o
    // version.json não ter sido bumpado por esquecimento).
    try {
      if ('serviceWorker' in navigator) {
        var reg = await navigator.serviceWorker.getRegistration();
        if (reg) {
          await reg.update();
          if (reg.waiting) {
            // Se o usuário acabou de clicar em Atualizar (últimos 2 min), ativa o worker em espera sem perguntar de novo.
            if (Date.now() - Number(lerSS('ge_aplicado_em') || 0) < 120000) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            else return anunciar(servidor);
          }
        }
      }
    } catch (e) {}

    if (servidor && servidor !== APP_VERSION) {
      if (servidor === lerSS('ge_versao_aplicada')) {
        // Já atualizamos para esta versão e a página continua com outro número: não é cache,
        // é o APP_VERSION do index.html diferente do version.json. Mostra o problema em vez de repetir o aviso.
        pill.dataset.state = 'stale';
        label.textContent = 'v' + APP_VERSION + ' ≠ servidor v' + servidor;
        pill.title = 'APP_VERSION do index.html e "version" do version.json estão diferentes. Deixe os dois iguais no repositório.';
        return;
      }
      return anunciar(servidor);
    }

    if (porClique) {
      pill.dataset.state = 'current';
      label.textContent = 'v' + APP_VERSION + ' · atualizado';
      setTimeout(function () {
        if (pill.dataset.state === 'stale') return;
        pill.dataset.state = 'idle';
        label.textContent = 'v' + APP_VERSION;
      }, 2600);
    }
  }

  pill.addEventListener('click', function () { checar(true); });
  pill.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); checar(true); }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
  // Verifica ao abrir, a cada 10 min e sempre que a aba volta ao foco.
  checar(false);
  setInterval(function () { checar(false); }, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checar(false);
  });

  // ==========================================================================
  // INSTALAÇÃO NATIVA
  // beforeinstallprompt dispara MUITO cedo — precisa ser capturado aqui, antes
  // do React montar, senão o evento se perde e o botão nunca funciona.
  // ==========================================================================
  window.__gePrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__gePrompt = e;
    window.dispatchEvent(new CustomEvent('ge-instalavel'));
  });
  window.addEventListener('appinstalled', function () {
    window.__gePrompt = null;
    window.dispatchEvent(new CustomEvent('ge-instalado'));
  });
})();
</script>
