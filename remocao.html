/* Toast */
function useToast(){
  const [ts,setTs]=useState([]);
  const push=useCallback((msg,type="ok")=>{
    const id=Date.now();
    setTs(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),4500);
  },[]);
  return {ts,push};
}

/* Célula inline editável */
function Cell({rowId,field,value,type="text",opts=null,onSave}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(value||"");
  const ref=useRef();
  useEffect(()=>{setVal(value||"");},[value]);
  useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);
  function commit(){
    setEditing(false);
    if(val!==(value||""))onSave(rowId,field,val);
  }
  if(!editing) return (
    <div className={`cv2 ${!val?"empty":""}`} onClick={()=>setEditing(true)} title="Clique para editar">
      {val||"—"}
    </div>
  );
  if(opts) return (
    <select ref={ref} className="csel" value={val}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>e.key==="Escape"&&(setEditing(false),setVal(value||""))}>
      <option value="">—</option>
      {opts.map(o=><option key={o}>{o}</option>)}
    </select>
  );
  return (
    <input ref={ref} className="ci" type={type} value={val}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setVal(value||"");}}}/>
  );
}

/* Modal IA — colar ficha CROSS */
function AIModal({onClose,onExtracted}){
  const [texto,setTexto]=useState("");
  const [loading,setLoading]=useState(false);
  const [status,setStatus]=useState("");

  async function extrair(){
    if(!texto.trim())return;
    setLoading(true);
    setStatus("Analisando ficha…");
    try{
      const campos = await extractCROSS(texto);
      setStatus("✓ Campos extraídos com sucesso!");
      setTimeout(()=>{onExtracted(campos);onClose();},800);
    }catch(e){
      setStatus("Erro ao extrair: "+e.message);
    }finally{
      setLoading(false);
    }
  }

  return (
    <div className="mbk" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="ai-modal">
        <div className="ai-hd">
          <h2>✨ Extração IA — Ficha CROSS</h2>
          <p>Cole o texto copiado da ficha CROSS. A IA extrai e preenche os campos automaticamente.</p>
        </div>
        <div className="ai-body">
          <div style={{marginBottom:8,fontSize:12,color:"#64748B"}}>
            Copie todo o conteúdo da ficha (Ctrl+A, Ctrl+C) e cole abaixo:
          </div>
          <textarea
            className="ai-ta"
            placeholder="Cole aqui o texto da ficha CROSS..."
            value={texto}
            onChange={e=>setTexto(e.target.value)}
          />
          <div className="ai-status">{status}</div>
        </div>
        <div className="mft">
          <button className="btn btn-g" onClick={onClose}>Cancelar</button>
          <button className="btn btn-ai" disabled={loading||!texto.trim()} onClick={extrair}>
            {loading?"Extraindo…":"✨ Extrair com IA"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* Modal novo/editar registro */
function FormModal({row,onClose,onSave,loading}){
  const [form,setForm]=useState(row?{...EMPTY,...row}:{...EMPTY});
  const set=(k,v)=>setForm(f=>(({...f,[k]:v})));
  return (
    <div className="mbk" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="mdl">
        <div className="mhd">
          <div>
            <h2>{row?.id?"Editar Registro":"Novo Registro de Remoção"}</h2>
            <p>{row?.id?`Ficha ${row.ficha_cross||"sem número"}`:"Preencha os dados"}</p>
          </div>
          <button className="ab4" onClick={onClose}><Ico n="x"/></button>
        </div>
        <div className="mbd">
          <div className="fsc"><div className="fst">Identificação</div>
            <div className="fgrid fg3">
              <div className="fd"><label>Data Solicitação <span className="req">*</span></label>
                <input type="date" value={form.data_solicitacao} onChange={e=>set("data_solicitacao",e.target.value)}/></div>
              <div className="fd"><label>Horário</label>
                <input type="time" value={form.horario_solicitacao} onChange={e=>set("horario_solicitacao",e.target.value)}/></div>
              <div className="fd"><label>Nº Ficha CROSS</label>
                <input type="text" placeholder="SS-14650585-26" value={form.ficha_cross} onChange={e=>set("ficha_cross",e.target.value)}/></div>
            </div>
          </div>
          <div className="fsc"><div className="fst">Paciente</div>
            <div className="fgrid fg2">
              <div className="fd"><label>Nome <span className="req">*</span></label>
                <input type="text" placeholder="Nome completo" value={form.nome_paciente} onChange={e=>set("nome_paciente",e.target.value)}/></div>
              <div className="fd"><label>Localização / Setor</label>
                <select value={form.setor} onChange={e=>set("setor",e.target.value)}>
                  <option value="">Selecione</option>{SETOR_OPTS.map(o=><option key={o}>{o}</option>)}
                </select></div>
            </div>
          </div>
          <div className="fsc"><div className="fst">Dados Clínicos</div>
            <div className="fgrid fg3">
              <div className="fd"><label>Procedimento</label>
                <select value={form.procedimento} onChange={e=>set("procedimento",e.target.value)}>
                  <option value="">Selecione</option>{PROC_OPTS.map(o=><option key={o}>{o}</option>)}
                </select></div>
              <div className="fd"><label>Especialidade</label>
                <input type="text" placeholder="Ortopedia, TC..." value={form.especialidade} onChange={e=>set("especialidade",e.target.value)}/></div>
              <div className="fd"><label>Gravidade</label>
                <select value={form.gravidade} onChange={e=>set("gravidade",e.target.value)}>
                  <option value="">Selecione</option>{GRAV_OPTS.map(o=><option key={o}>{o}</option>)}
                </select></div>
              <div className="fd" style={{gridColumn:"1/-1"}}><label>Diagnóstico</label>
                <input type="text" placeholder="Hipótese ou CID" value={form.diagnostico} onChange={e=>set("diagnostico",e.target.value)}/></div>
            </div>
          </div>
          <div className="fsc"><div className="fst">Resposta CROSS / Status</div>
            <div className="fgrid fg2">
              <div className="fd"><label>Status</label>
                <select value={form.status} onChange={e=>set("status",e.target.value)}>
                  <option value="">Selecione</option>{STATUS_OPTS.map(o=><option key={o}>{o}</option>)}
                </select></div>
              <div className="fd"><label>Instituição Destino</label>
                <input type="text" placeholder="Hospital receptor" value={form.instituicao_destino} onChange={e=>set("instituicao_destino",e.target.value)}/></div>
              <div className="fd"><label>Data Resposta CROSS</label>
                <input type="date" value={form.data_resposta_cross} onChange={e=>set("data_resposta_cross",e.target.value)}/></div>
              <div className="fd"><label>Horário Resposta</label>
                <input type="time" value={form.horario_resposta_cross} onChange={e=>set("horario_resposta_cross",e.target.value)}/></div>
            </div>
          </div>
          <div className="fsc"><div className="fst">Ambulância</div>
            <div className="fgrid fg4">
              <div className="fd"><label>Tipo</label>
                <select value={form.tipo_ambulancia} onChange={e=>set("tipo_ambulancia",e.target.value)}>
                  <option value="">—</option>{AMBU_OPTS.map(o=><option key={o}>{o}</option>)}
                </select></div>
              <div className="fd"><label>Solicitação Base — Data</label>
                <input type="date" value={form.data_saida_ambulancia} onChange={e=>set("data_saida_ambulancia",e.target.value)}/></div>
              <div className="fd"><label>Horário Saída SCFM</label>
                <input type="time" value={form.horario_saida_ambulancia} onChange={e=>set("horario_saida_ambulancia",e.target.value)}/></div>
              <div className="fd"><label>Tempo de Espera</label>
                <input type="text" placeholder="01:30" value={form.tempo_espera} onChange={e=>set("tempo_espera",e.target.value)}/></div>
              <div className="fd"><label>Retorno do Paciente</label>
                <input type="time" value={form.horario_retorno} onChange={e=>set("horario_retorno",e.target.value)}/></div>
            </div>
          </div>
          <div className="fsc"><div className="fst">Equipe</div>
            <div className="fgrid fg3">
              <div className="fd"><label>Enfermeiro(a)</label>
                <input type="text" placeholder="Nome" value={form.enfermeiro} onChange={e=>set("enfermeiro",e.target.value)}/></div>
              <div className="fd"><label>Técnico / Auxiliar de Enfermagem</label>
                <input type="text" placeholder="Nome" value={form.tecnico_auxiliar} onChange={e=>set("tecnico_auxiliar",e.target.value)}/></div>
              <div className="fd"><label>Médico(a)</label>
                <input type="text" placeholder="Nome" value={form.medico} onChange={e=>set("medico",e.target.value)}/></div>
            </div>
          </div>
          <div className="fsc" style={{marginBottom:0}}><div className="fst">Observação</div>
            <div className="fd">
              <textarea rows={3} placeholder="Observações adicionais…" value={form.observacao} onChange={e=>set("observacao",e.target.value)}/>
            </div>
          </div>
        </div>
        <div className="mft">
          <button className="btn btn-g" onClick={onClose}>Cancelar</button>
          <button className="btn btn-p" disabled={loading||!form.nome_paciente} onClick={()=>onSave(form)}>
            {loading?"Salvando…":(row?.id?"Salvar":"Criar Registro")}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── App ── */
function App(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [modal,setModal]=useState(null);   // null | {} | row
  const [showAI,setShowAI]=useState(false);
  const [aiPrefill,setAiPrefill]=useState(null); // campos extraídos pela IA
  const [search,setSearch]=useState("");
  const [fGrav,setFGrav]=useState("");
  const [fStatus,setFStatus]=useState("");
  const [fMes,setFMes]=useState("");
  const {ts,push}=useToast();

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const d=await apiGet("remocoes?select=*&order=data_solicitacao.desc,horario_solicitacao.desc");
      setRows(Array.isArray(d)?d:[]);
    }catch(e){push("Erro ao carregar: "+e.message,"err");}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[]);

  const handleSave=async(form)=>{
    setSaving(true);
    try{
      const p={...form};
      Object.keys(p).forEach(k=>{if(p[k]==="")p[k]=null;});
      if(form.id){await apiFn({action:"update",id:form.id,...p});push("Atualizado");}
      else{await apiFn({action:"create",...p});push("Registro criado com sucesso!");}
      setModal(null);setAiPrefill(null);
      await load();
    }catch(e){push(e.message||"Erro ao salvar","err");}
    finally{setSaving(false);}
  };

  const handleCell=async(rowId,field,value)=>{
    try{
      await apiFn({action:"update",id:rowId,[field]:value||null});
      setRows(r=>r.map(x=>x.id===rowId?{...x,[field]:value}:x));
    }catch(e){push(e.message,"err");}
  };

  const handleDelete=async(id)=>{
    if(!confirm("Excluir este registro?"))return;
    try{
      await apiFn({action:"delete",id});
      push("Excluído");
      setRows(r=>r.filter(x=>x.id!==id));
    }catch(e){push(e.message||"Erro","err");}
  };

  const handleAIExtracted=(campos)=>{
    push("✨ Campos extraídos! Revise e salve.");
    setAiPrefill(campos);
    setModal(campos); // abre o modal já preenchido
  };

  const filtered=useMemo(()=>{
    let d=rows;
    if(search){const s=search.toLowerCase();d=d.filter(r=>(r.nome_paciente||"").toLowerCase().includes(s)||(r.ficha_cross||"").toLowerCase().includes(s)||(r.diagnostico||"").toLowerCase().includes(s)||(r.instituicao_destino||"").toLowerCase().includes(s));}
    if(fGrav)d=d.filter(r=>r.gravidade===fGrav);
    if(fStatus)d=d.filter(r=>(r.status||"").includes(fStatus));
    if(fMes)d=d.filter(r=>(r.data_solicitacao||"").startsWith(fMes));
    return d;
  },[rows,search,fGrav,fStatus,fMes]);

  const stats=useMemo(()=>{
    const total=filtered.length;
    const conc=filtered.filter(r=>["FICHA FINALIZADA","FICHA FINALIZADA VIA CROSS","FICHA FINALIZADA PELA CROSS","REMOÇÃO CONCLUÍDA","CONCLUIDO"].includes(r.status)).length;
    const nao=filtered.filter(r=>(r.status||"").includes("NÃO REALIZADA")).length;
    const verm=filtered.filter(r=>r.gravidade==="VERMELHO").length;
    return {total,conc,nao,verm};
  },[filtered]);

  const exportCSV=()=>{
    const fields=COLS_HEADER.map(c=>c[0]);
    const hdrs=COLS_HEADER.map(c=>c[1]);
    const lines=[hdrs.join(","),...filtered.map(r=>fields.map(f=>`"${(r[f]||"").toString().replace(/"/g,'""')}"`).join(","))];
    const b=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=`remocoes_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const hasFilter=search||fGrav||fStatus||fMes;

  return (
    <div style={{minHeight:"100vh",background:"#F1F5F9"}}>
      <div className="topbar">
        <div className="ti">
          <div className="tb">
            <div className="tico"><span>+</span></div>
            <div>
              <div className="tn">Gerência de Enfermagem</div>
              <div className="ts">Controle de Remoções</div>
            </div>
          </div>
          <a href="." style={{padding:"6px 12px",border:"1px solid #334155",borderRadius:7,background:"none",color:"#94A3B8",fontSize:12,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:6}}>
            ← Kanban
          </a>
        </div>
      </div>

      <div className="toolbar">
        <div className="tbi">
          <div className="sw">
            <Ico n="search" s={14}/>
            <input className="si" placeholder="Buscar paciente, ficha, diagnóstico…" value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <select className="fs" value={fGrav} onChange={e=>setFGrav(e.target.value)}>
            <option value="">Todas as gravidades</option>
            {GRAV_OPTS.map(o=><option key={o}>{o}</option>)}
          </select>
          <select className="fs" value={fStatus} onChange={e=>setFStatus(e.target.value)}>
            <option value="">Todos os status</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="CONCLUÍDA">Concluída</option>
            <option value="NÃO REALIZADA">Não realizada</option>
            <option value="ENCERRADA">Encerrada</option>
            <option value="REMOÇÃO">Em remoção</option>
            <option value="AGUARDANDO">Aguardando</option>
          </select>
          <input type="month" className="fs" value={fMes} onChange={e=>setFMes(e.target.value)} style={{width:"auto"}}/>
          {hasFilter&&<button className="btn btn-g btn-sm" onClick={()=>{setSearch("");setFGrav("");setFStatus("");setFMes("");}}>Limpar</button>}
          <div style={{marginLeft:"auto",display:"flex",gap:8}}>
            <button className="btn btn-g" onClick={exportCSV}><Ico n="dl" s={14}/> Exportar CSV</button>
            <button className="btn btn-ai" onClick={()=>setShowAI(true)}>✨ Colar Ficha CROSS</button>
            <button className="btn btn-p" onClick={()=>setModal({})}><Ico n="plus" s={14}/> Novo Registro</button>
          </div>
        </div>
      </div>

      <div className="stats">
        <div className="chip"><span className="cl">Total</span><span className="cv">{stats.total}</span></div>
        <div className="chip"><div className="cdot" style={{background:"#16A34A"}}/><span className="cl">Concluídas</span><span className="cv" style={{color:"#16A34A"}}>{stats.conc}</span></div>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Não realizadas</span><span className="cv" style={{color:"#EF4444"}}>{stats.nao}</span></div>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Emergências</span><span className="cv" style={{color:"#EF4444"}}>{stats.verm}</span></div>
      </div>

      <div className="tw">
        {loading?(
          <div className="empty"><Ico n="pulse" s={32}/><p>Carregando…</p></div>
        ):filtered.length===0?(
          <div className="empty">
            <Ico n="pulse" s={32}/>
            <p>{rows.length===0?"Nenhum registro. Clique em «Novo Registro» ou «✨ Colar Ficha CROSS» para começar.":"Nenhum resultado para o filtro."}</p>
          </div>
        ):(
          <table className="rt">
            <thead><tr>
              <th>#</th>
              {COLS_HEADER.map(([f,h])=><th key={f}>{h}</th>)}
              <th style={{width:48}}></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>(
                <tr key={r.id}>
                  <td>{i+1}</td>
                  <td><div style={{padding:"0 10px",fontSize:12,color:"#374151"}}><div>{fmtD(r.data_solicitacao)||"—"}</div></div></td>
                  <td><Cell rowId={r.id} field="horario_solicitacao" value={r.horario_solicitacao} type="time" onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="ficha_cross" value={r.ficha_cross} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="nome_paciente" value={r.nome_paciente} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="setor" value={r.setor} opts={SETOR_OPTS} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="procedimento" value={r.procedimento} opts={PROC_OPTS} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="especialidade" value={r.especialidade} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="diagnostico" value={r.diagnostico} onSave={handleCell}/></td>
                  <td>
                    {r.status
                      ?<div style={{padding:"0 8px"}}><span className={`sb2 ${STATUS_CLS[r.status]||"se"}`} title={r.status}>{r.status.length>18?r.status.slice(0,18)+"…":r.status}</span></div>
                      :<Cell rowId={r.id} field="status" value={r.status} opts={STATUS_OPTS} onSave={handleCell}/>
                    }
                  </td>
                  <td>
                    {r.gravidade
                      ?<div style={{padding:"0 8px"}}><span className={`gb ${GRAV_CLS[r.gravidade]||"gc"}`}><span className="gd" style={{background:GRAV_DOT[r.gravidade]||"#94A3B8"}}/> {r.gravidade}</span></div>
                      :<Cell rowId={r.id} field="gravidade" value={r.gravidade} opts={GRAV_OPTS} onSave={handleCell}/>
                    }
                  </td>
                  <td><Cell rowId={r.id} field="data_resposta_cross" value={r.data_resposta_cross} type="date" onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="horario_resposta_cross" value={r.horario_resposta_cross} type="time" onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="instituicao_destino" value={r.instituicao_destino} onSave={handleCell}/></td>
                  <td>
                    {r.tipo_ambulancia
                      ?<div style={{padding:"0 8px"}}><span className={`abg ${r.tipo_ambulancia==="AVANÇADA"?"aba":"abb"}`}>{r.tipo_ambulancia}</span></div>
                      :<Cell rowId={r.id} field="tipo_ambulancia" value={r.tipo_ambulancia} opts={AMBU_OPTS} onSave={handleCell}/>
                    }
                  </td>
                  <td><Cell rowId={r.id} field="data_saida_ambulancia" value={r.data_saida_ambulancia} type="date" onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="horario_saida_ambulancia" value={r.horario_saida_ambulancia} type="time" onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="tempo_espera" value={r.tempo_espera} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="observacao" value={r.observacao} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="enfermeiro" value={r.enfermeiro} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="tecnico_auxiliar" value={r.tecnico_auxiliar} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="medico" value={r.medico} onSave={handleCell}/></td>
                  <td><Cell rowId={r.id} field="horario_retorno" value={r.horario_retorno} type="time" onSave={handleCell}/></td>
                  <td><div className="ra"><button className="ab4 del" title="Excluir" onClick={()=>handleDelete(r.id)}><Ico n="trash" s={13}/></button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {showAI&&<AIModal onClose={()=>setShowAI(false)} onExtracted={handleAIExtracted}/>}
      {modal!==null&&<FormModal row={modal} onClose={()=>{setModal(null);setAiPrefill(null);}} onSave={handleSave} loading={saving}/>}

      <div className="tst">
        {ts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==="ok"?"✓":"✕"}</span><span>{t.msg}</span></div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
