  const handlePasteIntoRow=async(rowId)=>{
    try{
      const text=await navigator.clipboard.readText();
      if(!text||!text.trim()){push("Área de transferência vazia. Copie a linha no Excel primeiro (Ctrl+C).","err");return;}
      const cells=text.replace(/\r/g,"").split("\n")[0].split("\t");
      // Layout FIXO do Excel (o mesmo de antes de tirar as colunas de aceite): a posição de cada coluna não muda,
      // mesmo que a tela ganhe ou perca colunas. Quem manda a lista é COLS_V2.
      const fieldOrder=COLS_V2;
      const p={};
      fieldOrder.forEach((f,i)=>{ if(!CAMPOS_CALCULADOS.has(f) && cells[i]!==undefined && cells[i]!=="") p[f]=cells[i].trim(); });
      // o aceite (que não tem mais coluna) é o mesmo momento da finalização: só vale se a finalização veio vazia
      if(!p.data_resposta_cross&&p.data_aceite_cross)p.data_resposta_cross=p.data_aceite_cross;
      if(!p.horario_resposta_cross&&p.horario_aceite_cross)p.horario_resposta_cross=p.horario_aceite_cross;
      delete p.data_aceite_cross;delete p.horario_aceite_cross;
      const norm=normalizeRowValues(p);
      if(Object.keys(norm).length===0){push("Nada reconhecível na área de transferência.","err");return;}
      await api({action:"update",id:rowId,...norm});
      push("Linha preenchida a partir da área de transferência.");
      setBlankRowId(null);
      await load();
    }catch(e){
      push("Não foi possível ler a área de transferência automaticamente. Use o botão «Colar do Excel» no lugar.","err");
    }
  };

  // Bug 5 fix: resetSort volta à ordem de inserção (created_at desc)
  function resetSort(){setSc("created_at");setSd("desc");}
  function toggleSort(col){
    if(sc===col){
      if(sd==="asc") setSd("desc");
      else { setSc("created_at"); setSd("desc"); } // 3º clique: reset
    } else { setSc(col); setSd("asc"); }
  }

  // O período (mês, 30 dias...) já foi aplicado no servidor em load(); aqui ficam só os filtros da tela.
  const filtered=useMemo(()=>{
    let d=rows;
    if(search){const s=search.toLowerCase();d=d.filter(r=>(r.nome_paciente||"").toLowerCase().includes(s)||(r.ficha_cross||"").toLowerCase().includes(s)||(r.diagnostico||"").toLowerCase().includes(s)||(r.instituicao_destino||"").toLowerCase().includes(s));}
    if(fG)d=d.filter(r=>r.gravidade===fG);
    if(fS)d=d.filter(r=>(r.status||"").includes(fS));
    if(fF){const cs=(FALTA_OPCOES.find(o=>o[0]===fF)||[0,0,[]])[2];d=d.filter(r=>cs.some(k=>!String(r[k]??"").trim()));}
    return [...d].sort((a,b)=>{
      const av=a[sc];
      const bv=b[sc];
      // coluna em minutos: ordena como NÚMERO, vazios sempre no fim
      if(sc==="min_finalizacao_pedido_amb"){
        const an=typeof av==="number"?av:null, bn=typeof bv==="number"?bv:null;
        if(an===null&&bn===null)return 0;
        if(an===null)return 1;
        if(bn===null)return -1;
        return sd==="asc"?an-bn:bn-an;
      }
      // created_at e campos de data/hora: comparação cronológica correta
      if(sc==="created_at"||COLS.find(([f])=>f===sc)?.[4]==="date"||COLS.find(([f])=>f===sc)?.[4]==="time"){
        const as=String(av||"");
        const bs=String(bv||"");
        if(!as&&!bs)return 0;
        if(!as)return 1;
        if(!bs)return -1;
        return sd==="asc"?as.localeCompare(bs):bs.localeCompare(as);
      }
      const avs=(av||"").toString().toLowerCase();
      const bvs=(bv||"").toString().toLowerCase();
      return sd==="asc"?avs.localeCompare(bvs,"pt"):bvs.localeCompare(avs,"pt");
    });
  },[rows,search,fG,fS,fF,sc,sd]);

  const stats=useMemo(()=>{
    const total=filtered.length;
    const conc=filtered.filter(r=>["FICHA FINALIZADA","FICHA FINALIZADA VIA CROSS","FICHA FINALIZADA PELA CROSS","REMOÇÃO CONCLUÍDA","CONCLUIDO"].includes(r.status)).length;
    const nao=filtered.filter(r=>(r.status||"").includes("NÃO REALIZADA")).length;
    const verm=filtered.filter(r=>r.gravidade==="emergencia"||r.gravidade==="VERMELHO").length;
    const tempos=filtered.filter(r=>r.tempo_espera).map(r=>{const[h,m]=r.tempo_espera.split(":").map(Number);return h*60+m;}).filter(n=>!isNaN(n));
    const med=tempos.length?Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length):0;
    const medH=Math.floor(med/60);
    const medM=med%60;
    const medStr=tempos.length?(medH>0?`${medH}h ${String(medM).padStart(2,"0")}min`:`${medM}min`):"—";
    return {total,conc,nao,verm,medStr,ct:tempos.length};
  },[filtered]);

  // Nome do arquivo exportado: carrega o período, para os backups mensais não se confundirem
  // (ex.: remocoes_outubro-de-2026_2026-10-31.xlsx)
  const nomeArquivo=ext=>{
    const tag=String(faixa.rotulo||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    return `remocoes_${tag}_${isoLocal(new Date())}.${ext}`;
  };

  function exportXLS(){
    if(!window.XLSX){push("XLSX não carregado","err");return;}
    try{
      const safe=v=>{
        if(v===null||v===undefined)return "";
        if(typeof v==="boolean")return v?"Sim":"Não";
        if(typeof v==="object")return String(v);
        return String(v);
      };
      // Na exportação o valor continua "HH:MM" (dá para somar/ordenar no Excel); o título passa a dizer que são horas:minutos.
      const hdr=["#",...COLS.map(([f,pl])=>String(pl||"")+((f==="tempo_espera"||f==="duracao_remocao")?" (horas:minutos)":(f==="min_finalizacao_pedido_amb"?" (minutos)":"")))];
      hdr.push("TEMPO DA FINALIZAÇÃO CROSS ATÉ A SOLICITAÇÃO DA AMBULÂNCIA (horas e minutos)");   // ao lado da coluna em minutos, só para leitura
      hdr.push("PROTOCOLO DE AVC");   // fica fora de COLS de propósito: COLS manda na tabela da tela e nas colunas da colagem do Excel
      const snapshot=[...filtered]; // captura o array neste momento
      const data=snapshot.map((r,i)=>[i+1,...COLS.map(([f])=>{
        const v=safe(r[f]);
        if(f==="data_solicitacao"&&v){try{return new Date(v+"T12:00:00").toLocaleDateString("pt-BR");}catch{return String(v);}}
        if(f==="gravidade"&&v)return String(gravInfo(v).label||v);
        return String(v);
      }),fmtMinCol(r.min_finalizacao_pedido_amb)||"",safe(r.protocolo_avc)]);   // Sim / Não / vazio (sem registro)
      const xlsSheet=window.XLSX.utils.aoa_to_sheet([hdr,...data]);
      const cw={prefixo_ambulancia:14,min_finalizacao_pedido_amb:14,data_retorno:12,data_saida_real:12,data_solicitacao:12,horario_solicitacao:8,ficha_cross:18,nome_paciente:26,setor:18,procedimento:14,especialidade:18,diagnostico:24,status:28,gravidade:14,data_resposta_cross:12,horario_resposta_cross:8,instituicao_destino:20,tipo_ambulancia:12,data_saida_ambulancia:12,hora_solic_ambulancia:10,horario_saida_ambulancia:10,tempo_espera:10,observacao:28,enfermeiro:16,tecnico_auxiliar:16,medico:16,horario_retorno:10,duracao_remocao:12};
      xlsSheet["!cols"]=[{wch:4},...COLS.map(([f])=>({wch:cw[f]||14})),{wch:18},{wch:14}];
      const wb=window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb,xlsSheet,"Remoções");   // ordem da biblioteca: (livro, planilha, nome)
      const fname=nomeArquivo("xlsx");
      window.XLSX.writeFile(wb,fname);
      setExportResult({tipo:"Excel",total:data.length,filename:fname});
    }catch(e){push("Erro ao exportar Excel: "+e.message,"err");}
  }

  function exportJSON(){
    try{
      const data=filtered.map(r=>{
        const o={};
        COLS.forEach(([f])=>{o[f]=(r[f]===false||r[f]===true||typeof r[f]==="number")?r[f]:(r[f]||"");}); // mantém Sim/Não; vazio continua vazio
        o.protocolo_avc=(r.protocolo_avc===true||r.protocolo_avc===false)?r.protocolo_avc:"";   // true / false / "" (sem registro)
        return o;
      });
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      const fname=nomeArquivo("json");
      a.href=url;
      a.download=fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setExportResult({tipo:"JSON",total:data.length,filename:fname});
    }catch(e){push("Erro ao exportar JSON: "+e.message,"err");}
  }

  return(
    <div className="app">
      <div className="topbar">
        <div className="ti">
          <div className="tb">
            <div className="tico"><span>+</span></div>
            <div><div className="tn">Gerência de Enfermagem</div><div className="ts">Controle de Remoções</div></div>
          </div>
          <a href="." style={{padding:"5px 10px",border:"1px solid #334155",borderRadius:6,background:"none",color:"#94A3B8",fontSize:11,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5}}>← Kanban</a>
          {!PODE_EDITAR&&<span title="Você pode consultar a planilha, mas não alterar." style={{padding:"4px 10px",borderRadius:99,background:"#FEF3C7",color:"#92400E",fontSize:11,fontWeight:700,border:"1px solid #FDE68A"}}>Somente leitura</span>}
        </div>
      </div>

      <div className="toolbar">
        <div className="tbi">
          <div className="sw"><Ico n="search" s={13}/><input className="si" placeholder="Buscar nome, ficha…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          {foco&&<div style={{display:"flex",alignItems:"center",gap:8,background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,padding:"5px 10px",fontSize:11.5,color:"#9A3412"}}>
            <span>Corrigindo{foco.campo?<> o campo <b>{foco.campo}</b></>:""} — linha destacada</span>
            <button className="btn btn-g btn-sm" onClick={()=>{setFoco(null);history.replaceState(null,"",window.location.pathname);}} style={{padding:"2px 8px"}}>✕</button>
          </div>}
          <select className="fsel" value={periodo} onChange={e=>setPeriodo(e.target.value)} style={{fontWeight:600,color:"#0F172A"}}
            title="Período carregado do servidor. Os outros meses continuam salvos no banco: é só trocar o período para vê-los.">
            <option value="30d">Últimos 30 dias</option>
            <option value="mes_atual">Mês atual</option>
            <option value="mes_ant">Mês anterior</option>
            <option value="90d">Últimos 90 dias</option>
            <option value="mes">Escolher mês…</option>
            <option value="tudo">Tudo</option>
          </select>
          {periodo==="mes"&&<input type="month" className="fsel" value={mesSel} onChange={e=>setMesSel(e.target.value||isoLocal(new Date()).slice(0,7))} style={{width:"auto"}}/>}
          <span style={{fontSize:11,color:"#64748B",whiteSpace:"nowrap",flexShrink:0}} title="Quantas remoções foram carregadas do servidor para este período">
            {loading?"Carregando…":`${rows.length} no período`}
          </span>
          <select className="fsel" value={fG} onChange={e=>setFG(e.target.value)}>
            <option value="">Gravidade</option>
            {G_OPTS.map(o=><option key={o} value={o}>{gravInfo(o).label}</option>)}
          </select>
          <select className="fsel" value={fS} onChange={e=>setFS(e.target.value)}>
            <option value="">Status</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="NÃO REALIZADA">Não realizada</option>
            <option value="REMOÇÃO">Em remoção</option>
            <option value="AGUARDANDO">Aguardando</option>
            <option value="ENCERRADA">Encerrada</option>
          </select>
          <select className="fsel" value={fF} onChange={e=>setFF(e.target.value)} title="Mostra só as remoções em que falta a data ou a hora de um momento do caminho (para completar à mão). Saída e retorno só olham a hora.">
            <option value="">Faltando…</option>
            {FALTA_OPCOES.map(([k,rot])=><option key={k} value={k}>{rot}</option>)}
          </select>
          {(search||fG||fS||fF)&&<button className="btn btn-g btn-sm" onClick={()=>{setSearch("");setFG("");setFS("");setFF("");}}>✕ Filtros</button>}
          {sc!=="created_at"&&<button className="btn btn-g btn-sm" title="Voltar à ordem de inserção (mais recente primeiro)" onClick={resetSort} style={{color:"#F59E0B",borderColor:"#FCD34D"}}>⇅ Resetar ordem</button>}
          <div style={{marginLeft:"auto",display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
            <input type="file" accept=".json,application/json" ref={jsonFileRef} style={{display:"none"}}
              onChange={e=>{const f=e.target.files[0];e.target.value="";handleImportJSON(f);}}/>

            <SplitButton
              label="Exportar"
              icon="download"
              variant="green"
              onMain={exportXLS}
              items={[
                {label:"Excel (.xlsx)",    icon:"excel",    action:exportXLS},
                {label:"JSON (.json)",     icon:"download", action:exportJSON},
              ]}
            />
            <SplitButton
              label="Importar"
              icon="import"
              variant="blue"
              onMain={()=>setShowKanbanImport(true)}
              items={[
                {label:"Do Kanban",        icon:"import",   action:()=>setShowKanbanImport(true)},
                {label:"Colar do Excel",   icon:"excel",    action:()=>setShowPaste(true)},
                {label:"Arquivo JSON",     icon:"download", action:()=>jsonFileRef.current&&jsonFileRef.current.click()},
              ]}
            />
            <button className="btn btn-p" onClick={()=>setModal({})}><Ico n="plus"/> Novo</button>
            <button className="btn btn-g" onClick={()=>setShowDuplicates(true)} title="Verificar registros com nomes repetidos no período exibido">🔍 Duplicatas</button>
            <button className="btn btn-g btn-sm" onClick={()=>setQuebra(q=>!q)} aria-pressed={quebra}
              title={quebra?"Desligar: voltar a cortar o texto que não cabe na célula":"Ligar: o texto que não cabe na célula passa para a linha de baixo (fica salvo neste navegador)"}
              style={quebra?{background:"#DBEAFE",borderColor:"#93C5FD",color:"#1D4ED8",fontWeight:700}:undefined}>↵ Quebrar texto{quebra?": ligado":""}</button>
            <button className="btn btn-g btn-sm" title="Restaurar ordem e largura original das colunas" onClick={()=>{setMovColOrder(MOV_COLS_DEFAULT);const base={'#':48,actions:36};COLS.forEach(([f,,,,,,,w])=>{base[f]=w||100;});setWmap(base);localStorage.removeItem(LS_WMAP);localStorage.removeItem(LS_ORDER);localStorage.removeItem(LS_ORDER_V2);localStorage.removeItem(LS_ORDER_ANTIGA);setQuebra(false);}} style={{fontSize:11,padding:"4px 8px"}}>⚏ Colunas</button>
            <button className="btn btn-g" style={{color:"#DC2626",borderColor:"#FCA5A5"}} disabled={rows.length===0} onClick={handleDeleteAll}
              title="Exclui só as remoções do período exibido. Os outros períodos não são afetados."><Ico n="trash" s={13}/> Excluir período</button>
          </div>
        </div>
      </div>

      <div className="stats">
        <div className="chip"><span className="cl">Total</span><span className="cv">{stats.total}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#16A34A"}}/><span className="cl">Concluídas</span><span className="cv" style={{color:"#16A34A"}}>{stats.conc}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Não realizadas</span><span className="cv" style={{color:"#EF4444"}}>{stats.nao}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Emergências</span><span className="cv" style={{color:"#EF4444"}}>{stats.verm}</span></div>
        <div className="csep"/>
        <div className="chip"><span className="cl">⏱ Média espera</span><span className="cv" style={{color:"#7C3AED"}}>{stats.medStr}</span><span className="cl" style={{marginLeft:4}}>({stats.ct} reg.)</span></div>
      </div>

      <div className="tw">
        {loading?(<div className="empty" style={{marginTop:60}}><Ico n="pulse" s={24}/><p>Carregando…</p></div>)
        :filtered.length===0?(<div className="empty" style={{marginTop:60}}><p>{rows.length===0?(periodo==="tudo"?"Nenhum registro. Clique em «Novo» para começar.":`Nenhum registro em «${faixa.rotulo}». Mude o período ou clique em «Novo».`):"Nenhum resultado."}</p></div>)
        :(
          <table className={"rt"+(quebra?" rt-wrap":"")} ref={tableRef} style={{width:Object.values(wmap).reduce((a,b)=>a+b,0)}}>
            <colgroup>
              <col style={{width:wmap['#']}}/>
              {STK_COLS.map((colIdx)=>{
                const [f]=COLS[colIdx];
                return <col key={f} style={{width:wmap[f]}}/>;
              })}
              {movColOrder.map((colIdx)=>{
                const [f]=COLS[colIdx];
                return <col key={f} style={{width:wmap[f]}}/>;
              })}
              <col style={{width:wmap.actions}}/>
            </colgroup>
            <thead><tr>
              {/* Coluna # */}
              <th className="stk stk-last" style={{position:"relative",textAlign:"center",cursor:"default",borderRight:"2px solid #475569",overflow:"hidden"}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,height:"100%"}}>
                  <span style={{fontSize:9,color:"#94A3B8",lineHeight:1}}>#</span>
                  <input type="checkbox" className="row-checkbox"
                    checked={filtered.length>0&&selectedRows.size===filtered.length}
                    onChange={e=>{
                      if(e.target.checked) setSelectedRows(new Set(filtered.map(r=>r.id)));
                      else setSelectedRows(new Set());
                    }}
                    title="Selecionar todos"
                  />
                </div>
              </th>
              {/* 4 Colunas sticky — renderizadas sempre primeiro, sem drag */}
              {STK_COLS.map((colIdx,si)=>{
                const [f,planilha,xls,kanban,,,tip]=COLS[colIdx];
                const isLast=colIdx===3;
                const isSorted=sc===f;
                return(
                  <th key={f} data-field={f}
                    style={{position:"relative",cursor:"pointer",overflow:"hidden"}}
                    {...tipProps(planilha,kanban,tip)}
                    className={`th-wrap${isSorted?" sorted":""} stk${isLast?" stk-last":""}`}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:2,paddingRight:10,userSelect:"none"}}
                      onClick={()=>toggleSort(f)}>
                      <span className="col-label" style={{fontSize:9,lineHeight:1.25,wordBreak:"break-word",flexGrow:1}}>{xls}</span>
                      <span className={`sarr${isSorted?" on":""}`} style={{flexShrink:0,marginTop:1}}>
                        {isSorted?(sd==="asc"?"▲":"▼"):"⇅"}
                      </span>
                    </div>
                    <div
                      style={{position:"absolute",right:0,top:0,width:8,height:"100%",cursor:"col-resize",zIndex:20,background:"transparent"}}
                      onMouseDown={e=>{e.stopPropagation();startDrag(f,e);}}
                      onDoubleClick={e=>{e.stopPropagation();autoFitCol(f);}}
                      title="Arrastar para redimensionar / duplo-clique para ajustar"
                    />
                  </th>
                );
              })}
              {/* Colunas móveis — reordenáveis via drag */}
              {movColOrder.map((colIdx,mPos)=>{
                const [f,planilha,xls,kanban,,,tip]=COLS[colIdx];
                const isSorted=sc===f;
                return(
                  <th key={f} data-field={f}
                    draggable
                    onDragStart={(e)=>{setTipAtivo(null);colDragStart(mPos,e);}}
                    onDragOver={(e)=>colDragOver(mPos,e)}
                    onDragEnd={colDragEnd}
                    style={{position:"relative",cursor:"pointer"}}
                    {...tipProps(planilha,kanban,tip)}
                    className={`th-wrap${isSorted?" sorted":""}`}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:2,paddingRight:10,userSelect:"none"}}
                      onClick={()=>toggleSort(f)}>
                      <span className="th-drag-handle" title="Arraste para reordenar"
                        onMouseDown={e=>e.stopPropagation()}>
                        <svg width="8" height="10" viewBox="0 0 8 10" fill="currentColor">
                          <circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/>
                          <circle cx="2" cy="5" r="1.2"/><circle cx="6" cy="5" r="1.2"/>
                          <circle cx="2" cy="8" r="1.2"/><circle cx="6" cy="8" r="1.2"/>
                        </svg>
                      </span>
                      <span className="col-label" style={{fontSize:9,lineHeight:1.25,wordBreak:"break-word",flexGrow:1}}>{xls}</span>
                      <span className={`sarr${isSorted?" on":""}`} style={{flexShrink:0,marginTop:1}}>
                        {isSorted?(sd==="asc"?"▲":"▼"):"⇅"}
                      </span>
                    </div>
                    <div
                      style={{position:"absolute",right:0,top:0,width:8,height:"100%",cursor:"col-resize",zIndex:20,background:"transparent"}}
                      onMouseDown={e=>{e.stopPropagation();startDrag(f,e);}}
                      onDoubleClick={e=>{e.stopPropagation();autoFitCol(f);}}
                      title="Arrastar para redimensionar / duplo-clique para ajustar"
                    />
                  </th>
                );
              })}
              <th style={{cursor:"default",borderLeft:"1px solid #334155"}}></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>{
                const gi=gravInfo(r.gravidade||"");
                const isBlank=r.id===blankRowId;
                const isActive=activeRow===r.id;
                const isSelected=selectedRows.has(r.id);
                const [L0,L1,L2,L3,L4]=stkLefts;

                // Mapa de células das colunas MÓVEIS (não-sticky)
                const movCellMap={
                  "setor":<td><Cell rowId={r.id} field="setor" value={r.setor} tipo="sel" optsKey="ST_OPTS" onSave={handleCell}/></td>,
                  "procedimento":<td><Cell rowId={r.id} field="procedimento" value={r.procedimento} tipo="sel" optsKey="P_OPTS" onSave={handleCell}/></td>,
                  "especialidade":<td><Cell rowId={r.id} field="especialidade" value={r.especialidade} onSave={handleCell}/></td>,
                  "diagnostico":<td><Cell rowId={r.id} field="diagnostico" value={r.diagnostico} onSave={handleCell}/></td>,
                  "status":<td>{r.status?<div style={{padding:"2px 6px"}}><span className={`sb ${S_CLS[r.status]||"se"}`} title={r.status} style={{cursor:"pointer"}} onClick={()=>handleCell(r.id,"status","")}>{r.status}</span></div>:<Cell rowId={r.id} field="status" value={r.status} tipo="sel" optsKey="S_OPTS" onSave={handleCell}/> }</td>,
                  "gravidade":<td>{r.gravidade?<div style={{padding:"2px 6px",cursor:"pointer"}} onClick={()=>handleCell(r.id,"gravidade","")}><span style={{display:"inline-block",padding:"1px 7px",borderRadius:99,fontSize:9,fontWeight:700,background:gi.bg,color:gi.fc,border:`1px solid ${gi.bd}`,whiteSpace:"nowrap"}}>{gi.label}</span></div>:<Cell rowId={r.id} field="gravidade" value={r.gravidade} tipo="sel" optsKey="G_OPTS" onSave={handleCell}/> }</td>,
                  "data_resposta_cross":<td><Cell rowId={r.id} field="data_resposta_cross" value={r.data_resposta_cross} tipo="date" onSave={handleCell} fmtDisplay={fmtD}/></td>,
                  "horario_resposta_cross":<td><Cell rowId={r.id} field="horario_resposta_cross" value={r.horario_resposta_cross} tipo="time" onSave={handleCell}/></td>,
                  "instituicao_destino":<td><Cell rowId={r.id} field="instituicao_destino" value={r.instituicao_destino} onSave={handleCell}/></td>,
                  "tipo_ambulancia":<td>{r.tipo_ambulancia?<div style={{padding:"2px 6px",cursor:"pointer"}} onClick={()=>handleCell(r.id,"tipo_ambulancia","")}><span className={`ab ${ehAvancada(r.tipo_ambulancia)?"aba":"abb"}`}>{r.tipo_ambulancia}</span></div>:<Cell rowId={r.id} field="tipo_ambulancia" value={r.tipo_ambulancia} tipo="sel" optsKey="A_OPTS" onSave={handleCell}/> }</td>,
                  "data_saida_ambulancia":<td><Cell rowId={r.id} field="data_saida_ambulancia" value={r.data_saida_ambulancia} tipo="date" onSave={handleCell} fmtDisplay={fmtD}/></td>,
                  "hora_solic_ambulancia":<td><Cell rowId={r.id} field="hora_solic_ambulancia" value={r.hora_solic_ambulancia} tipo="time" onSave={handleCell}/></td>,
                  "min_finalizacao_pedido_amb":<td><CelulaMinFinPed value={r.min_finalizacao_pedido_amb}/></td>,
                  "horario_saida_ambulancia":<td><Cell rowId={r.id} field="horario_saida_ambulancia" value={r.horario_saida_ambulancia} tipo="time" onSave={handleCell}/></td>,
                  "tempo_espera":<td><Cell rowId={r.id} field="tempo_espera" value={r.tempo_espera||tempoEsperaDe(r)||""} tipo="time" fmtDisplay={fmtHM} onSave={handleCell} colorStyle={{color:r.tempo_espera?"#7C3AED":"#6D28D9",fontWeight:700}}/></td>,
                  "observacao":<td><Cell rowId={r.id} field="observacao" value={r.observacao} onSave={handleCell}/></td>,
                  "enfermeiro":<td><Cell rowId={r.id} field="enfermeiro" value={r.enfermeiro} onSave={handleCell} fmtDisplay={fmtEquipe} sugestao={EQ_SEM.enfermeiro}/></td>,
                  "tecnico_auxiliar":<td><Cell rowId={r.id} field="tecnico_auxiliar" value={r.tecnico_auxiliar} onSave={handleCell} fmtDisplay={fmtEquipe} sugestao={EQ_SEM.tecnico_auxiliar}/></td>,
                  "medico":<td><Cell rowId={r.id} field="medico" value={r.medico} onSave={handleCell} fmtDisplay={fmtEquipe} sugestao={EQ_SEM.medico}/></td>,
                  "horario_retorno":<td><Cell rowId={r.id} field="horario_retorno" value={r.horario_retorno} tipo="time" onSave={handleCell}/></td>,
                  "duracao_remocao":<td><Cell rowId={r.id} field="duracao_remocao" value={r.duracao_remocao||duracaoDe(r)||""} tipo="time" fmtDisplay={fmtHM} onSave={handleCell} colorStyle={{color:r.duracao_remocao?"#0369A1":"#0284C7",fontWeight:700}}/></td>,
                  "finalizado":<td style={{textAlign:"center"}}><BoolCell rowId={r.id} field="finalizado" value={r.finalizado} onSave={handleCell}/></td>,
                  "data_saida_real":<td><Cell rowId={r.id} field="data_saida_real" value={r.data_saida_real} tipo="date" onSave={handleCell} fmtDisplay={fmtD} inferida={r.data_saida_real_inferida===true}/></td>,
                  "data_retorno":<td><Cell rowId={r.id} field="data_retorno" value={r.data_retorno} tipo="date" onSave={handleCell} fmtDisplay={fmtD} inferida={r.data_retorno_inferida===true}/></td>,
                  "permaneceu":<td style={{textAlign:"center"}}><BoolCell rowId={r.id} field="permaneceu" value={r.permaneceu} onSave={handleCell}/></td>,
                  "prefixo_ambulancia":<td><Cell rowId={r.id} field="prefixo_ambulancia" value={r.prefixo_ambulancia} onSave={handleCell}/></td>,
                  "motivo_demora_interna":<td><Cell rowId={r.id} field="motivo_demora_interna" value={r.motivo_demora_interna} tipo="sel" optsKey="M_OPTS" onSave={handleCell}/></td>,
                };

                return(
                  <tr key={r.id}
                    id={`row-${r.id}`}
                    ref={foco && foco.id===r.id ? el=>{
                      if(el && !el.dataset.rolou){
                        el.dataset.rolou="1";
                        setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),120);
                      }
                    } : null}
                    className={isActive?"row-active":""}
                    style={{
                      ...(isBlank?{background:"#FEFCE8",outline:"2px solid #FDE047",outlineOffset:"-2px"}:{}),
                      ...(foco && foco.id===r.id ? {background:"#FFF7ED",outline:"2px solid #FB923C",outlineOffset:"-2px"} : {}),
                    }}
                    onClick={()=>{setActiveRow(r.id); if(foco&&foco.id!==r.id) setFoco(null);}}>
                    {/* Coluna # com checkbox */}
                    <td className="stk stk-last" style={{left:L0,textAlign:"center",color:"#94A3B8",fontSize:10,fontWeight:700,borderRight:"2px solid #E2E8F0",padding:"0 4px",width:wmap['#'],maxWidth:wmap['#']}}>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                        <span style={{fontSize:10,lineHeight:1}}>{isBlank?<button className="btn btn-blue btn-sm" title="Colar linha copiada do Excel aqui" onClick={e=>{e.stopPropagation();handlePasteIntoRow(r.id);}} style={{padding:"2px 6px"}}><Ico n="excel" s={11}/></button>:i+1}</span>
                        <input type="checkbox" className="row-checkbox"
                          checked={isSelected}
                          onClick={e=>e.stopPropagation()}
                          onChange={e=>{
                            setSelectedRows(prev=>{
                              const next=new Set(prev);
                              e.target.checked?next.add(r.id):next.delete(r.id);
                              return next;
                            });
                          }}
                        />
                      </div>
                    </td>
                    {/* 4 Colunas sticky — sempre primeiro, na ordem fixa */}
                    <td className="stk" style={{left:L1}}><Cell rowId={r.id} field="data_solicitacao" value={r.data_solicitacao} tipo="date" onSave={handleCell} fmtDisplay={fmtD}/></td>
                    <td className="stk" style={{left:L2}}><Cell rowId={r.id} field="horario_solicitacao" value={r.horario_solicitacao} tipo="time" onSave={handleCell}/></td>
                    <td className="stk" style={{left:L3}}><Cell rowId={r.id} field="ficha_cross" value={r.ficha_cross} onSave={handleCell}/></td>
                    <td className="stk stk-last" style={{left:L4}}><Cell rowId={r.id} field="nome_paciente" value={r.nome_paciente} onSave={handleCell}/></td>
                    {/* Colunas móveis na ordem definida por movColOrder */}
                    {movColOrder.map(colIdx=>{
                      const [f]=COLS[colIdx];
                      return movCellMap[f]?React.cloneElement(movCellMap[f],{key:f}):<td key={f}><Cell rowId={r.id} field={f} value={r[f]} onSave={handleCell}/></td>;   // coluna sem célula própria: texto simples (nunca derruba a tela)
                    })}
                    <td style={{textAlign:"center"}}>
                      <button className="delbtn" title="Excluir" onClick={()=>handleDelete(r.id)}><Ico n="trash" s={11}/></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {/* Feature 4: Barra de seleção múltipla */}
      {selectedRows.size>0&&(
        <div className="bulk-bar">
          <strong>{selectedRows.size}</strong>
          <span>linha{selectedRows.size!==1?"s":""} selecionada{selectedRows.size!==1?"s":""}</span>
          <button className="btn btn-g btn-sm" onClick={()=>setSelectedRows(new Set())} style={{color:"#94A3B8"}}>Cancelar</button>
          <button className="btn btn-sm" style={{background:"#DC2626",color:"#fff",border:"none"}}
            onClick={()=>setShowDeleteConfirm(true)}>
            <Ico n="trash" s={11}/> Excluir {selectedRows.size} selecionada{selectedRows.size!==1?"s":""}
          </button>
        </div>
      )}
      {/* Modal confirmação delete múltiplo */}
      {showDeleteConfirm&&(
        <div className="mbk">
          <div className="confirm-modal">
            <div style={{marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:15,color:"#0F172A",marginBottom:6}}>Excluir {selectedRows.size} registro{selectedRows.size!==1?"s":""}?</div>
              <div style={{fontSize:13,color:"#64748B",lineHeight:1.5}}>Esta ação é permanente e não pode ser desfeita. Os registros selecionados serão removidos do banco de dados.</div>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn btn-g" onClick={()=>setShowDeleteConfirm(false)} disabled={saving}>Cancelar</button>
              <button className="btn btn-sm" style={{background:"#DC2626",color:"#fff",border:"none",padding:"6px 16px",fontSize:12}}
                disabled={saving} onClick={handleDeleteSelected}>
                {saving?"Excluindo…":"Confirmar exclusão"}
              </button>
            </div>
          </div>
        </div>
      )}
      {showKanbanImport&&<KanbanImportModal onClose={()=>setShowKanbanImport(false)} onImport={handleImport}/>}
      {showPaste&&<PasteModal onClose={()=>setShowPaste(false)} onImport={handleImportPaste}/>}
      {importErrors&&<ImportResultModal data={importErrors} onClose={()=>setImportErrors(null)}/>}
      {exportResult&&<ExportResultModal data={exportResult} onClose={()=>setExportResult(null)}/>}
      {showDuplicates&&<DuplicatesModal rows={rows} rotulo={faixa.rotulo} onClose={()=>setShowDuplicates(false)} onDelete={async(id)=>{await handleDelete(id);}}/>}
      {modal!==null&&<FormModal row={modal} onClose={()=>setModal(null)} onSave={handleSave} saving={saving}/>}
      {tipAtivo&&<div className="tipfix" style={{left:tipAtivo.x,top:tipAtivo.y}}>
        <strong>Planilha:</strong> {tipAtivo.planilha}<br/>
        <strong>Kanban:</strong> {tipAtivo.kanban||"—"}<br/>
        {tipAtivo.texto}
      </div>}
      <div className="tst">
        {ts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==="ok"?"✓":"✕"}</span><span>{t.msg}</span></div>)}
      </div>
    </div>
  );
}
// So monta o app depois de aplicar a sessao — evita a primeira rajada de
// requisicoes sair anonima e voltar vazia, o que pareceria "banco sem dados".
aplicarSessao().then(sess=>{
  if(sess) ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
});

</script>
</body>
</html>
