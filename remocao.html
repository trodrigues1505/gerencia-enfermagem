.toolbar{background:#fff;border-bottom:1px solid #E2E8F0;padding:0 20px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}

/* Toast */
function useToast(){
  const [toasts,setToasts]=useState([]);
  const push=useCallback((msg,type="ok")=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000);
  },[]);
  return {toasts,push};
}

/* Célula inline editável */
function EditCell({rowId, field, value, type="text", opts=null, onSave}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(value||"");
  const ref=useRef();

  useEffect(()=>{setVal(value||"");},[value]);
  useEffect(()=>{if(editing && ref.current) ref.current.focus();},[editing]);

  function commit(){
    setEditing(false);
    if(val!==(value||"")) onSave(rowId,field,val);
  }

  if(!editing) return (
    <div className="cell-view" onClick={()=>setEditing(true)}
      title="Clique para editar">
      {val||<span style={{color:"#CBD5E1"}}>—</span>}
    </div>
  );

  if(opts) return (
    <select ref={ref} className="cell-select" value={val}
      onChange={e=>setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={e=>e.key==="Escape"&&(setEditing(false),setVal(value||""))}>
      <option value="">—</option>
      {opts.map(o=><option key={o}>{o}</option>)}
    </select>
  );

  return (
    <input ref={ref} className="cell-input" type={type} value={val}
      onChange={e=>setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={e=>{
        if(e.key==="Enter") commit();
        if(e.key==="Escape"){setEditing(false);setVal(value||"");}
      }}/>
  );
}

                <input type="date" value={form.data_saida_ambulancia} onChange={e=>set("data_saida_ambulancia",e.target.value)}/></div>
              <div className="fd"><label>Horário Saída</label>
                <input type="time" value={form.horario_saida_ambulancia} onChange={e=>set("horario_saida_ambulancia",e.target.value)}/></div>
              <div className="fd"><label>Tempo Espera</label>
                <input type="text" placeholder="01:30" value={form.tempo_espera} onChange={e=>set("tempo_espera",e.target.value)}/></div>
              <div className="fd"><label>Retorno</label>
                <input type="time" value={form.horario_retorno} onChange={e=>set("horario_retorno",e.target.value)}/></div>
            </div>
          </div>
          <div className="fs">
            <div className="fst">Equipe</div>
            <div className="fg fg3">
              <div className="fd"><label>Enfermeiro(a)</label>
                <input type="text" placeholder="Nome" value={form.enfermeiro} onChange={e=>set("enfermeiro",e.target.value)}/></div>
              <div className="fd"><label>Técnico / Auxiliar</label>
                <input type="text" placeholder="Nome" value={form.tecnico_auxiliar} onChange={e=>set("tecnico_auxiliar",e.target.value)}/></div>
              <div className="fd"><label>Médico(a)</label>
                <input type="text" placeholder="Nome" value={form.medico} onChange={e=>set("medico",e.target.value)}/></div>
            </div>
          </div>
          <div className="fs" style={{marginBottom:0}}>
            <div className="fst">Observação</div>
            <div className="fd">
              <textarea rows={3} placeholder="Observações…" value={form.observacao} onChange={e=>set("observacao",e.target.value)}/>
            </div>
          </div>
        </div>
        <div className="mft">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" disabled={loading||!form.nome_paciente} onClick={()=>onSave(form)}>
            {loading?"Salvando…":(row?.id?"Salvar":"Criar Registro")}
          </button>
        </div>
      </div>
    </div>
  );
}

/* App principal */
function App(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [modal,setModal]=useState(null);
  const [search,setSearch]=useState("");
  const [fGrav,setFGrav]=useState("");
  const [fStatus,setFStatus]=useState("");
  const [fMes,setFMes]=useState("");
  const {toasts,push}=useToast();

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const d=await apiGet("remocoes?select=*&order=data_solicitacao.desc,horario_solicitacao.desc");
      setRows(Array.isArray(d)?d:[]);
    }catch(e){push("Erro ao carregar: "+e.message,"err");}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{load();},[]);

  /* Salva registro completo */
  const handleSave=async(form)=>{
    setSaving(true);
    try{
      const p={...form};
      Object.keys(p).forEach(k=>{if(p[k]==="")p[k]=null;});
      if(form.id){await apiFn({action:"update",id:form.id,...p});push("Atualizado");}
      else{await apiFn({action:"create",...p});push("Criado");}
      setModal(null);
      await load();
    }catch(e){push(e.message||"Erro","err");}
    finally{setSaving(false);}
  };

  /* Edição inline de célula */
  const handleCellSave=async(rowId,field,value)=>{
    try{
      await apiFn({action:"update",id:rowId,[field]:value||null});
      setRows(r=>r.map(x=>x.id===rowId?{...x,[field]:value}:x));
    }catch(e){push(e.message,"err");}
  };

  const handleDelete=async(id)=>{
    if(!confirm("Excluir este registro?")) return;
    try{
      await apiFn({action:"delete",id});
      push("Excluído");
      setRows(r=>r.filter(x=>x.id!==id));
    }catch(e){push(e.message||"Erro","err");}
  };

  const filtered=useMemo(()=>{
    let d=rows;
    if(search){const s=search.toLowerCase();d=d.filter(r=>(r.nome_paciente||"").toLowerCase().includes(s)||(r.ficha_cross||"").toLowerCase().includes(s)||(r.diagnostico||"").toLowerCase().includes(s)||(r.instituicao_destino||"").toLowerCase().includes(s));}
    if(fGrav) d=d.filter(r=>r.gravidade===fGrav);
    if(fStatus) d=d.filter(r=>(r.status||"").includes(fStatus));
    if(fMes) d=d.filter(r=>(r.data_solicitacao||"").startsWith(fMes));
    return d;
  },[rows,search,fGrav,fStatus,fMes]);

  const stats=useMemo(()=>{
    const total=filtered.length;
    const conc=filtered.filter(r=>["FICHA FINALIZADA","FICHA FINALIZADA VIA CROSS","FICHA FINALIZADA PELA CROSS","REMOÇÃO CONCLUÍDA","CONCLUIDO"].includes(r.status)).length;
    const nao=filtered.filter(r=>(r.status||"").includes("NÃO REALIZADA")).length;
    const verm=filtered.filter(r=>r.gravidade==="VERMELHO").length;
    return {total,conc,nao,verm};
  },[filtered]);

  const exportCSV=()=>{
    const cols=["data_solicitacao","horario_solicitacao","ficha_cross","nome_paciente","setor","procedimento","especialidade","diagnostico","status","gravidade","data_resposta_cross","horario_resposta_cross","instituicao_destino","tipo_ambulancia","data_saida_ambulancia","horario_saida_ambulancia","tempo_espera","observacao","enfermeiro","tecnico_auxiliar","medico","horario_retorno"];
    const hdrs=["Data","Hora","Ficha","Paciente","Setor","Procedimento","Especialidade","Diagnóstico","Status","Gravidade","Data Resp.","Hora Resp.","Destino","Ambulância","Data Saída","Hora Saída","T.Espera","Obs.","Enfermeiro","Técnico","Médico","Retorno"];
    const lines=[hdrs.join(","),...filtered.map(r=>cols.map(c=>`"${(r[c]||"").toString().replace(/"/g,'""')}"`).join(","))];
    const b=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=`remocoes_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const hasFilter=search||fGrav||fStatus||fMes;

  return (
    <div style={{minHeight:"100vh",background:"#F1F5F9"}}>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="t-brand">
            <div className="t-icon"><span>+</span></div>
            <div>
              <div className="t-name">Gerência de Enfermagem</div>
              <div className="t-sub">Controle de Remoções</div>
            </div>
          </div>
          <a href="." style={{padding:"6px 12px",border:"1px solid #334155",borderRadius:7,background:"none",color:"#94A3B8",cursor:"pointer",fontSize:12,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:6}}>
            ← Kanban
          </a>
        </div>
      </div>

      <div className="toolbar">
        <div className="toolbar-inner">
          <div className="s-wrap">
            <Ico n="search" s={14}/>
            <input className="s-input" placeholder="Buscar paciente, ficha, diagnóstico…" value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <select className="fsel" value={fGrav} onChange={e=>setFGrav(e.target.value)}>
            <option value="">Todas as gravidades</option>
            {GRAV_OPTS.map(o=><option key={o}>{o}</option>)}
          </select>
          <select className="fsel" value={fStatus} onChange={e=>setFStatus(e.target.value)}>
            <option value="">Todos os status</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="CONCLUÍDA">Concluída</option>
            <option value="NÃO REALIZADA">Não realizada</option>
            <option value="ENCERRADA">Encerrada</option>
            <option value="REMOÇÃO">Em remoção</option>
            <option value="AGUARDANDO">Aguardando</option>
          </select>
          <input type="month" className="fsel" value={fMes} onChange={e=>setFMes(e.target.value)} style={{width:"auto"}}/>
          {hasFilter&&<button className="btn btn-ghost btn-sm" onClick={()=>{setSearch("");setFGrav("");setFStatus("");setFMes("");}}>Limpar</button>}
          <div style={{marginLeft:"auto",display:"flex",gap:8}}>
            <button className="btn btn-ghost" onClick={exportCSV}><Ico n="dl" s={14}/> Exportar CSV</button>
            <button className="btn btn-primary" onClick={()=>setModal({})}>+ Novo Registro</button>
          </div>
        </div>
      </div>

      <div className="stats">
        <div className="chip"><span className="lbl">Total</span><span className="val">{stats.total}</span></div>
        <div className="chip"><div className="dot" style={{background:"#16A34A"}}/><span className="lbl">Concluídas</span><span className="val" style={{color:"#16A34A"}}>{stats.conc}</span></div>
        <div className="chip"><div className="dot" style={{background:"#EF4444"}}/><span className="lbl">Não realizadas</span><span className="val" style={{color:"#EF4444"}}>{stats.nao}</span></div>
        <div className="chip"><div className="dot" style={{background:"#EF4444"}}/><span className="lbl">Emergências</span><span className="val" style={{color:"#EF4444"}}>{stats.verm}</span></div>
      </div>

      <div className="twrap">
        {loading?(
          <div className="empty"><Ico n="pulse" s={32}/><p>Carregando…</p></div>
        ):filtered.length===0?(
          <div className="empty">
            <Ico n="pulse" s={32}/>
            <p>{rows.length===0?"Nenhum registro. Clique em «Novo Registro» para começar.":"Nenhum resultado para o filtro aplicado."}</p>
          </div>
        ):(
          <table className="rtable">
            <thead><tr>
              <th>#</th>
              <th>Data / Hora</th>
              <th>Ficha CROSS</th>
              <th>Paciente</th>
              <th>Setor</th>
              <th>Especialidade</th>
              <th>Diagnóstico</th>
              <th>Destino</th>
              <th>Gravidade</th>
              <th>Status</th>
              <th>Ambulância</th>
              <th>Saída</th>
              <th>Retorno</th>
              <th>Enfermeiro</th>
              <th>Técnico</th>
              <th>Médico</th>
              <th>Obs.</th>
              <th style={{width:64}}></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>(
                <tr key={r.id}>
                  <td>{i+1}</td>
                  <td>
                    <div style={{padding:"0 12px"}}>
                      <div style={{fontSize:12,color:"#374151",fontVariantNumeric:"tabular-nums"}}>{fmtD(r.data_solicitacao)}</div>
                      <div style={{fontSize:10,color:"#94A3B8"}}>{r.horario_solicitacao||""}</div>
                    </div>
                  </td>
                  <td><EditCell rowId={r.id} field="ficha_cross" value={r.ficha_cross} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="nome_paciente" value={r.nome_paciente} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="setor" value={r.setor} opts={SETOR_OPTS} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="especialidade" value={r.especialidade} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="diagnostico" value={r.diagnostico} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="instituicao_destino" value={r.instituicao_destino} onSave={handleCellSave}/></td>
                  <td>
                    {r.gravidade
                      ?<div style={{padding:"0 12px"}}>
                          <span className={`gb ${GRAV_CLS[r.gravidade]||"gc"}`}>
                            <span className="dot" style={{background:GRAV_DOT[r.gravidade]||"#94A3B8"}}/>
                            {r.gravidade}
                          </span>
                        </div>
                      :<EditCell rowId={r.id} field="gravidade" value={r.gravidade} opts={GRAV_OPTS} onSave={handleCellSave}/>
                    }
                  </td>
                  <td>
                    {r.status
                      ?<div style={{padding:"0 8px"}}>
                          <span className={`sb ${STATUS_CLS[r.status]||"se"}`}>
                            {r.status.length>22?r.status.slice(0,22)+"…":r.status}
                          </span>
                        </div>
                      :<EditCell rowId={r.id} field="status" value={r.status} opts={STATUS_OPTS} onSave={handleCellSave}/>
                    }
                  </td>
                  <td>
                    {r.tipo_ambulancia
                      ?<div style={{padding:"0 8px"}}>
                          <span className={`ab2 ${r.tipo_ambulancia==="AVANÇADA"?"aba":"abb"}`}>{r.tipo_ambulancia}</span>
                        </div>
                      :<EditCell rowId={r.id} field="tipo_ambulancia" value={r.tipo_ambulancia} opts={AMBU_OPTS} onSave={handleCellSave}/>
                    }
                  </td>
                  <td><EditCell rowId={r.id} field="horario_saida_ambulancia" value={r.horario_saida_ambulancia} type="time" onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="horario_retorno" value={r.horario_retorno} type="time" onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="enfermeiro" value={r.enfermeiro} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="tecnico_auxiliar" value={r.tecnico_auxiliar} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="medico" value={r.medico} onSave={handleCellSave}/></td>
                  <td><EditCell rowId={r.id} field="observacao" value={r.observacao} onSave={handleCellSave}/></td>
                  <td>
                    <div className="ra">
                      <button className="ab3 del" title="Excluir" onClick={()=>handleDelete(r.id)}><Ico n="trash" s={14}/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {modal!==null&&<FormModal row={modal} onClose={()=>setModal(null)} onSave={handleSave} loading={saving}/>}

      <div className="tstack">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.type}`}>
            <span>{t.type==="ok"?"✓":"✕"}</span>
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
