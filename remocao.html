/* Cálculo automático tempo de espera */
function calcTempo(horaSolic, horaSaida) {
  if(!horaSolic||!horaSaida) return "";
  try {
    const [h1,m1]=horaSolic.split(":").map(Number);
    const [h2,m2]=horaSaida.split(":").map(Number);
    let diff=(h2*60+m2)-(h1*60+m1);
    if(diff<0) diff+=24*60;
    const hh=Math.floor(diff/60).toString().padStart(2,"0");
    const mm=(diff%60).toString().padStart(2,"0");
    return `${hh}:${mm}`;
  }catch{return "";}
}

  const [ts,setTs]=useState([]);
  const push=useCallback((msg,type="ok")=>{
    const id=Date.now();
    setTs(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),4000);
  },[]);
  return {ts,push};
}

/* Célula editável */
function Cell({rowId,field,value,type,opts,onSave}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(value||"");
  const ref=useRef();
  useEffect(()=>{setVal(value||"");},[value]);
  useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);
  function commit(){
    setEditing(false);
    if(val!==(value||""))onSave(rowId,field,val);
  }
  if(!editing) return (
    <div className={`cv2 ${!val?"empty":""}`} onClick={()=>setEditing(true)} title={val||"Clique para editar"}>
      {val||"—"}
    </div>
  );
  if(opts) return (
    <select ref={ref} className="csel" value={val}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>e.key==="Escape"&&(setEditing(false),setVal(value||""))}>
      <option value="">—</option>
      {opts.map(o=><option key={o}>{o}</option>)}
    </select>
  );
  return (
    <input ref={ref} className="ci" type={type||"text"} value={val}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setVal(value||"");}}}/>
  );
}

/* Modal importar aceite */
function AceiteModal({onClose,onImport}){
  const [cards,setCards]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(new Set());

  useEffect(()=>{
    apiGet("cards?col_id=eq.aceite&select=*&order=created_at.asc")
      .then(d=>setCards(Array.isArray(d)?d:[]))
      .catch(()=>setCards([]))
      .finally(()=>setLoading(false));
  },[]);

  const allSel = cards.length>0 && sel.size===cards.length;

  function toggleAll(){
    if(allSel) setSel(new Set());
    else setSel(new Set(cards.map(c=>c.id)));
  }
  function toggle(id){
    setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  }

  return (
    <div className="mbk" onClick={e=>e.target===e.currentTarget&&onClose()}>

          {loading && <div className="empty"><Ico n="pulse" s={24}/><p>Carregando…</p></div>}

                    {c.nome}{c.idade?` — ${c.idade}`:""}

        </div>

    </div>
  );
}

/* App */
function App(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [modal,setModal]=useState(null);
  const [showAceite,setShowAceite]=useState(false);
  const [search,setSearch]=useState("");
  const [fGrav,setFGrav]=useState("");
  const [fStatus,setFStatus]=useState("");
  const [fMes,setFMes]=useState("");
  const [sortCol,setSortCol]=useState("created_at");
  const [sortDir,setSortDir]=useState("desc");
  const {ts,push}=useToast();

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const d=await apiGet("remocoes?select=*&order=created_at.desc");
      setRows(Array.isArray(d)?d:[]);
    }catch(e){push("Erro: "+e.message,"err");}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[]);

  const handleSave=async(form)=>{
    setSaving(true);
    try{
      const p={...form};
      // Calcular tempo de espera antes de salvar
      if(p.horario_solicitacao&&p.horario_saida_ambulancia&&!p.tempo_espera){
        p.tempo_espera=calcTempo(p.horario_solicitacao,p.horario_saida_ambulancia);
      }
      Object.keys(p).forEach(k=>{if(p[k]==="")p[k]=null;});
      if(form.id){await apiFn({action:"update",id:form.id,...p});push("Atualizado");}
      else{await apiFn({action:"create",...p});push("Criado!");}
      setModal(null);
      await load();
    }catch(e){push(e.message||"Erro","err");}
    finally{setSaving(false);}
  };

  const handleCell=async(rowId,field,value)=>{
    try{
      const update={action:"update",id:rowId,[field]:value||null};
      // Recalcular tempo de espera se campo relevante mudou
      const row=rows.find(r=>r.id===rowId);
      if(row&&(field==="horario_saida_ambulancia"||field==="horario_solicitacao")){
        const hs=field==="horario_solicitacao"?value:row.horario_solicitacao;
        const hsa=field==="horario_saida_ambulancia"?value:row.horario_saida_ambulancia;
        const te=calcTempo(hs,hsa);
        if(te) update.tempo_espera=te;
      }
      await apiFn(update);
      setRows(r=>r.map(x=>x.id===rowId?{...x,[field]:value,...(update.tempo_espera?{tempo_espera:update.tempo_espera}:{})}:x));
    }catch(e){push(e.message,"err");}
  };

  const handleDelete=async(id)=>{
    if(!confirm("Excluir este registro permanentemente?"))return;
    try{
      await apiFn({action:"delete",id});
      push("Excluído");
      setRows(r=>r.filter(x=>x.id!==id));
    }catch(e){push(e.message||"Erro ao excluir","err");}
  };

  const handleImport=async(cards)=>{
    let ok=0,fail=0;
    for(const c of cards){
      try{
        const hoje=new Date().toISOString().split("T")[0];
        const agora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        await apiFn({action:"create",nome_paciente:c.nome||"",setor:c.setor||"",especialidade:c.rec||"",diagnostico:c.hd||"",instituicao_destino:c.hosp||"",tipo_ambulancia:AMB_MAP[c.amb]||"",gravidade:GC_MAP[c.grav]||"AMARELO",data_solicitacao:hoje,horario_solicitacao:agora,status:"PACIENTE AGUARDANDO AMBULÂNCIA",horario_saida_ambulancia:c.saida||"",horario_retorno:c.retorno||"",enfermeiro:"",tecnico_auxiliar:"",medico:""});
        ok++;
      }catch{fail++;}
    }
    push(`${ok} importado${ok!==1?"s":""}${fail>0?` (${fail} erro${fail!==1?"s":""})`:""}`,fail>0?"err":"ok");
    await load();
  };

  function toggleSort(col){
    if(sortCol===col)setSortDir(d=>d==="asc"?"desc":"asc");
    else{setSortCol(col);setSortDir("asc");}
  }

  const filtered=useMemo(()=>{
    let d=rows;
    if(search){const s=search.toLowerCase();d=d.filter(r=>(r.nome_paciente||"").toLowerCase().includes(s)||(r.ficha_cross||"").toLowerCase().includes(s)||(r.diagnostico||"").toLowerCase().includes(s)||(r.instituicao_destino||"").toLowerCase().includes(s));}
    if(fGrav)d=d.filter(r=>r.gravidade===fGrav);
    if(fStatus)d=d.filter(r=>(r.status||"").includes(fStatus));
    if(fMes)d=d.filter(r=>(r.data_solicitacao||"").startsWith(fMes));
    return [...d].sort((a,b)=>{
      const av=(a[sortCol]||"").toString().toLowerCase();
      const bv=(b[sortCol]||"").toString().toLowerCase();
      return sortDir==="asc"?av.localeCompare(bv,"pt"):bv.localeCompare(av,"pt");
    });
  },[rows,search,fGrav,fStatus,fMes,sortCol,sortDir]);

  const stats=useMemo(()=>{
    const total=filtered.length;
    const conc=filtered.filter(r=>["FICHA FINALIZADA","FICHA FINALIZADA VIA CROSS","FICHA FINALIZADA PELA CROSS","REMOÇÃO CONCLUÍDA","CONCLUIDO"].includes(r.status)).length;
    const nao=filtered.filter(r=>(r.status||"").includes("NÃO REALIZADA")).length;
    const verm=filtered.filter(r=>r.gravidade==="VERMELHO").length;
    // Dashboard horários
    const comSaida=filtered.filter(r=>r.horario_saida_ambulancia).length;
    const tempos=filtered.filter(r=>r.tempo_espera).map(r=>{
      const [h,m]=r.tempo_espera.split(":").map(Number);
      return h*60+m;
    }).filter(n=>!isNaN(n));
    const mediaMin=tempos.length?Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length):0;
    const mediaStr=tempos.length?`${Math.floor(mediaMin/60).toString().padStart(2,"0")}: ${(mediaMin%60).toString().padStart(2,"0")}`:"-";
    return {total,conc,nao,verm,comSaida,mediaEspera:mediaStr};
  },[filtered]);

  /* Export XLS */
  function exportXLS(){
    const hdrs=COLS.map(([,h])=>h);
    const fields=COLS.map(([f])=>f);
    const data=[hdrs,...filtered.map(r=>fields.map(f=>r[f]||""))];
    const ws=window.XLSX.utils.aoa_to_sheet(data);
    // Larguras
    ws["!cols"]=COLS.map(([,,cls])=>{
      const w={col-data:10,col-hora:8,col-ficha:16,col-nome:24,col-setor:16,col-proc:14,col-esp:18,col-diag:22,col-status:24,col-grav:12,col-drdata:10,col-drhora:8,col-dest:16,col-amb:12,col-bdata:10,col-saida:8,col-esp2:10,col-obs:24,col-enf:16,col-tec:16,col-med:16,col-ret:8}[cls]||14;
      return {wch:w};
    });
    const wb=window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb,"Remoções",ws);
    window.XLSX.writeFile(wb,`remocoes_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  const opts={SETOR_OPTS,PROC_OPTS,STATUS_OPTS,GRAV_OPTS,AMBU_OPTS};

  return (
    <div className="app">
      <div className="topbar">
        <div className="ti">
          <div className="tb">
            <div className="tico"><span>+</span></div>
            <div><div className="tn">Gerência de Enfermagem</div><div className="ts">Controle de Remoções</div></div>
          </div>
          <a href="." style={{padding:"5px 10px",border:"1px solid #334155",borderRadius:6,background:"none",color:"#94A3B8",fontSize:11,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5}}>← Kanban</a>
        </div>
      </div>

      <div className="toolbar">
        <div className="tbi">
          <div className="sw">
            <Ico n="search" s={13}/>
            <input className="si" placeholder="Buscar…" value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <select className="fsel" value={fGrav} onChange={e=>setFGrav(e.target.value)}>
            <option value="">Gravidade</option>
            {GRAV_OPTS.map(o=><option key={o}>{o}</option>)}
          </select>
          <select className="fsel" value={fStatus} onChange={e=>setFStatus(e.target.value)}>
            <option value="">Status</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="NÃO REALIZADA">Não realizada</option>
            <option value="REMOÇÃO">Em remoção</option>
            <option value="AGUARDANDO">Aguardando</option>
            <option value="ENCERRADA">Encerrada</option>
          </select>
          <input type="month" className="fsel" value={fMes} onChange={e=>setFMes(e.target.value)} style={{width:"auto"}}/>
          {(search||fGrav||fStatus||fMes)&&<button className="btn btn-g btn-sm" onClick={()=>{setSearch("");setFGrav("");setFStatus("");setFMes("");}}>✕ Limpar</button>}
          <div style={{marginLeft:"auto",display:"flex",gap:6}}>
            <button className="btn btn-g" onClick={exportXLS} style={{color:"#16A34A",borderColor:"#86EFAC"}}><Ico n="excel"/> Excel</button>
            <button className="btn btn-blue" onClick={()=>setShowAceite(true)}><Ico n="import"/> Importar Aceite</button>
            <button className="btn btn-p" onClick={()=>setModal({})}><Ico n="plus"/> Novo</button>
          </div>
        </div>
      </div>

      <div className="stats">
        <div className="chip"><span className="cl">Total</span><span className="cv">{stats.total}</span></div>
        <div className="chip-sep"/>
        <div className="chip"><div className="cdot" style={{background:"#16A34A"}}/><span className="cl">Concluídas</span><span className="cv" style={{color:"#16A34A"}}>{stats.conc}</span></div>
        <div className="chip-sep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Não realizadas</span><span className="cv" style={{color:"#EF4444"}}>{stats.nao}</span></div>
        <div className="chip-sep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Emergências</span><span className="cv" style={{color:"#EF4444"}}>{stats.verm}</span></div>
        <div className="chip-sep"/>
        <div className="chip"><span className="cl">Com saída AMB</span><span className="cv">{stats.comSaida}</span></div>
        <div className="chip-sep"/>
        <div className="chip"><span className="cl">⏱ Média espera</span><span className="cv" style={{color:"#7C3AED"}}>{stats.mediaEspera}</span></div>
      </div>

      <div className="tw">
        {loading?(
          <div className="empty" style={{marginTop:40}}><Ico n="pulse" s={24}/><p>Carregando…</p></div>
        ):filtered.length===0?(
          <div className="empty" style={{marginTop:40}}>
            <p>{rows.length===0?"Nenhum registro. Clique em «Novo» para começar.":"Nenhum resultado para o filtro."}</p>
          </div>
        ):(
          <table className="rt">
            <thead><tr>
              <th>#</th>
              {COLS.map(([f,h,cls,,, tip])=>(
                <th key={f} className={`${cls} th-tip${sortCol===f?" sorted":""}`} onClick={()=>toggleSort(f)}>
                  <div className="th-inner">
                    {h}
                    <span className={`sort-arr${sortCol===f?" on":""}`}>
                      {sortCol===f?(sortDir==="asc"?"▲":"▼"):"⇅"}
                    </span>
                  </div>
                  <div className="tip-box">{tip}</div>
                </th>
              ))}
              <th></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>(
                <tr key={r.id}>
                  <td>{i+1}</td>
                  <td className="col-data"><div style={{padding:"0 6px",fontSize:10,whiteSpace:"nowrap"}}>{fmtD(r.data_solicitacao)||"—"}</div></td>
                  <td className="col-hora"><Cell rowId={r.id} field="horario_solicitacao" value={r.horario_solicitacao} type="time" onSave={handleCell}/></td>
                  <td className="col-ficha"><Cell rowId={r.id} field="ficha_cross" value={r.ficha_cross} onSave={handleCell}/></td>
                  <td className="col-nome"><Cell rowId={r.id} field="nome_paciente" value={r.nome_paciente} onSave={handleCell}/></td>
                  <td className="col-setor"><Cell rowId={r.id} field="setor" value={r.setor} opts={SETOR_OPTS} onSave={handleCell}/></td>
                  <td className="col-proc"><Cell rowId={r.id} field="procedimento" value={r.procedimento} opts={PROC_OPTS} onSave={handleCell}/></td>
                  <td className="col-esp"><Cell rowId={r.id} field="especialidade" value={r.especialidade} onSave={handleCell}/></td>
                  <td className="col-diag"><Cell rowId={r.id} field="diagnostico" value={r.diagnostico} onSave={handleCell}/></td>
                  <td className="col-status">
                    {r.status
                      ?<div style={{padding:"0 6px"}}><span className={`sb2 ${STATUS_CLS[r.status]||"se"}`} title={r.status}>{r.status.length>22?r.status.slice(0,22)+"…":r.status}</span></div>
                      :<Cell rowId={r.id} field="status" value={r.status} opts={STATUS_OPTS} onSave={handleCell}/>
                    }
                  </td>
                  <td className="col-grav">
                    {r.gravidade
                      ?<div style={{padding:"0 6px"}}><span className={`gb ${GRAV_CLS[r.gravidade]||"gc"}`}><span className="gd" style={{background:GRAV_DOT[r.gravidade]||"#94A3B8"}}/> {r.gravidade}</span></div>
                      :<Cell rowId={r.id} field="gravidade" value={r.gravidade} opts={GRAV_OPTS} onSave={handleCell}/>
                    }
                  </td>
                  <td className="col-drdata"><Cell rowId={r.id} field="data_resposta_cross" value={r.data_resposta_cross} type="date" onSave={handleCell}/></td>
                  <td className="col-drhora"><Cell rowId={r.id} field="horario_resposta_cross" value={r.horario_resposta_cross} type="time" onSave={handleCell}/></td>
                  <td className="col-dest"><Cell rowId={r.id} field="instituicao_destino" value={r.instituicao_destino} onSave={handleCell}/></td>
                  <td className="col-amb">
                    {r.tipo_ambulancia
                      ?<div style={{padding:"0 6px"}}><span className={`abg ${r.tipo_ambulancia==="AVANÇADA"?"aba":"abb"}`}>{r.tipo_ambulancia}</span></div>
                      :<Cell rowId={r.id} field="tipo_ambulancia" value={r.tipo_ambulancia} opts={AMBU_OPTS} onSave={handleCell}/>
                    }
                  </td>
                  <td className="col-bdata"><Cell rowId={r.id} field="data_saida_ambulancia" value={r.data_saida_ambulancia} type="date" onSave={handleCell}/></td>
                  <td className="col-saida"><Cell rowId={r.id} field="horario_saida_ambulancia" value={r.horario_saida_ambulancia} type="time" onSave={handleCell}/></td>
                  <td className="col-esp2">
                    <div style={{padding:"0 6px",fontSize:10,color:r.tempo_espera?"#7C3AED":"#CBD5E1",fontWeight:r.tempo_espera?600:400}}>
                      {r.tempo_espera||calcTempo(r.horario_solicitacao,r.horario_saida_ambulancia)||"—"}
                    </div>
                  </td>
                  <td className="col-obs"><Cell rowId={r.id} field="observacao" value={r.observacao} onSave={handleCell}/></td>
                  <td className="col-enf"><Cell rowId={r.id} field="enfermeiro" value={r.enfermeiro} onSave={handleCell}/></td>
                  <td className="col-tec"><Cell rowId={r.id} field="tecnico_auxiliar" value={r.tecnico_auxiliar} onSave={handleCell}/></td>
                  <td className="col-med"><Cell rowId={r.id} field="medico" value={r.medico} onSave={handleCell}/></td>
                  <td className="col-ret"><Cell rowId={r.id} field="horario_retorno" value={r.horario_retorno} type="time" onSave={handleCell}/></td>
                  <td>
                    <div className="ra">
                      <button className="ab4" title="Excluir" onClick={()=>handleDelete(r.id)}><Ico n="trash" s={11}/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {showAceite&&<AceiteModal onClose={()=>setShowAceite(false)} onImport={handleImport}/>}
      {modal!==null&&<FormModal row={modal} onClose={()=>setModal(null)} onSave={handleSave} saving={saving}/>}

      <div className="tst">
        {ts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==="ok"?"✓":"✕"}</span><span>{t.msg}</span></div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
