    const id=Date.now();
    setTs(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),4000);
  },[]);
  return {ts,push};
}

function Cell({rowId,field,value,tipo,optsKey,onSave}){
  const [ed,setEd]=useState(false);
  const [val,setVal]=useState(value||"");
  const ref=useRef();
  const OPTS_MAP={S_OPTS,G_OPTS,ST_OPTS,P_OPTS,A_OPTS};
  const opts=optsKey?OPTS_MAP[optsKey]:null;
  useEffect(()=>{setVal(value||"");},[value]);
  useEffect(()=>{if(ed&&ref.current)ref.current.focus();},[ed]);
  function commit(){setEd(false);if(val!==(value||""))onSave(rowId,field,val);}
  if(!ed) return(
    <div className={`cv ${!val?"emp":""}`} onClick={()=>setEd(true)} title={val||"Clique para editar"}>{val||"—"}</div>
  );
  if(opts) return(
    <select ref={ref} className="csel" value={val} onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>e.key==="Escape"&&(setEd(false),setVal(value||""))}>
      <option value="">— selecione —</option>
      {opts.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
  return(
    <input ref={ref} className="cinp" type={tipo||"text"} value={val}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEd(false);setVal(value||"");}}}/>
  );
}

function AceiteModal({onClose,onImport}){

  function toggle(id){setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});}

                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:12,color:"#0F172A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>

            onClick={()=>{onImport(cards.filter(c=>sel.has(c.id)));onClose();}}>
            Importar {sel.size>0?`${sel.size} card${sel.size>1?"s":""}`:""}</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [modal,setModal]=useState(null);
  const [showAceite,setShowAceite]=useState(false);
  const [search,setSearch]=useState("");
  const [fG,setFG]=useState("");
  const [fS,setFS]=useState("");
  const [fM,setFM]=useState("");
  const [sc,setSc]=useState("created_at");
  const [sd,setSd]=useState("desc");
  const {ts,push}=useToast();

  const load=useCallback(async()=>{
    setLoading(true);
    try{const d=await get("remocoes?select=*&order=created_at.desc");setRows(Array.isArray(d)?d:[]);}
    catch(e){push("Erro: "+e.message,"err");}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[]);

  const handleSave=async(form)=>{
    setSaving(true);
    try{
      const p={...form};
      if(p.horario_solicitacao&&p.horario_saida_ambulancia&&!p.tempo_espera)
        p.tempo_espera=calcTempo(p.horario_solicitacao,p.horario_saida_ambulancia);
      Object.keys(p).forEach(k=>{if(p[k]==="")p[k]=null;});
      if(form.id){await api({action:"update",id:form.id,...p});push("Atualizado");}
      else{await api({action:"create",...p});push("Criado!");}
      setModal(null);await load();
    }catch(e){push(e.message||"Erro","err");}
    finally{setSaving(false);}
  };

  const handleCell=async(rowId,field,value)=>{
    try{
      const u={action:"update",id:rowId,[field]:value||null};
      const row=rows.find(r=>r.id===rowId);
      if(row&&(field==="horario_saida_ambulancia"||field==="horario_solicitacao")){
        const te=calcTempo(field==="horario_solicitacao"?value:row.horario_solicitacao,field==="horario_saida_ambulancia"?value:row.horario_saida_ambulancia);
        if(te)u.tempo_espera=te;
      }
      await api(u);
      setRows(r=>r.map(x=>x.id===rowId?{...x,[field]:value,...(u.tempo_espera?{tempo_espera:u.tempo_espera}:{})}:x));
    }catch(e){push(e.message,"err");}
  };

  const handleDelete=async(id)=>{
    if(!confirm("Excluir este registro permanentemente?"))return;
    try{await api({action:"delete",id});push("Excluído");setRows(r=>r.filter(x=>x.id!==id));}
    catch(e){push(e.message||"Erro ao excluir","err");}
  };

  const handleImport=async(cards)=>{
    let ok=0,fail=0;
    for(const c of cards){
      try{
        const hoje=new Date().toISOString().split("T")[0];
        const agora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        await api({action:"create",nome_paciente:c.nome||"",setor:c.setor||"",especialidade:c.rec||"",diagnostico:c.hd||"",instituicao_destino:c.hosp||"",tipo_ambulancia:AM[c.amb]||"",gravidade:GC[c.grav]||"AMARELO",data_solicitacao:hoje,horario_solicitacao:agora,status:"PACIENTE AGUARDANDO AMBULÂNCIA",horario_saida_ambulancia:c.saida||"",horario_retorno:c.retorno||""});
        ok++;
      }catch{fail++;}
    }
    push(`${ok} importado${ok!==1?"s":""}${fail>0?` (${fail} erro${fail!==1?"s":""})`:""}`,fail>0?"err":"ok");
    await load();
  };

  function toggleSort(col){if(sc===col)setSd(d=>d==="asc"?"desc":"asc");else{setSc(col);setSd("asc");}}

  const filtered=useMemo(()=>{
    let d=rows;
    if(search){const s=search.toLowerCase();d=d.filter(r=>(r.nome_paciente||"").toLowerCase().includes(s)||(r.ficha_cross||"").toLowerCase().includes(s)||(r.diagnostico||"").toLowerCase().includes(s)||(r.instituicao_destino||"").toLowerCase().includes(s));}
    if(fG)d=d.filter(r=>r.gravidade===fG);
    if(fS)d=d.filter(r=>(r.status||"").includes(fS));
    if(fM)d=d.filter(r=>(r.data_solicitacao||"").startsWith(fM));
    return [...d].sort((a,b)=>{
      const av=(a[sc]||"").toString().toLowerCase();
      const bv=(b[sc]||"").toString().toLowerCase();
      return sd==="asc"?av.localeCompare(bv,"pt"):bv.localeCompare(av,"pt");
    });
  },[rows,search,fG,fS,fM,sc,sd]);

  const stats=useMemo(()=>{
    const total=filtered.length;
    const conc=filtered.filter(r=>["FICHA FINALIZADA","FICHA FINALIZADA VIA CROSS","FICHA FINALIZADA PELA CROSS","REMOÇÃO CONCLUÍDA","CONCLUIDO"].includes(r.status)).length;
    const nao=filtered.filter(r=>(r.status||"").includes("NÃO REALIZADA")).length;
    const verm=filtered.filter(r=>r.gravidade==="VERMELHO").length;
    const tempos=filtered.filter(r=>r.tempo_espera).map(r=>{const[h,m]=r.tempo_espera.split(":").map(Number);return h*60+m;}).filter(n=>!isNaN(n));
    const med=tempos.length?Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length):0;
    const medStr=tempos.length?`${String(Math.floor(med/60)).padStart(2,"0")}:${String(med%60).padStart(2,"0")}`:"—";
    return {total,conc,nao,verm,medStr,comTempos:tempos.length};
  },[filtered]);

  function exportXLS(){
    if(!window.XLSX){push("XLSX não carregado","err");return;}
    try{
      const hdr=["#",...COLS.map(([,planilha_label])=>planilha_label)];
      const data=filtered.map((r,i)=>[i+1,...COLS.map(([f,,,,,,,, tipo])=>{
        const v=r[f]||"";
        if(f==="data_solicitacao"&&v){try{return new Date(v+"T12:00:00").toLocaleDateString("pt-BR");}catch{return v;}}
        return v;
      })]);
      const ws=window.XLSX.utils.aoa_to_sheet([hdr,...data]);
      const colWidths={"data_solicitacao":12,"horario_solicitacao":8,"ficha_cross":18,"nome_paciente":26,"setor":18,"procedimento":14,"especialidade":18,"diagnostico":24,"status":28,"gravidade":10,"data_resposta_cross":12,"horario_resposta_cross":8,"instituicao_destino":20,"tipo_ambulancia":12,"data_saida_ambulancia":12,"horario_saida_ambulancia":8,"tempo_espera":10,"observacao":28,"enfermeiro":16,"tecnico_auxiliar":16,"medico":16,"horario_retorno":8};
      ws["!cols"]=[{wch:4},...COLS.map(([f])=>({wch:colWidths[f]||14}))];
      const wb=window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb,"Remoções",ws);
      window.XLSX.writeFile(wb,`remocoes_${new Date().toISOString().slice(0,10)}.xlsx`);
      push("Excel exportado!");
    }catch(e){push("Erro: "+e.message,"err");}
  }

  return(
    <div className="app">
      <div className="topbar">
        <div className="ti">
          <div className="tb">
            <div className="tico"><span>+</span></div>
            <div><div className="tn">Gerência de Enfermagem</div><div className="ts">Controle de Remoções</div></div>
          </div>
          <a href="." style={{padding:"5px 10px",border:"1px solid #334155",borderRadius:6,background:"none",color:"#94A3B8",fontSize:11,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5}}>← Kanban</a>
        </div>
      </div>

      <div className="toolbar">
        <div className="tbi">
          <div className="sw"><Ico n="search" s={13}/><input className="si" placeholder="Buscar nome, ficha…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <select className="fsel" value={fG} onChange={e=>setFG(e.target.value)}>
            <option value="">Gravidade</option>{G_OPTS.map(o=><option key={o}>{o}</option>)}
          </select>
          <select className="fsel" value={fS} onChange={e=>setFS(e.target.value)}>
            <option value="">Status</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="NÃO REALIZADA">Não realizada</option>
            <option value="REMOÇÃO">Em remoção</option>
            <option value="AGUARDANDO">Aguardando</option>
            <option value="ENCERRADA">Encerrada</option>
          </select>
          <input type="month" className="fsel" value={fM} onChange={e=>setFM(e.target.value)} style={{width:"auto"}}/>
          {(search||fG||fS||fM)&&<button className="btn btn-g btn-sm" onClick={()=>{setSearch("");setFG("");setFS("");setFM("");}}>✕</button>}
          <div style={{marginLeft:"auto",display:"flex",gap:6,flexShrink:0}}>
            <button className="btn btn-green" onClick={exportXLS}><Ico n="excel"/> Excel</button>
            <button className="btn btn-blue" onClick={()=>setShowAceite(true)}><Ico n="import"/> Aceite</button>
            <button className="btn btn-p" onClick={()=>setModal({})}><Ico n="plus"/> Novo</button>
          </div>
        </div>
      </div>

      <div className="stats">
        <div className="chip"><span className="cl">Total</span><span className="cv">{stats.total}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#16A34A"}}/><span className="cl">Concluídas</span><span className="cv" style={{color:"#16A34A"}}>{stats.conc}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Não realizadas</span><span className="cv" style={{color:"#EF4444"}}>{stats.nao}</span></div>
        <div className="csep"/>
        <div className="chip"><div className="cdot" style={{background:"#EF4444"}}/><span className="cl">Emergências</span><span className="cv" style={{color:"#EF4444"}}>{stats.verm}</span></div>
        <div className="csep"/>
        <div className="chip"><span className="cl">⏱ Média espera</span><span className="cv" style={{color:"#7C3AED"}}>{stats.medStr}</span><span className="cl" style={{marginLeft:4}}>({stats.comTempos} reg.)</span></div>
      </div>

      <div className="tw">
        {loading?(<div className="empty" style={{marginTop:60}}><Ico n="pulse" s={24}/><p>Carregando…</p></div>)
        :filtered.length===0?(<div className="empty" style={{marginTop:60}}><p>{rows.length===0?"Nenhum registro. Clique em «Novo» para começar.":"Nenhum resultado."}</p></div>)
        :(
          <table className="rt">
            <thead><tr>
              <th style={{width:32,cursor:"default"}}>#</th>
              {COLS.map(([f,planilha_label,xls_label,kanban,,,tip,w])=>(
                <th key={f} style={{width:w||100}} className={`th-wrap${sc===f?" sorted":""}`} onClick={()=>toggleSort(f)}>
                  <div className="th-inner" style={{whiteSpace:"normal",lineHeight:1.3,minHeight:30,alignItems:"flex-start",paddingTop:2}}>
                    <span>{xls_label}</span>
                    <span className={`sarr${sc===f?" on":""}`}>{sc===f?(sd==="asc"?"▲":"▼"):"⇅"}</span>
                  </div>
                  <div className="tipbox">
                    <strong>Planilha:</strong> {planilha_label}<br/>
                    <strong>Kanban:</strong> {kanban||"—"}<br/>
                    {tip}
                  </div>
                </th>
              ))}
              <th style={{width:32,cursor:"default"}}></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>(
                <tr key={r.id}>
                  <td>{i+1}</td>
                  <td style={{width:80}}><div style={{padding:"0 6px",fontSize:10,whiteSpace:"nowrap"}}>{fmtD(r.data_solicitacao)||"—"}</div></td>
                  <td style={{width:58}}><Cell rowId={r.id} field="horario_solicitacao" value={r.horario_solicitacao} tipo="time" onSave={handleCell}/></td>
                  <td style={{width:120}}><Cell rowId={r.id} field="ficha_cross" value={r.ficha_cross} onSave={handleCell}/></td>
                  <td style={{width:170}}><Cell rowId={r.id} field="nome_paciente" value={r.nome_paciente} onSave={handleCell}/></td>
                  <td style={{width:110}}><Cell rowId={r.id} field="setor" value={r.setor} tipo="sel" optsKey="ST_OPTS" onSave={handleCell}/></td>
                  <td style={{width:100}}><Cell rowId={r.id} field="procedimento" value={r.procedimento} tipo="sel" optsKey="P_OPTS" onSave={handleCell}/></td>
                  <td style={{width:130}}><Cell rowId={r.id} field="especialidade" value={r.especialidade} onSave={handleCell}/></td>
                  <td style={{width:160}}><Cell rowId={r.id} field="diagnostico" value={r.diagnostico} onSave={handleCell}/></td>
                  <td style={{width:150}}>
                    {r.status
                      ?<div style={{padding:"0 6px"}}><span className={`sb ${S_CLS[r.status]||"se"}`} title={r.status}>{r.status.length>20?r.status.slice(0,20)+"…":r.status}</span></div>
                      :<Cell rowId={r.id} field="status" value={r.status} tipo="sel" optsKey="S_OPTS" onSave={handleCell}/>
                    }
                  </td>
                  <td style={{width:80}}>
                    {r.gravidade
                      ?<div style={{padding:"0 6px"}}><span className={`gb ${G_CLS[r.gravidade]||"gc"}`}><span className="gd" style={{background:G_DOT[r.gravidade]}}/>{r.gravidade}</span></div>
                      :<Cell rowId={r.id} field="gravidade" value={r.gravidade} tipo="sel" optsKey="G_OPTS" onSave={handleCell}/>
                    }
                  </td>
                  <td style={{width:80}}><Cell rowId={r.id} field="data_resposta_cross" value={r.data_resposta_cross} tipo="date" onSave={handleCell}/></td>
                  <td style={{width:60}}><Cell rowId={r.id} field="horario_resposta_cross" value={r.horario_resposta_cross} tipo="time" onSave={handleCell}/></td>
                  <td style={{width:130}}><Cell rowId={r.id} field="instituicao_destino" value={r.instituicao_destino} onSave={handleCell}/></td>
                  <td style={{width:90}}>
                    {r.tipo_ambulancia
                      ?<div style={{padding:"0 6px"}}><span className={`ab ${r.tipo_ambulancia==="AVANÇADA"?"aba":"abb"}`}>{r.tipo_ambulancia}</span></div>
                      :<Cell rowId={r.id} field="tipo_ambulancia" value={r.tipo_ambulancia} tipo="sel" optsKey="A_OPTS" onSave={handleCell}/>
                    }
                  </td>
                  <td style={{width:80}}><Cell rowId={r.id} field="data_saida_ambulancia" value={r.data_saida_ambulancia} tipo="date" onSave={handleCell}/></td>
                  <td style={{width:60}}><Cell rowId={r.id} field="horario_saida_ambulancia" value={r.horario_saida_ambulancia} tipo="time" onSave={handleCell}/></td>
                  <td style={{width:64}}>
                    <div style={{padding:"0 6px",fontSize:10,color:r.tempo_espera?"#7C3AED":"#CBD5E1",fontWeight:r.tempo_espera?700:400}}>
                      {r.tempo_espera||calcTempo(r.horario_solicitacao,r.horario_saida_ambulancia)||"—"}
                    </div>
                  </td>
                  <td style={{width:180}}><Cell rowId={r.id} field="observacao" value={r.observacao} onSave={handleCell}/></td>
                  <td style={{width:110}}><Cell rowId={r.id} field="enfermeiro" value={r.enfermeiro} onSave={handleCell}/></td>
                  <td style={{width:110}}><Cell rowId={r.id} field="tecnico_auxiliar" value={r.tecnico_auxiliar} onSave={handleCell}/></td>
                  <td style={{width:110}}><Cell rowId={r.id} field="medico" value={r.medico} onSave={handleCell}/></td>
                  <td style={{width:60}}><Cell rowId={r.id} field="horario_retorno" value={r.horario_retorno} tipo="time" onSave={handleCell}/></td>
                  <td style={{width:32}}><button className="delbtn" title="Excluir" onClick={()=>handleDelete(r.id)}><Ico n="trash" s={11}/></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {showAceite&&<AceiteModal onClose={()=>setShowAceite(false)} onImport={handleImport}/>}
      {modal!==null&&<FormModal row={modal} onClose={()=>setModal(null)} onSave={handleSave} saving={saving}/>}
      <div className="tst">
        {ts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==="ok"?"✓":"✕"}</span><span>{t.msg}</span></div>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
