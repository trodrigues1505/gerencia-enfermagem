function buildText(cards, cols, settings) {
  const appLink = settings?.app_url ? `\n\n━━━━━━━━━━━━━━━━━━━━\n🌐 *Acesse o sistema:*\n${settings.app_url}` : "";

  cols.forEach(col => {
    const colCards = cards.filter(c => c.col_id === col.id);
    if (!colCards.length) return;
    lines.push("");
    lines.push(`${col.emoji || "📌"} *${col.label.toUpperCase()}*`);
    lines.push(`👥 ${colCards.length} paciente${colCards.length !== 1 ? "s" : ""}`);
    lines.push(`━━━━━━━━━━━━━━━━━━━━`);
    colCards.forEach((c, i) => {
      lines.push("");

      // Prioridade (nível 3 — antes do paciente)
      if (c.pr) {
        const prEmoji = PR_EMOJI[c.pr] || "⚪";
        lines.push(`${prEmoji} *PRIORIDADE ${String(c.pr).padStart(2, "0")}*`);
      }

      // Paciente
      const pacEmoji = c.is_rn ? "👶" : "👤";
      lines.push(`${pacEmoji} *${c.nome}*${c.idade ? ` — ${c.idade}` : ""}`);

      // Diagnóstico
      if (c.hd) lines.push(`🩺 HD: ${c.hd}`);

      // Localização
      if (c.setor) lines.push(`📍 ${c.setor}`);

      // Especialidade + Destino + Ambulância
      const hasHosp = !!c.hosp;
      const hasRec = !!c.rec;
      const ambTxt = c.amb ? c.amb.includes("Av") ? "Amb. Avançada" : "Amb. Básica" : "";
      if (hasRec && hasHosp) {
        lines.push(`➡️ ${c.rec} → ${c.hosp}`);
        if (ambTxt) lines.push(`🏥 ${ambTxt}`);
      } else if (hasRec) {
        lines.push(`🏥 ${c.rec}${ambTxt ? " | " + ambTxt : ""}`);
      } else if (ambTxt) {
        lines.push(`🏥 ${ambTxt}`);
      }

      // CROSS
      if (c.cross_info) lines.push(`🔄 Cross: ${c.cross_info}`);

      // Status final
      if (c.status) {
        const stEmoji = STATUS_EMOJI[c.status] || "▸";
        lines.push(`${stEmoji} *${c.status}*`);
      }
    });
    lines.push("");
  });

  // Resumo geral (Regra 58)
  lines.push("━━━━━━━━━━━━━━━━━━━━");
  lines.push(`📊 *RESUMO GERAL*`);

  lines.push(`👥 Total: *${cards.length} pacientes*`);
  cols.forEach(col => {
    const n = cards.filter(c => c.col_id === col.id).length;
    if (n > 0) lines.push(`${col.emoji || "📌"} ${col.label}: ${n}`);
  });
  lines.push(appLink);
  return lines.join("\n");
}
