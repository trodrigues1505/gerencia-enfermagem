<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const SB_URL = "https://ahcrscstdtfawoogsugi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY3JzY3N0ZHRmYXdvb2dzdWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mjk1MDgsImV4cCI6MjEwNDIwNTUwOH0.8ivWRA99AXXyBVFT3TQd5NuSod2eiowiI490Blt2zHM";
const FN = `${SB_URL}/functions/v1/remocoes-write`;
// H e um objeto mutavel de proposito: e passado por referencia como `headers`
// em varios fetch, entao trocar Authorization aqui vale para todos. Com RLS
// ligada, requisicao sem token de sessao nao le nada.
const H = {"Content-Type":"application/json",apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`};

// Permissao de edicao da planilha: admin ou can_planilha. Comeca fechada e so abre
// depois que o perfil do usuario for lido (aplicarSessao). A barreira de verdade
// e a Edge Function remocoes-write; isto evita oferecer o que o servidor recusa.
let PODE_EDITAR = false;

// A sessao e a mesma do index.html (supabase-js persiste por origem), entao
// quem ja entrou no Kanban chega aqui autenticado. Sem sessao, volta ao login.
let _sbAuth = null;
async function sbAuthClient(){
  if(_sbAuth) return _sbAuth;
  if(!window.supabase){
    await new Promise((res,rej)=>{
      const el=document.createElement("script");
      el.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
      el.onload=res; el.onerror=rej; document.head.appendChild(el);
    });
  }
  _sbAuth = window.supabase.createClient(SB_URL, SB_KEY);
  return _sbAuth;
}
async function aplicarSessao(){
  const sb = await sbAuthClient();
  const { data } = await sb.auth.getSession();
  if(!data.session){ window.location.href = "index.html"; return null; }
  H.Authorization = `Bearer ${data.session.access_token}`;
  try{
    const pr = await fetch(`${SB_URL}/rest/v1/users?auth_uid=eq.${data.session.user.id}&select=role,status,can_planilha&limit=1`,{headers:H});
    const rows = await pr.json();
    const u = Array.isArray(rows) ? rows[0] : null;
    PODE_EDITAR = !!u && u.status==="aprovado" && (u.role==="admin" || u.can_planilha===true);
  }catch(e){ PODE_EDITAR = false; }
  sb.auth.onAuthStateChange((_e,sess)=>{
    H.Authorization = `Bearer ${sess?.access_token || SB_KEY}`;
    if(!sess) window.location.href = "index.html";
  });
  return data.session;
}

async function api(body) {
  if(!PODE_EDITAR) throw new Error("Seu acesso à planilha é somente para visualização.");
  const r = await fetch(FN,{method:"POST",headers:H,body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok) throw new Error(d.error||"Erro");
  return d;
}

// Para campos booleanos, usa PATCH direto na REST API do Supabase
// A Edge Function pode filtrar/transformar valores boolean — REST API não tem essa limitação
async function dbGet(path) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`,{headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Carga da planilha por período ────────────────────────────────────────────
// O Supabase devolve no máximo 1.000 linhas por consulta (Settings → API → Max rows) e corta o resto SEM avisar.
// Por isso a planilha faz duas coisas: (1) pede ao servidor só o período escolhido; (2) dentro do período, lê em
// páginas de 1.000 até acabar, então nenhuma linha some mesmo que o período tenha mais do que isso.
const PAGINA = 1000;
// Período em que a planilha abre. Valores: "30d" | "mes_atual" | "mes_ant" | "90d" | "mes" | "tudo"
const PERIODO_PADRAO = "30d";
// Datas em horário LOCAL (toISOString é UTC e, depois das 21h em Brasília, devolve o dia seguinte)
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function faixaPeriodo(periodo, mesSel){
  const h = new Date();
  const mesCompleto = (ano, mes0) => ({ ini: isoLocal(new Date(ano, mes0, 1)), fim: isoLocal(new Date(ano, mes0+1, 0)) });
  const nomeMes = (ano, mes0) => {
    const t = new Date(ano, mes0, 1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    return t.charAt(0).toUpperCase()+t.slice(1);
  };
  if(periodo==="tudo") return { ini:null, fim:null, rotulo:"Tudo" };
  if(periodo==="30d") return { ini:isoLocal(new Date(h.getFullYear(),h.getMonth(),h.getDate()-29)), fim:null, rotulo:"Últimos 30 dias" };
  if(periodo==="90d") return { ini:isoLocal(new Date(h.getFullYear(),h.getMonth(),h.getDate()-89)), fim:null, rotulo:"Últimos 90 dias" };
  if(periodo==="mes_ant"){
    const a = new Date(h.getFullYear(), h.getMonth()-1, 1);
    return { ...mesCompleto(a.getFullYear(), a.getMonth()), rotulo:nomeMes(a.getFullYear(), a.getMonth()) };
  }
  if(periodo==="mes"){
    const m = String(mesSel||"").match(/^(\d{4})-(\d{2})$/);
    if(m){ const ano=+m[1], mes0=+m[2]-1; return { ...mesCompleto(ano, mes0), rotulo:nomeMes(ano, mes0) }; }
  }
  // "mes_atual" e qualquer valor desconhecido caem aqui
  return { ...mesCompleto(h.getFullYear(), h.getMonth()), rotulo:nomeMes(h.getFullYear(), h.getMonth()) };
}
// Caminho da consulta. Linhas SEM data de solicitação entram sempre: sem isto sumiriam de qualquer período
// e ninguém conseguiria encontrá-las para corrigir. A ordem tem desempate por id para as páginas não repetirem linha.
function pathRemocoes(faixa){
  let p = "remocoes?select=*&order=created_at.desc,id.asc";
  if(faixa.ini || faixa.fim){
    const cond = [];
    if(faixa.ini) cond.push(`data_solicitacao.gte.${faixa.ini}`);
    if(faixa.fim) cond.push(`data_solicitacao.lte.${faixa.fim}`);
    const dentro = cond.length>1 ? `and(${cond.join(",")})` : cond[0];
    p += `&or=(${dentro},data_solicitacao.is.null)`;
  }
  return p;
}
// Lê todas as páginas. Avança pelo que o servidor realmente devolveu (não por PAGINA), então funciona
// mesmo que o "Max rows" do projeto seja menor que 1.000. Para quando o total (Content-Range) é atingido
// ou quando uma página vem vazia.
async function dbGetTodas(path){
  const out = [];
  let off = 0, total = null;
  while(true){
    const r = await fetch(`${SB_URL}/rest/v1/${path}${path.includes("?")?"&":"?"}limit=${PAGINA}&offset=${off}`,{headers:{...H,Prefer:"count=exact"}});
    if(!r.ok) throw new Error(await r.text());
    const page = await r.json();
    const cr = r.headers.get("Content-Range");            // ex.: "0-232/233"
    const m = cr && cr.match(/\/(\d+)$/);
    if(m) total = Number(m[1]);
    if(!Array.isArray(page) || page.length===0) break;
    out.push(...page);
    off += page.length;
    if(total!==null && off>=total) break;
    if(off>200000) break;                                  // trava de segurança
  }
  return out;
}

// ─── Saída e retorno da ambulância: a DATA é sempre uma escolha confirmada por uma pessoa ───────────────────────────────
// A planilha não grava mais um horário de saída (ou de retorno) sem o dia em que aconteceu, e não sugere nada por conta própria:
// a sugestão só aparece numa pergunta, e o que vale é a resposta de quem digitou. Mesma ideia do Livro de Saída.
function tsLocal(d, hh) {
  const di = String(d || "").slice(0, 10), m = String(hh || "").trim().match(/^(\d{1,2}):(\d{2})/);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(di) || !m) return null;
  const t = new Date(`${di}T${m[1].padStart(2, "0")}:${m[2]}:00`);
  return isNaN(t) ? null : t.getTime();
}
/* "31/02/2026" tem formato de data mas não existe no calendário: aqui só vale dia que existe (normalizeDateValue, que as importações usam,
 * confere apenas o formato). Devolve AAAA-MM-DD ou null. */
function dataRealIso(texto) {
  const m = String(texto || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if (!m) return null;
  const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]), mo = Number(m[2]), d = Number(m[1]);
  const t = new Date(y, mo - 1, d);
  if (t.getFullYear() !== y || t.getMonth() !== mo - 1 || t.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function somaDiaIso(iso, n) {
  const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
/* Dia SUGERIDO (só para perguntar) a um horário digitado sem data: o mesmo dia do momento anterior, ou o seguinte se o horário
 * for menor que o do momento anterior (passou da meia-noite). Sem o dia do momento anterior, não há o que sugerir (null). */
function sugerirDiaDoHorario(diaAnterior, horaAnterior, hora) {
  const di = String(diaAnterior || "").slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(di)) return null;
  const a = String(horaAnterior || "").trim().match(/^(\d{1,2}):(\d{2})/), b = String(hora || "").trim().match(/^(\d{1,2}):(\d{2})/);
  return (a && b && Number(b[1]) * 60 + Number(b[2]) < Number(a[1]) * 60 + Number(a[2])) ? somaDiaIso(di, 1) : di;
}
/* Ordem dos momentos da ambulância (as mesmas regras do Livro): a saída não pode ser antes do pedido da ambulância, nem o
 * retorno antes da saída. Só olha pares completos (data + horário). Devolve a mensagem do 1º problema ou null. */
function checarOrdemAmbulancia(m) {
  const fmt = (d, hh) => `${fmtD(d)} ${String(hh).trim().slice(0, 5)}`;
  const ped = tsLocal(m.data_saida_ambulancia, m.hora_solic_ambulancia), sai = tsLocal(m.data_saida_real, m.horario_saida_ambulancia), ret = tsLocal(m.data_retorno, m.horario_retorno);
  if (ped !== null && sai !== null && sai < ped) return `A saída (${fmt(m.data_saida_real, m.horario_saida_ambulancia)}) está antes da solicitação da ambulância (${fmt(m.data_saida_ambulancia, m.hora_solic_ambulancia)}). Confira as datas e os horários.`;
  if (sai !== null && ret !== null && ret < sai) return `O retorno (${fmt(m.data_retorno, m.horario_retorno)}) está antes da saída (${fmt(m.data_saida_real, m.horario_saida_ambulancia)}). Confira as datas e os horários.`;
  return null;
}
function hojeLocalIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
/* Solicitação na CROSS: o dia tem de existir no calendário real (a partir de 01/01/2020, e não pode ser futuro), e a solicitação não pode
 * ser DEPOIS da finalização da CROSS. Devolve a mensagem do problema ou null. */
function checarSolicitacao(m) {
  const d = String(m.data_solicitacao || "").slice(0, 10);
  if (d && (d < "2020-01-01" || d > hojeLocalIso())) return `Data da solicitação impossível (${fmtD(d)}): use um dia entre 01/01/2020 e hoje.`;
  const sol = tsLocal(m.data_solicitacao, m.horario_solicitacao), fin = tsLocal(m.data_resposta_cross, m.horario_resposta_cross);
  if (sol !== null && fin !== null && sol > fin)
    return `A solicitação (${fmtD(m.data_solicitacao)} ${String(m.horario_solicitacao).trim().slice(0, 5)}) está depois da finalização da CROSS (${fmtD(m.data_resposta_cross)} ${String(m.horario_resposta_cross).trim().slice(0, 5)}). Confira as datas e os horários.`;
  return null;
}
const CAMPOS_AMBULANCIA = ["data_saida_ambulancia", "hora_solic_ambulancia", "data_saida_real", "horario_saida_ambulancia", "data_retorno", "horario_retorno"];
/* Validação do formulário da linha. Só cobra o que a pessoa MUDOU (linha antiga com problema não trava a edição de outro campo). */
function validarFormularioAmbulancia(form, original) {
  const mudou = k => !original || String(form[k] || "") !== String(original[k] || "");
  if (["data_solicitacao", "horario_solicitacao"].some(mudou)) { const a = checarSolicitacao(form); if (a) return a; }
  if (form.horario_saida_ambulancia && !form.data_saida_real && mudou("horario_saida_ambulancia")) {
    const s = sugerirDiaDoHorario(form.data_saida_ambulancia, form.hora_solic_ambulancia, form.horario_saida_ambulancia);
    return "Preencha a DATA SAÍDA AMB.: o horário de saída precisa do dia em que a ambulância saiu." + (s ? ` (Pelo pedido da ambulância, deve ser ${fmtD(s)}${s !== String(form.data_saida_ambulancia).slice(0, 10) ? ", pois o horário passou da meia-noite" : ""}; confirme e digite.)` : "");
  }
  if (form.horario_retorno && !form.data_retorno && mudou("horario_retorno")) {
    const s = sugerirDiaDoHorario(form.data_saida_real, form.horario_saida_ambulancia, form.horario_retorno);
    return "Preencha a DATA RETORNO: o horário de retorno precisa do dia em que a ambulância voltou." + (s ? ` (Pela saída, deve ser ${fmtD(s)}${s !== String(form.data_saida_real).slice(0, 10) ? ", pois o horário passou da meia-noite" : ""}; confirme e digite.)` : "");
  }
  if (CAMPOS_AMBULANCIA.some(mudou)) return checarOrdemAmbulancia(form);
  return null;
}

// Diferença entre dois momentos (data + hora) em HH:MM. SEM suposição: precisa das DUAS datas e dos DOIS horários, e o fim não
// pode ser antes do início. Faltou algo, ou ficou fora de ordem: devolve "" (a célula fica vazia em vez de um valor inventado).
// A ambulância pode ser pedida num dia e sair no outro (pedido 10:00 dia 1, saída 12:00 dia 2 = 26:00, não 02:00).
// Mesma regra do Livro de Saída (livro.js, lsDiff).
function calcTempoD(dIni, hIni, dFim, hFim) {
  const di=String(dIni||"").slice(0,10), df=String(dFim||"").slice(0,10);
  const hi=String(hIni||"").trim().match(/^(\d{1,2}):(\d{2})/), hf=String(hFim||"").trim().match(/^(\d{1,2}):(\d{2})/);
  if(!hi||!hf||!/^\d{4}-\d{2}-\d{2}$/.test(di)||!/^\d{4}-\d{2}-\d{2}$/.test(df)) return "";
  const a=new Date(`${di}T${hi[1].padStart(2,"0")}:${hi[2]}:00`), b=new Date(`${df}T${hf[1].padStart(2,"0")}:${hf[2]}:00`);
  if(isNaN(a)||isNaN(b)) return "";
  const diff=Math.round((b-a)/60000);
  if(diff<0) return "";
  return `${String(Math.floor(diff/60)).padStart(2,"0")}:${String(diff%60).padStart(2,"0")}`;
}

// Tempos (espera, duração) ficam guardados como "HH:MM", mas são MOSTRADOS com a unidade escrita:
// "05:22" -> "5h 22min", "00:45" -> "45min", "02:00" -> "2h 00min". Valor que não é HH:MM aparece como está.
const fmtHM = v => {
  const m = String(v||"").trim().match(/^(\d+):(\d{2})(?::\d{2})?$/);
  if(!m) return v;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  return h>0 ? `${h}h ${String(mi).padStart(2,"0")}min` : `${mi}min`;
};
// Datas/horários de uma linha da planilha → tempos. Um só lugar, usado pelo formulário, pela edição na tabela e pelas células.
//  espera  = pedido da ambulância → saída   (data do pedido + data da saída, cada uma com o seu horário)
//  duração = saída → retorno da ambulância  (data da saída + data do retorno, cada uma com o seu horário)
// Falta data ou horário de um dos lados: fica vazio. Não se supõe "mesmo dia" nem "dia seguinte".
const tempoEsperaDe = r => calcTempoD(r.data_saida_ambulancia, r.hora_solic_ambulancia, r.data_saida_real, r.horario_saida_ambulancia);

// Saída e retorno exigem a data E o horário: o painel não deduz data nenhuma. Remoção cancelada ou resolvida no local

const FALTA_OPCOES = [

// Minutos entre a FINALIZAÇÃO da ficha na CROSS e o PEDIDO da ambulância. Mesma regra do banco
// (tempo-pedido-ambulancia.sql): negativo = pedido antes da finalização; null = falta dado ou hora fora do formato HH:MM.
function minFinalPedidoDe(r){
  const t=(d,h)=>{
    const dia=String(d||"").slice(0,10), m=String(h||"").match(/^\s*(\d{1,2}):(\d{2})/);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dia)||!m) return null;
    const hh=+m[1], mm=+m[2];
    if(hh>23||mm>59) return null;
    const [y,mo,da]=dia.split("-").map(Number);
    return Date.UTC(y,mo-1,da)/60000+hh*60+mm;   // minutos desde 1970 (UTC não tem horário de verão)
  };
  const a=t(r.data_resposta_cross,r.horario_resposta_cross), b=t(r.data_saida_ambulancia,r.hora_solic_ambulancia);
  return a===null||b===null?null:Math.round(b-a);

  const t=h>0?`${h}h ${String(m).padStart(2,"0")}min`:`${m}min`;

function useToast(){
  const [ts,setTs]=useState([]);
  const push=useCallback((msg,type="ok")=>{
    const id=Date.now();
    setTs(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),4000);
  },[]);
  return {ts,push};
}

// Navegacao por teclado entre celulas
function navigateCell(currentTd, direction){
  const td=currentTd.closest("td");
  if(!td)return;
  const tr=td.closest("tr");
  const tbody=tr.closest("tbody");
  const tds=[...tr.querySelectorAll("td")];
  const colIdx=tds.indexOf(td);
  const rows=[...tbody.querySelectorAll("tr")];
  const rowIdx=rows.indexOf(tr);
  let targetTd=null;
  if(direction==="right"){targetTd=tds[colIdx+1];}
  else if(direction==="left"){targetTd=tds[colIdx-1];}
  else if(direction==="down"){const nr=rows[rowIdx+1];if(nr){const ntds=[...nr.querySelectorAll("td")];targetTd=ntds[colIdx];}}
  else if(direction==="up"){const nr=rows[rowIdx-1];if(nr){const ntds=[...nr.querySelectorAll("td")];targetTd=ntds[colIdx];}}
  if(targetTd){
    // fecha a celula atual e abre a proxima
    const clickable=targetTd.querySelector("[data-nav]")||targetTd.querySelector("div[title='Clique para editar']");
    if(clickable)clickable.click();
    targetTd.scrollIntoView({block:"nearest",inline:"nearest"});
  }
}

// Célula editável — texto quebra na célula
function Cell({rowId,field,value,tipo,optsKey,onSave,fmtDisplay,colorStyle,sugestao,inferida}){
  const [ed,setEd]=useState(false);
  const [val,setVal]=useState(value||"");
  const [free,setFree]=useState(false);
  const ref=useRef();
  const wrapRef=useRef();
  const OPTS_MAP={S_OPTS,G_OPTS,ST_OPTS,P_OPTS,A_OPTS,M_OPTS};
  const opts=optsKey?OPTS_MAP[optsKey]:null;
  useEffect(()=>{setVal(value||"");},[value]);
  useEffect(()=>{if(ed&&ref.current)ref.current.focus();},[ed]);
  // Data "deduzida": abrir e sair do campo com a data certa já a CONFIRMA (a marca "≈" some)
  function commit(){setEd(false);setFree(false);if(val!==(value||"")||(inferida&&val))onSave(rowId,field,val);}
  function handleKeyNav(e){
    const el=wrapRef.current;
    if(e.key==="Tab"){e.preventDefault();commit();navigateCell(el,e.shiftKey?"left":"right");}
    else if(e.key==="ArrowDown"&&!e.shiftKey){e.preventDefault();commit();navigateCell(el,"down");}
    else if(e.key==="ArrowUp"&&!e.shiftKey){e.preventDefault();commit();navigateCell(el,"up");}
    else if(e.key==="ArrowRight"&&e.ctrlKey){e.preventDefault();commit();navigateCell(el,"right");}
    else if(e.key==="ArrowLeft"&&e.ctrlKey){e.preventDefault();commit();navigateCell(el,"left");}
  }
  // Readonly (calculado)
  if(tipo==="ro") return(
    <div style={{padding:"2px 6px",fontSize:10,color:value?"#7C3AED":"#CBD5E1",fontWeight:value?700:400,whiteSpace:"nowrap"}}>{value||"—"}</div>
  );
  if(!ed) return(
    <div ref={wrapRef} data-nav="1" style={{padding:"2px 6px",minHeight:24,display:"flex",alignItems:"center",cursor:"pointer",fontSize:11,
      wordBreak:"break-word",whiteSpace:"normal",lineHeight:1.3,
      color:colorStyle?.color||(inferida&&val?"#B45309":(val?"#374151":"#CBD5E1")),
      fontWeight:colorStyle?.fontWeight||(val?400:400),
      fontStyle:(val&&!inferida)?"normal":"italic",whiteSpace:"nowrap",
      ...(colorStyle||{})}}
      onMouseEnter={e=>{
        // Só quando o texto está cortado: o "title" passa a trazer o texto inteiro (senão fica só a dica de editar)
        const el=e.currentTarget, cheio=(fmtDisplay&&val?fmtDisplay(val):val)||"";
        const cortado=el.scrollWidth>el.clientWidth+1||(el.scrollWidth===0&&String(cheio).length>24);
        if(cortado&&cheio&&!inferida&&!colorStyle)el.title=cheio+"\n\n✎ Clique para editar";
      }}
      onClick={()=>setEd(true)} title={inferida&&val?"Data DEDUZIDA pelo horário (ninguém digitou). Clique para corrigir; ao sair do campo com a data certa, ela fica confirmada.":(colorStyle?"Clique para editar (calculado — limpe para recalcular automático)":"Clique para editar")}>
      {inferida&&val?"≈ ":""}{fmtDisplay&&val ? fmtDisplay(val) : (val||"—")}
    </div>
  );
  if(opts && !free) return(
    <div ref={wrapRef}>
    <select ref={ref} style={{width:"100%",height:"100%",minHeight:24,padding:"2px 4px",border:"none",
      borderLeft:"2px solid #3B82F6",background:"#EFF6FF",fontSize:10,color:"#0F172A",outline:"none",appearance:"none",cursor:"pointer"}}
      value={val} onChange={e=>{if(e.target.value==="__free__"){setFree(true);setVal("");}else setVal(e.target.value);}}
      onBlur={commit}
      onKeyDown={e=>{
        if(e.key==="Escape"){setEd(false);setVal(value||"");return;}
        if(e.key==="Enter"){commit();return;}
        handleKeyNav(e);
      }}>
      <option value="">—</option>
      {opts.map(o=>{
        const g=field==="gravidade"?gravInfo(o):null;
        return <option key={o} value={o}>{g?g.label:o}</option>;
      })}
      <option value="__free__">✏️ Digitar…</option>
    </select>
    </div>
  );
  return(
    <div ref={wrapRef}>
    <input ref={free?ref:null} style={{width:"100%",minHeight:24,padding:"2px 6px",border:"none",
      borderLeft:"2px solid #3B82F6",background:"#EFF6FF",fontSize:11,color:"#0F172A",outline:"none"}}
      type={tipo==="sel"?"text":tipo||"text"} value={val}
      list={sugestao?`dl-${field}`:undefined}
      placeholder={free?"Digite o valor...":""}
      onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>{
        if(e.key==="Enter"){commit();return;}
        if(e.key==="Escape"){setEd(false);setVal(value||"");setFree(false);return;}
        handleKeyNav(e);
      }}/>
    {sugestao&&<datalist id={`dl-${field}`}><option value={sugestao}/></datalist>}
    </div>
  );
}

function KanbanImportModal({onClose,onImport}){
  const [cols,setCols]=useState([]);

  const [load,setLoad]=useState(true);
  const [sel,setSel]=useState(new Set());
  const [filterCol,setFilterCol]=useState("all");
  const [q,setQ]=useState("");
  useEffect(()=>{
    Promise.all([
      dbGet("columns?select=*&order=col_order.asc").catch(()=>[]),
      dbGet("cards?select=*&order=created_at.asc").catch(()=>[]),
    ]).then(([c,cd])=>{
      setCols(Array.isArray(c)?c:[]);
      setCards(Array.isArray(cd)?cd:[]);
    }).finally(()=>setLoad(false));
  },[]);
  const colLabel=useMemo(()=>{
    const m={};
    cols.forEach(c=>{m[c.id]=c.label||c.id;});
    return m;
  },[cols]);
  const filtered=useMemo(()=>{
    let list=cards;
    if(filterCol!=="all") list=list.filter(c=>c.col_id===filterCol);
    if(q.trim()){
      const t=q.trim().toLowerCase();
      list=list.filter(c=>[c.nome,c.setor,c.hosp,c.ficha_cross].some(v=>(v||"").toLowerCase().includes(t)));
    }

  },[cards,filterCol,q]);
  const allSel=filtered.length>0&&filtered.every(c=>sel.has(c.id));
  function toggleAll(){
    setSel(s=>{
      const n=new Set(s);
      if(allSel) filtered.forEach(c=>n.delete(c.id));
      else filtered.forEach(c=>n.add(c.id));
      return n;
    });
  }
  function toggle(id){setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});}

    <div className="mbk">
      <div className="mdl" style={{maxWidth:560}}>

            <select className="fsel" value={filterCol} onChange={e=>setFilterCol(e.target.value)}>

              <input className="si" style={{width:160}} placeholder="Buscar paciente..." value={q} onChange={e=>setQ(e.target.value)}/>
            </div>
            {filtered.length>0&&
              <button className="btn btn-g btn-sm" onClick={toggleAll}>{allSel?"☐ Desmarcar todos":"☑ Selecionar todos"} ({filtered.length})</button>
            }
            <span style={{fontSize:11,color:"#64748B"}}>{sel.size} selecionado{sel.size!==1?"s":""}</span>

          {load&&<div className="empty"><Ico n="pulse" s={24}/><p>Carregando…</p></div>}
          {!load&&filtered.length===0&&<div className="empty"><p>Nenhum card encontrado.</p></div>}
          {filtered.map(c=>{
            const s=sel.has(c.id);
            const gi=gravInfo(c.grav||"urgencia");
            return(

// Normaliza texto p/ comparar cabeçalhos (sem acento, minúsculo, sem espaço extra)
function normHdr(s){
  // B2: remove pontuacao ANTES de colapsar espaco. Sem isto, cabecalhos reais
  // do CROSS ("Nº DA FICHA CROSS", "LOCALIZACAO/SETOR") nao casam com o mapa,
  // matched cai abaixo de 40% e o lote inteiro entra deslocado.
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u00a0\u200b-\u200d\ufeff]/g," ")
    .replace(/[.\-_/\\,;:\u00ba\u00b0\u00aa'"()\[\]]/g," ")
    .toLowerCase().replace(/\s+/g," ").trim();
}

// Mapa reverso label -> chave interna de gravidade (para aceitar valores exportados/copiados do Excel,
// que mostram o rótulo "MENOR GRAVIDADE" em vez da chave "menor_gravidade")
const GRAV_LABEL_TO_KEY=(()=>{
  const m={};
  Object.entries(GRAV_MAP).forEach(([k,v])=>{ m[normHdr(v.label)]=k; m[normHdr(k)]=k; });
  return m;
})();
// Mapa final: qualquer representação -> valor aceito pelo banco (VERMELHO/AMARELO/VERDE/CINZA)
const GRAV_TO_DB={
  emergencia:"VERMELHO",urgencia:"AMARELO",menor_gravidade:"VERDE",agendamento:"CINZA",
  VERMELHO:"VERMELHO",AMARELO:"AMARELO",VERDE:"VERDE",CINZA:"CINZA",
};
function normalizeGravValue(v){
  if(!v)return null;
  // Número = prioridade da ficha CROSS (1 a 4; canon.js, PRIORIDADE_CROSS). Antes o número era descartado em silêncio.
  const mPrio=String(v).trim().match(/^(?:prioridade\s*)?([1-4])$/i);
  if(mPrio&&typeof Canon!=="undefined"&&Canon.gravidadeDePrioridade) return Canon.gravidadeDePrioridade(mPrio[1]).db;
  // 1) tenta label em portugues (ex: "EMERGENCIA" -> "emergencia")
  const intermediate=GRAV_LABEL_TO_KEY[normHdr(v)];
  const key=intermediate||v;
  // 2) converte para o valor aceito pelo banco
  const dbVal=GRAV_TO_DB[key]||GRAV_TO_DB[normHdr(key)];
  return dbVal||null;
}

// Converte data em varios formatos (DD/MM/YYYY, DD/MM/YY, YYYY-MM-DD) para ISO YYYY-MM-DD
// Retorna null se o valor nao for reconhecivel como data valida
function normalizeDateValue(v){
  if(!v)return null;
  v=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v; // ja e ISO
  const br=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(br){
    let [,d,m,y]=br;
    if(y.length===2)y="20"+y;
    return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  return null; // nao reconhecido (ex: "N/A", texto livre) -> null para nao quebrar o banco
}

// Normaliza horario: aceita HH:MM ou HH:MM:SS, retorna HH:MM ou null
function normalizeTimeValue(v){
  if(!v)return null;
  v=String(v).trim();
  // HH:MM:SS -> HH:MM
  const full=v.match(/^(\d{1,2}):(\d{2}):\d{2}$/);
  if(full)return `${full[1].padStart(2,"0")}:${full[2]}`;
  // HH:MM
  if(/^\d{1,2}:\d{2}$/.test(v))return v;
  return null; // nao e horario valido
}

// Normaliza tipo_ambulancia para os valores aceitos pelo banco
function normalizeAmbValue(v){
  if(!v)return null;
  // remove acentos e compara
  const u=String(v).trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  // B5: SBV/SAV/USB/USA sao a nomenclatura corrente do CROSS e antes viravam
  // null em silencio (normalizeRowValues deleta null) -> 56 registros, 44% da
  // base, sem tipo de ambulancia.
  if(u==="BASICA"||u==="BASICO"||u==="SBV"||u==="USB")return "B\u00c1SICA";
  if(u==="AVANCADA"||u==="AVANCADO"||u==="SAV"||u==="USA")return "AVAN\u00c7ADA";
  if(u==="UTI"||u.startsWith("UTI "))return "AVAN\u00c7ADA";   // UTI móvel é avançada (decisão da gestão); deixou de ser opção
  // ja veio com acento certo
  const orig=String(v).trim().toUpperCase();
  if(orig==="B\u00c1SICA")return "B\u00c1SICA";
  if(orig==="AVAN\u00c7ADA")return "AVAN\u00c7ADA";
  return null;
}

const BOOL_FIELDS_SET=new Set(["finalizado","permaneceu"]);
function normalizeBoolValue(v){
  if(v===true||v===false)return v;
  const t=normHdr(v);
  if(["sim","s","true","1","x"].includes(t))return true;
  if(["nao","n","false","0"].includes(t))return false;
  return null; // vazio ou irreconhecível = não informado
}
const DATE_FIELDS=new Set(COLS.filter(([,,,,tipo])=>tipo==="date").map(([f])=>f));
const TIME_FIELDS=new Set(COLS.filter(([,,,,tipo])=>tipo==="time").map(([f])=>f));
function normalizeRowValues(row){
  const out={...row};
  if(out.gravidade!==undefined)out.gravidade=normalizeGravValue(out.gravidade);
  if(out.tipo_ambulancia!==undefined)out.tipo_ambulancia=normalizeAmbValue(out.tipo_ambulancia);
  Object.keys(out).forEach(f=>{
    if(DATE_FIELDS.has(f))out[f]=normalizeDateValue(out[f]);
    if(TIME_FIELDS.has(f))out[f]=normalizeTimeValue(out[f]);
    if(BOOL_FIELDS_SET.has(f))out[f]=normalizeBoolValue(out[f]);
  });
  // remove campos null/undefined para nao mandar strings vazias ao banco
  Object.keys(out).forEach(f=>{ if(out[f]===null||out[f]==="")delete out[f]; });
  return out;
}

// ── Extrai dados de UMA ficha CROSS e retorna objeto com campos da planilha ──
// Substitui o antigo parser de TSV/Excel — agora aceita texto bruto da ficha.
function parseFichaCross(txt){
  if(!txt||!txt.trim()) return null;

  // Nº da ficha — tolera espaços/quebras entre "FICHA N°" e "SS-"
  const mFicha = txt.match(/FICHA\s*N[°º˚o]?\s*[\r\n\s]*(SS-\d+-\d+)/i);
  const ficha_cross = mFicha ? mFicha[1] : "";

  // Data da solicitação (cabeçalho) → ISO para o banco (YYYY-MM-DD)
  const mData = txt.match(/\bData\s*[:\-]?\s*[\r\n\t]*(\d{2}\/\d{2}\/\d{4})/i);
  const data_solicitacao = mData ? normalizeDateValue(mData[1]) : null;

  // Hora da solicitação → HH:MM
  const mHora = txt.match(/\bHora\s*[:\-]?\s*[\r\n\t]*(\d{2}:\d{2})(?::\d{2})?/i);
  const horario_solicitacao = mHora ? mHora[1] : null;

  // Nome do paciente → maiúsculas
  const mNome = txt.match(/Nome\s*(?:do\s*Paciente)?\s*[:\-]?\s*[\r\n\t]*([^\r\n\t]+)/i);
  const nome_paciente = mNome ? mNome[1].trim().replace(/\s+Nome\s+Social.*$/i, "").toUpperCase() : "";

  // Setor: campo "SETOR/LEITO" ou "SETOR" explícito se houver.
  // Sem "SETOR/LEITO" nem "SETOR" na ficha, o setor fica VAZIO (não se assume CLÍNICA MÉDICA).
  // NUNCA usar Unidade Solicitante.
  const mSetorLeito = txt.match(/SETOR\s*[\/]\s*LEITO\s*[:\-]?\s*[\r\n\t]*([^\r\n\t]+)/i);
  const mSetor      = txt.match(/\bSETOR\s*[:\-]?\s*[\r\n\t]*([^\r\n\t]+)/i);
  const setor = mSetorLeito
    ? mSetorLeito[1].trim().toUpperCase()
    : mSetor ? mSetor[1].trim().toUpperCase() : null;

  // 1º Recurso → deduz procedimento e especialidade
  const mRec = txt.match(/1[°º˚o]?\s*Recurso\s*[:\-]?\s*[\r\n\t]*([^\r\n]+)/i);
  const recursoRaw = mRec ? mRec[1].trim() : "";
  let procedimento = null;
  let especialidade = null;
  if(recursoRaw){
    if(/Leito\s+UTI/i.test(recursoRaw)){
      procedimento = "LEITO"; especialidade = "UTI";
    } else if(/Tomografia/i.test(recursoRaw)){
      procedimento = "EXAME"; especialidade = "TOMOGRAFIA";
    } else if(/Resson[aâ]ncia/i.test(recursoRaw)){
      procedimento = "EXAME"; especialidade = "RESSONÂNCIA";
    } else if(/USG|Ultrassom/i.test(recursoRaw)){
      procedimento = "EXAME"; especialidade = "ULTRASSONOGRAFIA";
    } else if(/Raio[\s\-]*X/i.test(recursoRaw)){
      procedimento = "EXAME"; especialidade = "RAIO-X";
    } else if(/Exame/i.test(recursoRaw)){
      procedimento = "EXAME";
      const mExNome = recursoRaw.match(/Exame\s*[-–]\s*(.+)/i);
      especialidade = mExNome ? mExNome[1].trim().toUpperCase() : "EXAME";
    } else if(/Transfer[eê]ncia/i.test(recursoRaw)){
      procedimento = "OUTRO"; especialidade = recursoRaw.toUpperCase();
    } else if(/Leito/i.test(recursoRaw)){
      procedimento = "LEITO";
    } else if(/Especialidade\s*[-–]\s*(.+)/i.test(recursoRaw)){
      procedimento = "AVALIAÇÃO";
      const mEsp = recursoRaw.match(/Especialidade\s*[-–]\s*(.+)/i);
      especialidade = mEsp ? mEsp[1].trim().toUpperCase() : recursoRaw.toUpperCase();
    } else {
      procedimento = "AVALIAÇÃO";
      especialidade = recursoRaw.toUpperCase();
    }
  }

  // CID/Diagnóstico — CID 1 → CID 2 → vazio. NUNCA resumo clínico.
  const mCid1 = txt.match(/CID\s*1\s*[:\-]?\s*[\r\n\t]*([^\r\n\t]+)/i);
  const mCid2 = txt.match(/CID\s*2\s*[:\-]?\s*[\r\n\t]*([^\r\n\t]+)/i);
  const cid1r = mCid1 ? mCid1[1].trim() : "";
  const cid2r = mCid2 ? mCid2[1].trim() : "";
  const cid1 = /n[ãa]o\s*informado/i.test(cid1r) ? "" : cid1r;
  const cid2 = /n[ãa]o\s*informado/i.test(cid2r) ? "" : cid2r;
  const diagnostico = cid1 ? cid1.toUpperCase() : cid2 ? cid2.toUpperCase() : null;

  // Médico: NÃO vem da ficha CROSS (é o médico da escala, preenchido no Kanban/Livro).

  // Gravidade — campo explícito; fallback: varredura no texto
  let gravidade = null;   // ficha sem prioridade: fica VAZIA (não se assume AMARELO); entra no Saneamento de falhas
  const prio = (typeof Canon!=="undefined"&&Canon.lerPrioridadeFicha) ? Canon.lerPrioridadeFicha(txt) : null;
  if(prio) gravidade = prio.db;   // prioridade da ficha CROSS (1 a 4), tabela única em canon.js (PRIORIDADE_CROSS)

  // Status
  let status = null;
  if(/Finalizou\s+a\s+ficha/i.test(txt))
    status = "FICHA ENCERRADA PELO CROSS";
  else if(/Cancelou\s+Solicita[çc][aã]o|Cancelada\s+pelo\s+solicitante/i.test(txt))
    status = "CANCELADA PELO SOLICITANTE";

  // FINALIZAÇÃO da ficha na CROSS: data e hora LOGO ABAIXO do título "FINALIZAÇÃO" (não as do "Médico Receptor", que ficam acima).
  // Regra única em canon.js (Canon.lerFinalizacaoFicha), a mesma do Kanban. Sem o bloco, fica vazio: não se usa a data do
  // "Aceitou Solicitação" no lugar, porque ficha aceita ainda não é ficha finalizada.
  const fin = (typeof Canon!=="undefined"&&Canon.lerFinalizacaoFicha) ? Canon.lerFinalizacaoFicha(txt) : null;
  const data_resposta_cross    = fin ? normalizeDateValue(fin.data) : null;
  const horario_resposta_cross = fin ? fin.hora : null;

  // Instituição destino = "Unidade Receptora" do bloco Resolução (A1/A8), a mesma regra do Kanban (Canon.lerDestinoFicha).
  // Uma unidade que só aparece em "Busca de Recursos" com recusa não vale.
  const instituicao_destino = (typeof Canon!=="undefined"&&Canon.lerDestinoFicha) ? (Canon.lerDestinoFicha(txt)||null) : null;

  // Observação: NÃO vem da ficha CROSS — fica vazia para preenchimento manual.

  // Monta o objeto com os campos internos da planilha de remoção.
  // Só monta se tiver pelo menos ficha ou nome — evita retornar objeto
  // com apenas { gravidade: "AMARELO" } para trechos de cabeçalho sem dados.
  if(!ficha_cross && !nome_paciente) return null;

  const row = {};
  if(ficha_cross)            row.ficha_cross            = ficha_cross;
  if(nome_paciente)          row.nome_paciente           = nome_paciente;
  if(data_solicitacao)       row.data_solicitacao        = data_solicitacao;
  if(horario_solicitacao)    row.horario_solicitacao     = horario_solicitacao;
  if(setor)                  row.setor                   = setor;
  if(procedimento)           row.procedimento            = procedimento;
  if(especialidade)          row.especialidade           = especialidade;
  if(diagnostico)            row.diagnostico             = diagnostico;
  if(gravidade)              row.gravidade               = gravidade;
  if(status)                 row.status                  = status;
  if(data_resposta_cross)    row.data_resposta_cross     = data_resposta_cross;
  if(horario_resposta_cross) row.horario_resposta_cross  = horario_resposta_cross;
  if(instituicao_destino)    row.instituicao_destino     = instituicao_destino;

  return row;
}

// Modal: colar texto bruto da ficha CROSS e importar como novos registros
function PasteModal({onClose,onImport}){
  const [txt,setTxt]=useState("");
  const [busy,setBusy]=useState(false);

  // Divide em blocos por ficha e parseia cada uma
  function parse(){
    const blocos = txt.split(/(?=FICHA\s*N[°º˚o]?\s*[\r\n\s]*SS-\d+-\d+)/i).filter(b=>b.trim());
    if(blocos.length===0) return [];
    return blocos.map(parseFichaCross).filter(Boolean);
  }

  async function doImport(){
    const rows = parse();
    if(rows.length===0){
      alert("Nenhuma ficha CROSS reconhecida.\n\nCole o texto completo copiado da página da ficha no sistema CROSS.");
      return;
    }
    setBusy(true);
    await onImport(rows);
    setBusy(false);
  }

  const preview = txt.trim() ? parse() : [];

  return(
    <div className="mbk">

  const groups=React.useMemo(()=>{
    const norm=s=>(s||"").trim().toUpperCase().replace(/\s+/g," ");
    const map={};
    rows.forEach(r=>{
      const k=norm(r.nome_paciente);
      if(!map[k])map[k]=[];
      map[k].push(r);
    });
    return Object.values(map).filter(g=>g.length>1);
  },[rows]);

  if(groups.length===0) return(
    <div className="mbk">
      <div className="mdl" style={{maxWidth:420}}>

// Hook resize de colunas — usa mousedown no header
// Hook resize — mapa {field: width} em vez de array posicional
// Elimina qualquer problema de índice ao reordenar colunas
function useColResize(initMap){
  const [wmap,setWmap]=useState(initMap);
  const wmapRef=useRef(initMap);
  const drag=useRef(null);
  useEffect(()=>{ wmapRef.current=wmap; },[wmap]);
  function startDrag(field,e){
    e.preventDefault();
    e.stopPropagation();
    const sw=wmapRef.current[field];
    if(sw===undefined||isNaN(sw))return;
    const sx=e.clientX;
    drag.current={field,sx,sw};
    function mv(ev){
      if(!drag.current)return;
      const {field,sx,sw}=drag.current;
      const nw=Math.max(40,sw+(ev.clientX-sx));
      if(isNaN(nw))return;
      setWmap(m=>({...m,[field]:nw}));
    }
    function up(){drag.current=null;window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);}
    window.addEventListener("mousemove",mv);
    window.addEventListener("mouseup",up);
  }
  return {wmap,setWmap,startDrag};
}

// ─── Drag para reordenar colunas ───────────────────────────────────────────
function useColDragOrder(initialOrder){
  const [order,setOrder]=useState(initialOrder);
  const dragIdx=useRef(null);
  const dragOverIdx=useRef(null);

  function onDragStart(i,e){
    dragIdx.current=i;
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain",i);
  }
  function onDragOver(i,e){
    e.preventDefault();
    if(dragIdx.current===null||dragIdx.current===i)return;
    dragOverIdx.current=i;
    // Preview visual: reordena temporariamente
    setOrder(prev=>{
      const next=[...prev];
      const item=next.splice(dragIdx.current,1)[0];
      next.splice(i,0,item);
      dragIdx.current=i; // atualiza origem
      return next;
    });
  }
  function onDragEnd(){
    dragIdx.current=null;
    dragOverIdx.current=null;
  }
  return {order,setOrder,onDragStart,onDragOver,onDragEnd};
}

    ["min_finalizacao_pedido_amb","data_saida_real"],   // vem DEPOIS da linha acima, para cair logo após a hora do pedido
    ["motivo_demora_interna","data_saida_real"],       // logo depois do tempo da CROSS ao pedido da ambulância

  ];
  const inserirNovas = (lista, quais) => {
    quais.forEach(([f,ancora])=>{
      const i=idxCol(f); if(i<0||lista.includes(i)) return;
      const pos=lista.indexOf(idxCol(ancora));
      lista.splice(pos<0?lista.length:pos,0,i);
    });
    return lista;
  };
  // Ordem padrão = o caminho da remoção, da esquerda para a direita (as 4 primeiras colunas ficam fixas):
  //  1) o pedido (clínico)   2) a CROSS (destino → finalização, que é o aceite → status)
  //  3) a ambulância (pedido → saída → espera → equipe → retorno → duração)   4) o desfecho (Finalizado, Permaneceu, Observação)
  const ORDEM_PADRAO = [
    "setor","procedimento","especialidade","diagnostico","gravidade",
    "instituicao_destino","data_resposta_cross","horario_resposta_cross","status",
    "tipo_ambulancia","prefixo_ambulancia","data_saida_ambulancia","hora_solic_ambulancia","min_finalizacao_pedido_amb","motivo_demora_interna","data_saida_real","horario_saida_ambulancia","tempo_espera",
    "medico","enfermeiro","tecnico_auxiliar","data_retorno","horario_retorno","duracao_remocao",
    "finalizado","permaneceu","observacao",
  ];
  const MOV_COLS_DEFAULT = (()=>{
    const l=ORDEM_PADRAO.map(idxCol).filter(i=>i>=0&&!STK_COLS.includes(i));
    // segurança: coluna futura que não esteja na lista vai para o fim, em vez de sumir
    COLS.forEach((_,i)=>{ if(!STK_COLS.includes(i)&&!l.includes(i)) l.push(i); });
    return l;

  const savedOrder=(()=>{
    let sv=loadLS(LS_ORDER,null);

      const v2=loadLS(LS_ORDER_V2,null);
      if(!Array.isArray(v2))return null;
      sv=v2.map(i=>COLS_V2[i]).map(f=>f?idxCol(f):-1).filter(i=>i>=0);
    }
    const ok=sv.filter(i=>Number.isInteger(i)&&i>=0&&i<COLS.length&&!STK_COLS.includes(i));
    // as que a ordem salva ainda não conhece entram antes da sua âncora; qualquer outra faltante vai ao fim
    inserirNovas(ok, COL_NOVAS_ANTES_DE);

  const stkLefts=useMemo(()=>{

    return lefts;
  },[wmap]);
  const tableRef=useRef(null);

  // ── Double-click para auto-fit (Bug 3) ──
  function autoFitCol(field){
    if(!tableRef.current)return;

    const prev=span.style.whiteSpace;
    span.style.whiteSpace='nowrap';
    const needed=span.scrollWidth+28; // padding + seta sort + handle
    span.style.whiteSpace=prev;
    const newW=Math.max(50,Math.min(400,needed));

  // ── Carga por período ──
  // faixa = {ini, fim, rotulo}. O servidor só devolve as remoções desse período (e as sem data); os outros meses
  // continuam salvos no banco e voltam ao trocar o período.
  const faixa=useMemo(()=>faixaPeriodo(periodo,mesSel),[periodo,mesSel]);
  const reqRef=useRef(0);   // evita que uma resposta lenta de um período antigo sobrescreva o período atual
  const load=useCallback(async()=>{

    }

  },[faixa]);
  useEffect(()=>{load();},[load]);

  const handleSave=async(form)=>{
    setSaving(true);
    try{
      let p={...form};
      if(p.hora_solic_ambulancia&&p.horario_saida_ambulancia&&!p.tempo_espera)
        p.tempo_espera=tempoEsperaDe(p);
      if(p.horario_saida_ambulancia&&p.horario_retorno&&!p.duracao_remocao)
        p.duracao_remocao=duracaoDe(p);
      // normaliza gravidade e tipo_ambulancia para os valores aceitos pelo banco
      if(p.gravidade!==undefined&&p.gravidade!==null&&p.gravidade!=="")
        p.gravidade=normalizeGravValue(p.gravidade)||null;
      if(p.tipo_ambulancia!==undefined&&p.tipo_ambulancia!==null&&p.tipo_ambulancia!=="")
        p.tipo_ambulancia=normalizeAmbValue(p.tipo_ambulancia)||null;
      CAMPOS_CALCULADOS.forEach(k=>{delete p[k];});   // calculado pelo banco: não vai no salvar
      Object.keys(p).forEach(k=>{if(p[k]==="")p[k]=null;});
      if(form.id){await api({action:"update",id:form.id,...p});push("Atualizado");}

      // registro com data fora do período exibido não aparece na tabela: avisa, para não parecer que sumiu
      const dr=p.data_solicitacao;

        push(`Salvo com data ${fmtD(dr)}, fora do período exibido (${faixa.rotulo}). Mude o período para vê-lo.`);
    }catch(e){push(e.message||"Erro","err");}
    finally{setSaving(false);}
  };

  const handleCell=async(rowId,field,value)=>{
    try{
      // Booleanos: preservar true/false sem converter para null
      const isBool = (value===true||value===false);
      const safeVal = isBool ? value : (value||null);
      const u={action:"update",id:rowId,[field]:safeVal};
      // Digitou/confirmou uma data: ela deixa de ser "deduzida"
      const flags={};
      if(field==="data_saida_real"){u.data_saida_real_inferida=false;flags.data_saida_real_inferida=false;}
      if(field==="data_retorno"){u.data_retorno_inferida=false;flags.data_retorno_inferida=false;}
      const row=rows.find(r=>r.id===rowId);
      // Saída/retorno: horário sem o dia em que aconteceu NÃO é gravado sozinho. Pergunta o dia (com sugestão) e grava os dois
      // juntos, já como data CONFIRMADA (não "deduzida"). Sem dia anterior para sugerir, pede para preencher antes.
      if(row && safeVal && (field==="horario_saida_ambulancia"||field==="horario_retorno")){
        const ehSaida=field==="horario_saida_ambulancia";
        const campoData=ehSaida?"data_saida_real":"data_retorno";
        if(!row[campoData]){
          const sug=ehSaida?sugerirDiaDoHorario(row.data_saida_ambulancia,row.hora_solic_ambulancia,safeVal):sugerirDiaDoHorario(row.data_saida_real,row.horario_saida_ambulancia,safeVal);
          if(!sug){
            push(ehSaida?"Antes do horário de saída, preencha a DATA SOLIC. AMB. (ou digite direto a DATA SAÍDA AMB.).":"Antes do retorno, preencha a data e o horário da saída da ambulância.","err");
            return;
          }
          const ant=ehSaida?row.data_saida_ambulancia:row.data_saida_real;
          const resp=window.prompt(`Em que dia ${ehSaida?"a ambulância saiu":"a ambulância voltou"}, às ${String(safeVal).slice(0,5)}?  (dd/mm/aaaa)\n\nSugestão: ${fmtD(sug)}${sug!==String(ant).slice(0,10)?" (o horário passou da meia-noite)":""}. Confirme ou corrija.`,fmtD(sug));
          if(resp===null){push("Horário não salvo: sem o dia o painel não sabe quando foi.","err");return;}
          const dia=dataRealIso(resp);
          if(!dia){push("Data inválida (use um dia que exista, no formato dd/mm/aaaa). O horário não foi salvo.","err");return;}
          u[campoData]=dia; u[campoData+"_inferida"]=false; flags[campoData]=dia; flags[campoData+"_inferida"]=false;
        }
      }
      if(row && (field==="data_solicitacao"||field==="horario_solicitacao") && safeVal){
        const avisoSol=checarSolicitacao({...row,[field]:safeVal});
        if(avisoSol){push(avisoSol,"err");return;}
      }
      if(row && CAMPOS_AMBULANCIA.includes(field)){
        const aviso=checarOrdemAmbulancia({...row,[field]:safeVal,...flags});
        if(aviso){push(aviso,"err");return;}
      }
      if(row){
        const m={...row,[field]:safeVal,...flags};   // a linha como ficará depois desta edição
        // se o campo calculado foi limpo (value vazio), recalcula; se foi digitado à mão, vale o digitado
        const teManual=field==="tempo_espera"?value:null;
        const durManual=field==="duracao_remocao"?value:null;
        const te = teManual!==null ? (teManual||tempoEsperaDe(m)) : tempoEsperaDe(m);
        const dur = durManual!==null ? (durManual||duracaoDe(m)) : duracaoDe(m);
        if(te)u.tempo_espera=te;
        if(dur)u.duracao_remocao=dur;

        if(CAMPOS_BASE_MIN_FIN_PED.includes(field)) nx.min_finalizacao_pedido_amb=minFinalPedidoDe(nx);
        return nx;
      }));
      if(field==="data_solicitacao"&&safeVal&&((faixa.ini&&safeVal<faixa.ini)||(faixa.fim&&safeVal>faixa.fim)))
        push(`Data salva (${fmtD(safeVal)}), mas fora do período exibido (${faixa.rotulo}). A linha some desta lista ao recarregar; mude o período para vê-la.`);
    }catch(e){push(e.message,"err");}
  };

  const handleDelete=async(id)=>{

    }catch(e){
      push("Erro ao excluir: "+(e.message||"desconhecido")+" — recarregando a lista.","err");

  };

      try{await api({action:"delete",id});ok++;}

  };

  const [showPaste,setShowPaste]=useState(false);
  const [activeRow,setActiveRow]=useState(null);

  // O Kanban usa gravidades extras (andamento_cor, finalizado_cor) que não existem
  // no enum de gravidade da planilha de remoções — isso causava erro 500 ao importar
  // pela importação do Kanban. Mapeamos para o valor equivalente mais próximo aceito pela planilha.
  // O banco aceita APENAS: VERMELHO, AMARELO, VERDE, CINZA.
  // O kanban usa chaves minúsculas e extras — tudo mapeado aqui.
  const KANBAN_TO_DB_GRAV={
    emergencia:"VERMELHO",urgencia:"AMARELO",menor_gravidade:"VERDE",
    agendamento:"CINZA",andamento_cor:"AMARELO",finalizado_cor:"CINZA",retorno:"CINZA",
    VERMELHO:"VERMELHO",AMARELO:"AMARELO",VERDE:"VERDE",CINZA:"CINZA",
  };
  function normalizeKanbanGrav(v){
    if(!v)return "";   // card sem prioridade: importa sem gravidade (não se assume AMARELO)
    return KANBAN_TO_DB_GRAV[v]||"";
  }

  const handleImport=async(cards)=>{
    let ok=0;
    const fails=[], avisos=[];
    for(const c of cards){
      try{
        // Data e hora da solicitação = abertura da ficha na CROSS (campos "adm" e "hora_adm" do card). Card sem elas ENTRA no
        // banco com esses campos vazios (não se usa "hoje" nem "agora") e a importação mostra um aviso para completar.
        const dSol=normalizeDateValue(c.adm)||"";
        const hSol=normalizeTimeValue(c.hora_adm)||"";
        if(!dSol||!hSol) avisos.push({nome:c.nome||"(sem nome)",erro:"Importado sem "+(!dSol&&!hSol?"data e hora":!dSol?"data":"hora")+" de solicitação. Abra a linha e preencha; enquanto isso ela aparece em Saneamento de falhas."});
        // A finalização da CROSS vem SÓ do par "Finalização CROSS" do card (data_resolucao / hora_resolucao).
        // O "aceite" do Kanban não entra: o modal dele abre com a data e a hora de AGORA, ou seja, o momento em que alguém
        // clicou no app, e não o da CROSS. Card sem finalização preenchida importa com a finalização vazia.
        const fin={d:normalizeDateValue(c.data_resolucao)||"",h:normalizeTimeValue(c.hora_resolucao)||""};
        await api({action:"create",nome_paciente:c.nome||"",setor:c.setor||"",especialidade:c.rec||"",diagnostico:c.hd||"",instituicao_destino:c.hosp||"",tipo_ambulancia:AM[c.amb]||"",gravidade:normalizeKanbanGrav(c.grav),data_solicitacao:dSol,horario_solicitacao:hSol,ficha_cross:c.ficha_cross||"",medico:c.medico_escala||"",data_resposta_cross:fin.d,horario_resposta_cross:fin.h,status:"PACIENTE AGUARDANDO AMBULÂNCIA"});
        ok++;
      }catch(e){fails.push({nome:c.nome||"(sem nome)",erro:e.message||"erro desconhecido"});}
    }
    const total=ok+fails.length;
    push(`${ok}/${total} importado${ok!==1?"s":""}`,fails.length>0?"err":"ok");
    setImportErrors({tipo:"Kanban",ok,total,itens:fails,avisos});
    await load();

  // Importação por JSON: o protocolo de AVC NÃO entra aqui de propósito. Ele sai na exportação (backup), mas só
  // pode voltar quando a Edge Function remocoes-write aceitar o campo `protocolo_avc`.
  const FIELDS=COLS.map(([f])=>f).filter(f=>!CAMPOS_CALCULADOS.has(f));
  const handleImportJSON=async(file)=>{
    if(!file)return;
    try{
      const text=await file.text();
      const json=JSON.parse(text);
      let items=[];
      if(Array.isArray(json))items=json;
      else if(Array.isArray(json.remocoes))items=json.remocoes;
      else{push("JSON inválido: nenhum dado de remoção encontrado no arquivo.","err");return;}
      if(items.length===0){push("Nenhum registro encontrado no arquivo.","err");return;}
      let ok=0;
      const fails=[], avisos=[];
      for(const item of items){
        try{
          const p={};
          FIELDS.forEach(f=>{if(item[f]!==undefined&&item[f]!==null&&item[f]!=="")p[f]=item[f];});
          // arquivo exportado antes: o aceite era coluna própria e é o mesmo momento da finalização
          if(!p.data_resposta_cross&&item.data_aceite_cross)p.data_resposta_cross=item.data_aceite_cross;
          if(!p.horario_resposta_cross&&item.horario_aceite_cross)p.horario_resposta_cross=item.horario_aceite_cross;
          if(Object.keys(p).length===0)continue;
          const pn=normalizeRowValues(p);
          if(!pn.data_solicitacao||!pn.horario_solicitacao) avisos.push({nome:item.nome_paciente||"(sem nome)",erro:"Importado sem "+(!pn.data_solicitacao&&!pn.horario_solicitacao?"data e hora":!pn.data_solicitacao?"data":"hora")+" de solicitação."});
          await api({action:"create",...pn});
          ok++;
        }catch(e){fails.push({nome:item.nome_paciente||"(sem nome)",erro:e.message||"erro desconhecido"});}
      }
      const total=ok+fails.length;
      push(`${ok}/${total} importado${ok!==1?"s":""} do JSON`,fails.length>0?"err":"ok");
      setImportErrors({tipo:"Importar JSON",ok,total,itens:fails,avisos});
      await load();
    }catch(e){push("Erro ao ler arquivo JSON: "+e.message,"err");}
  };

  const [importErrors,setImportErrors]=useState(null); // {tipo, ok, total, itens:[{nome,erro}]}
  const [exportResult,setExportResult]=useState(null); // {tipo, total, filename}
  const [showDuplicates,setShowDuplicates]=useState(false);

        await api({action:"create",...p});ok++;}
      catch(e){fails.push({nome:p.nome_paciente||"(sem nome)",erro:e.message||"erro desconhecido"});}
    }
    const total=ok+fails.length;
    push(`${ok}/${total} importado${ok!==1?"s":""} da planilha`,fails.length>0?"err":"ok");
    setImportErrors({tipo:"Colar do Excel",ok,total,itens:fails,avisos});
    setShowPaste(false);
    await load();
  };

  const [blankRowId,setBlankRowId]=useState(null);
  const handleAddBlank=async()=>{
    try{
      await api({action:"create"});
      const latest=await dbGet("remocoes?select=id&order=created_at.desc&limit=1");
      const newId=Array.isArray(latest)&&latest[0]?latest[0].id:null;

      setBlankRowId(newId);
